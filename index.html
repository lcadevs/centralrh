<style>
:root{
  --pri:#1F3A5F; --pri-600:#2A4A73; --pri-700:#162B47; --pri-50:#E9EEF5; --pri-100:#D2DCE8;
  --gris:#5B6B7B; --gris-50:#EEF1F4;
  --danger:#A63D40; --danger-50:#F7E9E9;
  --warn:#8A6A1E; --warn-50:#F6F1E4;
  --ok:#2E6B4E; --ok-50:#E6F0EA; --ok-100:#CFE2D6; --acero:#3E6A9A;
  --bg:#F3F5F8; --surface:#FFFFFF; --surface-2:#F8F9FB; --line:#E2E6EB; --line-2:#CDD4DC;
  --ink:#1A2230; --ink-2:#4A5568; --ink-3:#7A8594;
  --shadow:0 1px 2px rgba(20,30,45,.06),0 4px 16px rgba(20,30,45,.06);
  --shadow-lg:0 12px 48px rgba(10,20,35,.22);
  --r:16px; --r-sm:10px;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--pri)}
.hidden{display:none!important}
.muted{color:var(--ink-3)} .small{font-size:13px} .xs{font-size:12px} .b{font-weight:700}
.row{display:flex;align-items:center;gap:10px} .wrap{flex-wrap:wrap} .grow{flex:1;min-width:0} .between{justify-content:space-between}
.stack>*+*{margin-top:12px}
h1,h2,h3{margin:0;line-height:1.25} h1{font-size:24px;font-weight:800;letter-spacing:-.01em} h2{font-size:18px;font-weight:700} h3{font-size:15px;font-weight:700}

/* Botones */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid transparent;border-radius:10px;padding:10px 16px;font-weight:600;font-size:14px;background:var(--surface);color:var(--ink);border-color:var(--line-2);transition:background .15s,border-color .15s,transform .05s;white-space:nowrap;text-decoration:none}
.btn:hover{background:var(--surface-2)} .btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.55;cursor:not-allowed}
.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff} .btn.pri:hover{background:var(--pri-600)}
.btn.dan{background:var(--danger);border-color:var(--danger);color:#fff} .btn.dan:hover{filter:brightness(1.07)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--ink-2)} .btn.ghost:hover{background:var(--gris-50)}
.btn.sm{padding:6px 11px;font-size:13px;border-radius:8px}
.btn.icon{padding:7px;border-radius:8px}
.btn svg{width:17px;height:17px;flex:none}
.spin{width:16px;height:16px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .7s linear infinite;display:inline-block}
@keyframes sp{to{transform:rotate(360deg)}}

/* Campos */
.field{display:flex;flex-direction:column;gap:6px}
.field>label,.lbl{font-weight:600;font-size:13.5px;color:var(--ink)}
.req::after{content:" *";color:var(--danger)}
.help{font-size:12.5px;color:var(--ink-3)}
.inp,select.inp,textarea.inp{width:100%;border:1px solid var(--line-2);border-radius:10px;padding:10px 12px;background:#fff;outline:none;transition:border-color .15s,box-shadow .15s}
textarea.inp{min-height:84px;resize:vertical}
.inp:focus{border-color:var(--pri);box-shadow:0 0 0 3px rgba(31,58,95,.16)}
.inp:disabled,.inp[readonly]{background:var(--surface-2);color:var(--ink-2)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.span2{grid-column:1/-1}
@media (max-width:720px){.grid2,.grid3{grid-template-columns:1fr}}
.chk{display:flex;gap:10px;align-items:flex-start;cursor:pointer;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:#fff}
.chk input{width:18px;height:18px;margin:2px 0 0;accent-color:var(--pri);flex:none}
.chk:has(input:checked){border-color:var(--pri);background:var(--pri-50)}
.chk-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}
.days{display:flex;flex-wrap:wrap;gap:8px}
.day{border:1.5px solid var(--line-2);background:#fff;border-radius:999px;padding:8px 16px;font-weight:600;font-size:14px;color:var(--ink-2);user-select:none}
.day.on{background:var(--pri);border-color:var(--pri);color:#fff}
.exc{border:1px solid #E6D9B8;background:var(--warn-50);border-radius:12px;padding:14px}

/* Layout */
.topbar{position:sticky;top:0;z-index:30;background:var(--pri);color:#fff;height:58px;display:flex;align-items:center;padding:0 18px;gap:14px;box-shadow:0 1px 0 rgba(0,0,0,.08)}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:-.01em}
.brand-mark{width:30px;height:30px;border-radius:8px;background:#fff;color:var(--pri);display:grid;place-items:center;font-weight:800;font-size:13px}
.brand small{display:block;font-weight:500;font-size:11.5px;opacity:.8;letter-spacing:.03em;text-transform:uppercase}
.user-chip{display:flex;align-items:center;gap:10px;color:#fff;background:rgba(255,255,255,.12);border:0;border-radius:999px;padding:4px 12px 4px 4px}
.avatar{width:30px;height:30px;border-radius:50%;background:#fff;color:var(--pri);display:grid;place-items:center;font-weight:800;font-size:12px}
.layout{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:calc(100vh - 58px)}
.side{border-right:1px solid var(--line);background:var(--surface);padding:16px 10px;position:sticky;top:58px;height:calc(100vh - 58px);overflow:auto}
.nav a{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:10px;color:var(--ink-2);text-decoration:none;font-weight:600;font-size:14px;margin-bottom:2px}
.nav a:hover{background:var(--surface-2);color:var(--ink)}
.nav a.on{background:var(--pri-50);color:var(--pri)}
.nav a svg{width:19px;height:19px;flex:none}
.nav .sep{height:1px;background:var(--line);margin:10px 8px}
.nav .cap{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3);padding:8px 12px 4px;font-weight:700}
.pill{margin-left:auto;background:var(--danger);color:#fff;border-radius:999px;font-size:11.5px;padding:1px 8px;font-weight:700}
.main{padding:26px clamp(16px,3vw,36px) 60px;max-width:1180px;width:100%}
@media (max-width:900px){
  .layout{grid-template-columns:1fr}
  .side{position:sticky;top:58px;z-index:20;height:auto;padding:8px 10px;border-right:0;border-bottom:1px solid var(--line);overflow-x:auto}
  .nav{display:flex;gap:4px;white-space:nowrap}
  .nav a{margin:0;padding:8px 12px}
  .nav .sep,.nav .cap{display:none}
  .user-chip span{display:none}
  .main{padding:18px 16px 60px}
}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:20px}
.page-head p{margin:4px 0 0;color:var(--ink-2)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.card-b{padding:20px}
.card-h{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.sec-title{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);font-weight:700;margin:0 0 10px}

/* Tiles */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-bottom:22px}
.tile{border-radius:var(--r);padding:16px 18px;color:#fff;text-decoration:none;display:block;box-shadow:var(--shadow);transition:transform .12s}
.tile:hover{transform:translateY(-2px)}
.tile .n{font-size:30px;font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums}
.tile .t{font-size:13px;opacity:.9;font-weight:600}
.t-pri{background:var(--pri)} .t-gris{background:var(--gris)} .t-danger{background:var(--danger)} .t-acero{background:var(--acero)}
.mods{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.mod{display:flex;flex-direction:column;gap:12px;padding:20px;text-decoration:none;color:inherit}
.mod-ic{width:44px;height:44px;border-radius:12px;background:var(--pri-50);color:var(--pri);display:grid;place-items:center}
.mod-ic svg{width:24px;height:24px}
.mod.soon{opacity:.6;border-style:dashed;box-shadow:none}
.alert{border-radius:12px;padding:12px 14px;display:flex;gap:10px;align-items:flex-start;font-size:14px;margin-bottom:16px}
.alert svg{width:18px;height:18px;flex:none;margin-top:2px}
.a-warn{background:var(--warn-50);color:#6E5418;border:1px solid #E6D9B8}
.a-info{background:var(--gris-50);color:#2F3B4A;border:1px solid #D5DDE6}
.a-ok{background:var(--ok-50);color:#24533D;border:1px solid var(--ok-100)}
.a-err{background:var(--danger-50);color:#7A2A2D;border:1px solid #E8C9CA}

/* Tablas */
.tbl-wrap{overflow-x:auto}
table.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:left;font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-3);font-weight:700;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--surface-2);white-space:nowrap}
.tbl td{padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tr.click{cursor:pointer} .tbl tr.click:hover td{background:var(--surface-2)}
.badge{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:700;white-space:nowrap}
.badge::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.s-en_aprobacion,.s-pendiente{background:var(--warn-50);color:#6E5418}
.s-aprobada,.s-aprobado{background:var(--ok-50);color:var(--ok)}
.s-rechazada,.s-rechazado{background:var(--danger-50);color:var(--danger)}
.s-cancelada,.s-omitido,.s-en_espera{background:var(--gris-50);color:var(--gris)}
.s-info_solicitada,.s-info{background:#E8EEF7;color:var(--acero)}
.mini-steps i.info{background:var(--acero)} .tl .dot.info{background:var(--acero);color:#fff}
.files{border:1px dashed var(--line-2);border-radius:12px;padding:10px 12px;background:var(--surface-2)}
.files .fl{display:flex;flex-direction:column;gap:6px;margin-bottom:8px} .files .fl:empty{display:none}
.file-it{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:7px 10px;font-size:13px}
.file-it .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600} .file-it .sz{color:var(--ink-3);font-size:12px}
.opt-nota{margin-top:8px;border-left:4px solid var(--acero);background:#EEF3F9;border-radius:8px;padding:9px 12px;font-size:13px;color:var(--ink)}
.opt-nota.warn{border-color:var(--warn);background:var(--warn-50)} .opt-nota.err{border-color:var(--danger);background:#FDECEC;color:var(--danger);font-weight:600}
.alerta-amb svg{width:20px;height:20px;flex:none;margin-top:1px}
.alerta-amb{display:flex;gap:12px;border:1px solid #E6D9B8;background:var(--warn-50);border-radius:12px;padding:12px 14px;margin-bottom:16px;color:#5E4813}
.qa{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px} .qa .q{font-weight:600} .qa .a{margin-top:8px;padding-top:8px;border-top:1px dashed var(--line)}
.dl-ap{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;font-size:12.5px;margin-top:6px} .dl-ap dt{color:var(--ink-3)} .dl-ap dd{margin:0;font-weight:600}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.mod-pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.tag{display:inline-block;border-radius:6px;padding:2px 8px;font-size:12px;font-weight:600;background:var(--gris-50);color:var(--gris)}
.tag.adm{background:var(--pri-50);color:var(--pri)} .tag.rh{background:var(--warn-50);color:#6E5418} .tag.exc{background:#FDECEC;color:var(--danger);font-weight:700;border:1px solid #F0C4C5} .tag.prb{background:var(--warn-50);color:#6E5418}
.exc-alerta{border:2px solid var(--danger);background:#FDECEC;border-radius:14px;padding:14px 18px;margin-bottom:18px;display:flex;gap:14px;align-items:flex-start;box-shadow:0 0 0 4px rgba(166,61,64,.08)}
.exc-alerta .ic{width:40px;height:40px;border-radius:50%;background:var(--danger);color:#fff;display:grid;place-items:center;flex:none}
.exc-alerta .ic svg{width:22px;height:22px}
.exc-alerta .t{color:var(--danger);font-weight:800;font-size:16px;letter-spacing:.02em;text-transform:uppercase}
.exc-alerta dl{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;margin:8px 0 0;font-size:14px}
.exc-alerta dt{font-weight:700;color:var(--ink-2)} .exc-alerta dd{margin:0}
@keyframes pulso{0%,100%{box-shadow:0 0 0 4px rgba(166,61,64,.08)}50%{box-shadow:0 0 0 8px rgba(166,61,64,.18)}}
.exc-alerta.pulso{animation:pulso 1.6s ease-in-out 3}
.empty{padding:40px 20px;text-align:center;color:var(--ink-3)}
.empty svg{width:40px;height:40px;opacity:.5;margin-bottom:8px}
.mini-steps{display:flex;gap:3px;margin-top:6px}
.mini-steps i{height:5px;width:22px;border-radius:3px;background:var(--line-2)}
.mini-steps i.aprobado{background:var(--ok)} .mini-steps i.pendiente{background:var(--warn)} .mini-steps i.rechazado{background:var(--danger)}

/* Detalle */
.det{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:20px;align-items:start}
@media (max-width:1000px){.det{grid-template-columns:1fr}}
dl.kv{display:grid;grid-template-columns:minmax(140px,36%) 1fr;margin:0}
dl.kv dt{color:var(--ink-2);font-size:13.5px;padding:10px 0;border-bottom:1px solid var(--line)}
dl.kv dd{margin:0;padding:10px 0 10px 12px;border-bottom:1px solid var(--line);font-weight:600;white-space:pre-wrap;word-break:break-word}
@media (max-width:600px){dl.kv{grid-template-columns:1fr} dl.kv dt{border:0;padding-bottom:0} dl.kv dd{padding-left:0}}
.sig-img{height:70px;max-width:240px;object-fit:contain;border-bottom:1.5px solid var(--ink-2);display:block;background:#fff}
.tl{list-style:none;margin:0;padding:0}
.tl li{position:relative;padding:0 0 18px 34px}
.tl li::before{content:"";position:absolute;left:11px;top:26px;bottom:0;width:2px;background:var(--line)}
.tl li:last-child::before{display:none}
.tl .dot{position:absolute;left:0;top:2px;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--gris-50);color:var(--gris);font-size:12px;font-weight:800}
.tl .dot.aprobado{background:var(--ok);color:#fff} .tl .dot.rechazado{background:var(--danger);color:#fff} .tl .dot.pendiente{background:var(--warn);color:#fff}
.tl .dot svg{width:14px;height:14px}
.quote{background:var(--surface-2);border-left:3px solid var(--line-2);padding:8px 12px;border-radius:6px;font-size:13.5px;margin-top:6px;white-space:pre-wrap}

/* Firma */
.sigpad{border:1.5px dashed var(--line-2);border-radius:12px;background:#fff;position:relative;overflow:hidden}
.sigpad canvas{display:block;width:100%;height:170px;touch-action:none;cursor:crosshair}
.sigpad .ph{position:absolute;inset:0;display:grid;place-items:center;color:var(--ink-3);pointer-events:none;font-size:14px}
.sigpad .line{position:absolute;left:24px;right:24px;bottom:38px;border-bottom:1px solid var(--line-2);pointer-events:none}
.sigpad.has .ph{display:none}
.sig-tools{display:flex;justify-content:space-between;align-items:center;margin-top:6px}

/* Login */
.login{min-height:100vh;display:grid;grid-template-columns:1.05fr 1fr}
.login-art{background:var(--pri);color:#fff;padding:48px clamp(28px,5vw,72px);display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}
.login-art::after{content:"";position:absolute;right:-120px;bottom:-120px;width:420px;height:420px;border-radius:50%;border:60px solid rgba(255,255,255,.06)}
.login-art h1{font-size:clamp(28px,3.4vw,40px);line-height:1.12;max-width:15ch;margin:18px 0 14px}
.login-art p{opacity:.85;max-width:44ch}
.login-art ul{list-style:none;padding:0;margin:22px 0 0;display:grid;gap:10px}
.login-art li{display:flex;gap:10px;align-items:center;opacity:.92;font-size:14px}
.login-art li svg{width:18px;height:18px;flex:none}
.login-form{display:grid;place-items:center;padding:32px 20px}
.login-card{width:100%;max-width:420px}
.otp{display:flex;gap:8px;justify-content:space-between}
.otp input{width:100%;max-width:52px;height:58px;text-align:center;font-size:24px;font-weight:800;border:1.5px solid var(--line-2);border-radius:12px;outline:none;background:#fff}
.otp input:focus{border-color:var(--pri);box-shadow:0 0 0 3px rgba(31,58,95,.16)}
@media (max-width:860px){.login{grid-template-columns:1fr}.login-art{padding:28px 20px}.login-art ul,.login-art::after{display:none}.login-art h1{margin:12px 0 6px}}

/* Modal / toast */
.modal-bg{position:fixed;inset:0;background:rgba(15,22,33,.5);z-index:100;display:flex;align-items:flex-start;justify-content:center;padding:5vh 16px;overflow:auto;animation:fi .15s}
.modal{background:#fff;border-radius:18px;box-shadow:var(--shadow-lg);width:100%;max-width:560px;animation:up .18s}
.modal.lg{max-width:860px}
.modal-h{padding:18px 22px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px}
.modal-b{padding:20px 22px}
.modal-f{padding:14px 22px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap;background:var(--surface-2);border-radius:0 0 18px 18px}
@keyframes fi{from{opacity:0}} @keyframes up{from{transform:translateY(12px);opacity:0}}
#toasts{position:fixed;right:16px;bottom:16px;z-index:200;display:flex;flex-direction:column;gap:8px;max-width:calc(100vw - 32px)}
.toast{background:var(--ink);color:#fff;border-radius:12px;padding:12px 16px;box-shadow:var(--shadow-lg);font-size:14px;max-width:420px;animation:up .2s;display:flex;gap:10px;align-items:flex-start}
.toast.err{background:var(--danger)} .toast.ok{background:var(--pri)}

/* Editores admin */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:18px;overflow-x:auto}
.tabs button{border:0;background:none;padding:10px 14px;font-weight:600;color:var(--ink-2);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button.on{color:var(--pri);border-bottom-color:var(--pri)}
.tabs a{padding:10px 14px;font-weight:600;color:var(--ink-2);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;text-decoration:none}
.tabs a.on{color:var(--pri);border-bottom-color:var(--pri)}
.tabs a:hover{color:var(--ink)}
.mod-cap{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);font-weight:700}

/* =====================================================================
   API (todas las llamadas pasan por funciones RPC seguras)
   ===================================================================== */
async function rpc(fn, args = {}) {
  let r;
  try {
    r = await fetch(`${CONFIG.SUPABASE_URL.replace(/\/+$/, '')}/rest/v1/rpc/${fn}`, {
      method: 'POST',
      headers: { apikey: CONFIG.SUPABASE_KEY, 'Content-Type': 'application/json' },
      body: JSON.stringify(args)
    });
  } catch (e) { throw new Error('No hay conexión con el servidor. Revise su internet.'); }
  const txt = await r.text();
  let data; try { data = txt ? JSON.parse(txt) : null; } catch { data = txt; }
  if (!r.ok) {
    const msg = (data && (data.message || data.hint)) || txt || ('Error ' + r.status);
    if (String(msg).includes('SESION_EXPIRADA')) { finSesion(); throw new Error('Su sesión expiró. Ingrese de nuevo.'); }
    if (r.status === 404 && /function|could not find/i.test(msg)) throw new Error('Falta instalar el esquema en Supabase (función ' + fn + ').');
    throw new Error(msg);
  }
  return data;
}
const api = (fn, args = {}) => rpc(fn, { p_token: S.token, ...args });

/* =====================================================================
   UI: toast, modal, botón ocupado
   ===================================================================== */
function toast(msg, tipo = '') {
  const t = document.createElement('div');
  t.className = 'toast ' + tipo; t.innerHTML = esc(msg);
  $('#toasts').appendChild(t);
  setTimeout(() => t.remove(), tipo === 'err' ? 7000 : 4200);
}
function modal({ title, body, actions = [], size = '', onOpen }) {
  const bg = document.createElement('div');
  bg.className = 'modal-bg';
  bg.innerHTML = `<div class="modal ${size}" role="dialog" aria-modal="true">
    <div class="modal-h"><h2>${esc(title)}</h2><button class="btn icon ghost" data-x aria-label="Cerrar">${I.x}</button></div>
    <div class="modal-b">${body}</div>
    ${actions.length ? `<div class="modal-f">${actions.map((a, i) => `<button class="btn ${a.cls || ''}" data-a="${i}">${a.label}</button>`).join('')}</div>` : ''}
  </div>`;
  const close = () => bg.remove();
  bg.addEventListener('mousedown', e => { if (e.target === bg) close(); });
  $('[data-x]', bg).onclick = close;
  actions.forEach((a, i) => { $(`[data-a="${i}"]`, bg).onclick = () => a.onClick ? a.onClick({ close, el: bg, btn: $(`[data-a="${i}"]`, bg) }) : close(); });
  $('#modal-root').appendChild(bg);
  onOpen && onOpen(bg, close);
  return { close, el: bg };
}
function confirmar(title, texto, label = 'Confirmar', cls = 'pri') {
  return new Promise(res => modal({ title, body: `<p style="margin:0">${texto}</p>`,
    actions: [{ label: 'Cancelar', onClick: ({ close }) => { close(); res(false); } },
              { label, cls, onClick: ({ close }) => { close(); res(true); } }] }));
}
async function ocupado(btn, fn) {
  if (!btn) return fn();
  const html = btn.innerHTML; btn.disabled = true; btn.innerHTML = '<span class="spin"></span>' + (btn.textContent.trim() ? ' Procesando…' : '');
  try { return await fn(); } finally { if (btn.isConnected) { btn.disabled = false; btn.innerHTML = html; } }
}

/* =====================================================================
   FIRMA (dibujo)
   ===================================================================== */
class Firma {
  constructor(host) {
    host.innerHTML = `<div class="sigpad"><canvas></canvas><div class="line"></div><div class="ph">${I.pen.replace('<svg', '<svg style="width:18px;height:18px;margin-right:6px;vertical-align:-3px"')}Firme aquí con el mouse o el dedo</div></div>
      <div class="sig-tools"><span class="xs muted">Su firma quedará en el documento final.</span><button type="button" class="btn sm ghost" data-clear>Borrar firma</button></div>`;
    this.wrap = $('.sigpad', host); this.c = $('canvas', host); this.ctx = this.c.getContext('2d');
    this.trazos = 0; this.dibujando = false;
    this.ajustar(); this._ro = new ResizeObserver(() => this.ajustar()); this._ro.observe(this.c);
    const pos = e => { const r = this.c.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
    this.c.addEventListener('pointerdown', e => { e.preventDefault(); this.c.setPointerCapture(e.pointerId); this.dibujando = true; this.last = pos(e); this.ctx.beginPath(); this.ctx.arc(this.last[0], this.last[1], 1.1, 0, Math.PI * 2); this.ctx.fill(); });
    this.c.addEventListener('pointermove', e => { if (!this.dibujando) return; const p = pos(e); this.ctx.beginPath(); this.ctx.moveTo(...this.last); this.ctx.lineTo(...p); this.ctx.stroke(); this.last = p; this.trazos++; this.wrap.classList.add('has'); });
    const fin = () => { this.dibujando = false; };
    this.c.addEventListener('pointerup', fin); this.c.addEventListener('pointercancel', fin);
    $('[data-clear]', host).onclick = () => this.limpiar();
  }
  ajustar() {
    const r = this.c.getBoundingClientRect(); if (!r.width) return;
    const dpr = window.devicePixelRatio || 1;
    if (this.c.width === Math.round(r.width * dpr)) return;
    const prev = this.trazos ? this.c.toDataURL() : null;
    this.c.width = Math.round(r.width * dpr); this.c.height = Math.round(r.height * dpr);
    this.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    Object.assign(this.ctx, { lineWidth: 2.4, lineCap: 'round', lineJoin: 'round', strokeStyle: '#1B2A55', fillStyle: '#1B2A55' });
    if (prev) { const img = new Image(); img.onload = () => this.ctx.drawImage(img, 0, 0, r.width, r.height); img.src = prev; }
  }
  limpiar() { this.ctx.clearRect(0, 0, this.c.width, this.c.height); this.trazos = 0; this.wrap.classList.remove('has'); }
  vacia() { return this.trazos < 4; }
  png() { // recorta y normaliza a 600x200 sobre fondo blanco (≈10–25 KB)
    const W = 600, H = 200, o = document.createElement('canvas'); o.width = W; o.height = H;
    const x = o.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, W, H);
    const d = this.ctx.getImageData(0, 0, this.c.width, this.c.height).data;
    let x0 = this.c.width, y0 = this.c.height, x1 = 0, y1 = 0;
    for (let yy = 0; yy < this.c.height; yy += 2) for (let xx = 0; xx < this.c.width; xx += 2) {
      if (d[(yy * this.c.width + xx) * 4 + 3] > 20) { if (xx < x0) x0 = xx; if (xx > x1) x1 = xx; if (yy < y0) y0 = yy; if (yy > y1) y1 = yy; }
    }
    if (x1 <= x0) return null;
    const pad = 12; x0 = Math.max(0, x0 - pad); y0 = Math.max(0, y0 - pad); x1 = Math.min(this.c.width, x1 + pad); y1 = Math.min(this.c.height, y1 + pad);
    const sw = x1 - x0, sh = y1 - y0, k = Math.min(W / sw, H / sh, 1.6), dw = sw * k, dh = sh * k;
    x.drawImage(this.c, x0, y0, sw, sh, (W - dw) / 2, (H - dh) / 2, dw, dh);
    return o.toDataURL('image/png');
  }
}

async function cargarBase() {

}
async function iniciar() {

function validarForm(formulario, datos) {

    if (f.tipo === 'correo' && v && !/^[^@\s;,]+@[^@\s;,]+\.[^@\s;,]+$/.test(v)) return `Correo inválido en: ${f.label}`;
    if (f.tipo === 'dias' && causasExc(v, f).length && (!datos[f.key + '_excepcion_motivo'] || !datos[f.key + '_excepcion_detalle'])) return `Su solicitud es una excepción (${causasExc(v, f).join(' y ')}): indique el motivo y el detalle.`;
    if (f.tipo === 'archivo' && (v || []).length > (f.max_archivos || 5)) return `En "${f.label}" se permiten máximo ${f.max_archivos || 5} archivo(s).`;
    if (['lista', 'opcion'].includes(f.tipo) && (f.excepcion_opciones || []).includes(v) && f.excepcion_justificar && !datos[f.key + '_excepcion_detalle']) return `Seleccionó "${v}" (excepción): escriba la justificación.`;

    const er = errorRestriccion(f, datos); if (er) return er;

  return null;
}

const POL_CACHE = new Map();
async function abrirPolitica(id, alAbrir) {

  if (!c) { c = { r: await api('rh_politica_archivo', { p_id: id }), imgs: [] }; POL_CACHE.set(id, c); }

  const med = r.medidas || [];

      <div class="polview">${Array.from({ length: r.paginas }, (_, k) => { const [w, hh] = med[k] || [1240, 1754];
        return `<div class="polpage" data-pp="${k + 1}" style="aspect-ratio:${w || 1240}/${hh || 1754}"><span class="spin"></span><img alt="Página ${k + 1}" data-pg="${k + 1}"><span class="polnum">${k + 1} / ${r.paginas}</span></div>`; }).join('')}</div>
      <div class="row wrap between" style="margin-top:12px"><span class="small muted" id="polprog"></span><button class="btn" id="poldl">${I.pdf} Descargar PDF</button></div>`,
    actions: [{ label: 'Cerrar', cls: 'pri' }] });

  const url = d => d.startsWith('data:') ? d : 'data:image/jpeg;base64,' + d;
  const pintar = n => { const img = $(`img[data-pg="${n}"]`, el); if (img && c.imgs[n - 1]) { img.src = url(c.imgs[n - 1]); img.parentNode.classList.add('ok'); } };
  const cargar = async n => {
    if (!c.imgs[n - 1]) for (let t = 1; t <= 3; t++) { try { c.imgs[n - 1] = (await api('rh_politica_leer_pagina', { p_id: id, p_n: n })).imagen; break; } catch (e) { if (t === 3) throw e; await new Promise(z => setTimeout(z, 600 * t)); } }
    pintar(n);
  };
  let listos = 0;
  const prog = () => { const e = $('#polprog', el); if (e) e.textContent = listos < r.paginas ? `Cargando páginas… ${listos} de ${r.paginas}` : `${r.paginas} página(s)`; };
  prog();

    await cargar(1); listos++; prog();
    let sig = 2;
    const trabajador = async () => { while (sig <= r.paginas) { const n = sig++; try { await cargar(n); } catch {} listos++; prog(); } };
    await Promise.all([trabajador(), trabajador(), trabajador(), trabajador()]);

    try {

      if (!window.jspdf) throw new Error('No se pudo cargar el generador de PDF.');
      const doc = new window.jspdf.jsPDF({ unit: 'mm', format: 'a4' });
      for (let k = 0; k < c.imgs.length; k++) {
        // WebP → JPG para el PDF (máxima compatibilidad)
        const im = await new Promise((ok, mal) => { const x = new Image(); x.onload = () => ok(x); x.onerror = mal; x.src = url(c.imgs[k]); });
        const cv = document.createElement('canvas'); cv.width = im.naturalWidth; cv.height = im.naturalHeight;
        const cx = cv.getContext('2d'); cx.fillStyle = '#fff'; cx.fillRect(0, 0, cv.width, cv.height); cx.drawImage(im, 0, 0);
        const w = cv.width, hh = cv.height, horiz = w > hh;
        if (k) doc.addPage('a4', horiz ? 'l' : 'p'); else if (horiz) { doc.deletePage(1); doc.addPage('a4', 'l'); }
        const PW = horiz ? 297 : 210, PH = horiz ? 210 : 297, esc2 = Math.min(PW / w, PH / hh);
        doc.addImage(cv.toDataURL('image/jpeg', .8), 'JPEG', (PW - w * esc2) / 2, (PH - hh * esc2) / 2, w * esc2, hh * esc2, undefined, 'FAST');

    } catch (err) { toast(err.message, 'err'); }
  });
}

const LIBS = {

async function fuentesDePolitica(files) {

    const pg = await fu.doc.getPage(fu.i), v1 = pg.getViewport({ scale: 1 }), vp = pg.getViewport({ scale: POL_ANCHO / v1.width });

async function vistaTodas() {
  const f = JSON.parse(store.get('filtros') || '{}');

  const rows = await api('rh_todas', { p_filtros: f });
  shell('todas', `<div class="page-head"><div><h1>Todas las solicitudes</h1><p>Vista de Recursos Humanos y administradores.</p></div>
      <button class="btn" id="csv">${I.pdf} Exportar CSV</button></div>

      <input class="inp" id="ft" placeholder="Buscar folio, nombre, correo, departamento…" value="${esc(f.texto || '')}" style="max-width:340px">

      <select class="inp" id="fe" style="max-width:200px"><option value="">Todos los estados</option>${['en_aprobacion','aprobada','rechazada','cancelada'].map(e => `<option value="${e}" ${f.estado === e ? 'selected' : ''}>${ESTADOS[e]}</option>`).join('')}</select>
      <span class="small muted">${rows.length} resultado(s)</span></div></div>
      ${tablaSolicitudes(rows, { solicitante: true, vacio: 'No hay solicitudes con esos filtros.' })}</div>`);
  clicFilas();
  let tm; const aplicar = () => { store.set('filtros', JSON.stringify({ texto: $('#ft').value.trim(), estado: $('#fe').value, modulo: $('#fmod')?.value || '' })); vistaTodas(); };
  $('#ft').oninput = () => { clearTimeout(tm); tm = setTimeout(aplicar, 450); };
  $('#fe').onchange = aplicar; if ($('#fmod')) $('#fmod').onchange = aplicar;
  if (f.texto) { const i = $('#ft'); i.focus(); i.setSelectionRange(i.value.length, i.value.length); }
  $('#csv').onclick = () => {
    const cols = ['folio', 'modulo_nombre', 'solicitante_nombre', 'solicitante_email', 'departamento', 'estado', 'excepcion', 'creado_en', 'finalizado_en', 'pdf_enviado_en'];
    // v1.7: un texto que empieza con = + - @ se neutraliza para que Excel no lo ejecute como fórmula
    const q = v => { let t = String(v ?? ''); if (/^[=+\-@\t\r]/.test(t)) t = "'" + t; return `"${t.replace(/"/g, '""')}"`; };
    const csv = '﻿' + [cols.join(';'), ...rows.map(r => cols.map(c => q(c === 'estado' ? ESTADOS[r[c]] : c.endsWith('_en') ? (r[c] ? fmt(r[c]) : '') : r[c])).join(';'))].join('\n');

    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv' })); a.download = 'solicitudes_rh.csv'; a.click();
  };
}

function valorTexto(f, datos) {
  const v = datos[f.key];
  if (f.tipo === 'dias') return (v || []).map(d => DIAS[d] || d).join(', ') || '—';
  if (f.tipo === 'casillas') return (v || []).join(', ') || '—';
  if (f.tipo === 'si_no') return v ? 'Sí' : 'No';
  if (f.tipo === 'fecha') return fmtISO(v);
  if (f.tipo === 'archivo') return (v || []).map(x => x.nombre).join(', ') || '—';
  if (f.tipo === 'periodo') return (v || '—') + (datos[f.key + '_rango'] ? ` (${datos[f.key + '_rango']})` : '');
  return (v == null || v === '') ? '—' : String(v);
}
function filasDatos(s) {
  const out = [];
  (s.formulario || []).forEach(f => {
    out.push([f.label, valorTexto(f, s.datos)]);
    if (f.tipo === 'dias' && s.datos[f.key + '_excepcion_motivo']) {
      if (s.datos[f.key + '_excepcion_causa']) out.push(['Causa de la excepción', s.datos[f.key + '_excepcion_causa']]);
      out.push(['Motivo de la excepción', s.datos[f.key + '_excepcion_motivo']]);
      out.push(['Detalle de la excepción', s.datos[f.key + '_excepcion_detalle'] || '—']);
    }
    if (['lista', 'opcion', 'periodo'].includes(f.tipo) && s.datos[f.key + '_excepcion_detalle']) out.push(['Justificación de la excepción', s.datos[f.key + '_excepcion_detalle']]);
  });
  return out;
}
// Datos que registró el aprobador (monto, porcentaje, fecha…)
const datosAprobTxt = a => (a.datos_def || []).filter(d => a.datos && a.datos[d.key] != null && a.datos[d.key] !== '')
  .map(d => [d.label, d.tipo === 'fecha' ? fmtISO(a.datos[d.key]) : d.tipo === 'numero' ? Number(a.datos[d.key]).toLocaleString('es-CR', { maximumFractionDigits: 2 }) : String(a.datos[d.key])]);
// Lo que dice la política para la opción elegida (porcentaje, tope)
function detalleElegido(s) {
  for (const f of (s.formulario || [])) { const d = (f.detalle_opciones || {})[s.datos[f.key]]; if (d) return { campo: f, valor: s.datos[f.key], d }; }
  return null;
}
function pistaPolitica(s) {
  const x = detalleElegido(s); if (!x) return '';
  const p = [x.d.porcentaje != null ? `reembolso <b>${x.d.porcentaje} %</b>` : '', x.d.tope ? `tope anual <b>US$${Number(x.d.tope).toLocaleString('es-CR')}</b>` : '', x.d.antiguedad_meses ? `antigüedad mínima ${x.d.antiguedad_meses} mes(es)` : ''].filter(Boolean);
  return p.length ? `Según la política para <b>${esc(x.valor)}</b>: ${p.join(' · ')}.` : '';
}
function sugerencia(d, s) {
  if (d.sugerir === 'hoy' || (d.tipo === 'fecha' && d.key.includes('aprobacion'))) return hoy();
  const x = detalleElegido(s); if (x && d.sugerir && x.d[d.sugerir] != null) return x.d[d.sugerir];
  return '';
}

/* =====================================================================
   PDF (se genera en el navegador; no se almacena)
   ===================================================================== */
const latin = s => String(s ?? '').normalize('NFC').replace(/[‘’]/g, "'").replace(/[“”]/g, '"').replace(/[–—]/g, '-').replace(/…/g, '...').replace(/[^\x09\x0A\x0D\x20-\x7E\xA0-\xFF]/g, '');
async function construirPDF(D) {
  if (!window.jspdf) throw new Error('No se pudo cargar el generador de PDF. Revise su conexión.');
  const s = D.solicitud, ap = (D.aprobaciones || []).filter(a => a.estado !== 'omitido');
  const doc = new window.jspdf.jsPDF({ unit: 'mm', format: 'a4' });
  const W = 210, M = 16, CW = W - 2 * M, AZUL = '#1F3A5F', TINTA = '#1A2230', GRIS = '#4A5568', LINEA = '#E2E6EB';
  let y = 0;
  const nueva = () => { doc.addPage(); y = 20; };
  const espacio = h => { if (y + h > 280) nueva(); };
  const T = (txt, x, yy, o = {}) => doc.text(Array.isArray(txt) ? txt.map(latin) : latin(txt), x, yy, o);
  const split = (txt, w) => doc.splitTextToSize(latin(txt), w);

  // Encabezado
  doc.setFillColor(AZUL); doc.rect(0, 0, W, 30, 'F');
  doc.setTextColor('#FFFFFF'); doc.setFont('helvetica', 'bold'); doc.setFontSize(16); T(S.empresa, M, 13);
  doc.setFont('helvetica', 'normal'); doc.setFontSize(9); T(S.app + ' · Recursos Humanos', M, 19.5);
  doc.setFont('helvetica', 'bold'); doc.setFontSize(12); T(s.folio, W - M, 13, { align: 'right' });
  doc.setFont('helvetica', 'normal'); doc.setFontSize(8.5); T('Documento final', W - M, 19.5, { align: 'right' });
  y = 42;
  doc.setTextColor(TINTA); doc.setFont('helvetica', 'bold'); doc.setFontSize(17); T(D.modulo_nombre, M, y);
  doc.setFillColor('#E6F0EA'); doc.roundedRect(W - M - 36, y - 6, 36, 8.5, 2, 2, 'F');
  doc.setTextColor('#2E6B4E'); doc.setFontSize(9.5); T('APROBADA', W - M - 18, y - 0.4, { align: 'center' });
  if (s.excepcion) {
    const kd = ((s.formulario || []).find(f => f.tipo === 'dias') || {}).key || 'dias';
    const causa = s.datos._exc_causa || s.datos[kd + '_excepcion_causa'];
    y += 5; doc.setFillColor('#FDECEC'); doc.setDrawColor('#A63D40'); doc.setLineWidth(0.5); doc.roundedRect(M, y, CW, 9, 2, 2, 'FD');
    doc.setTextColor('#A63D40'); doc.setFont('helvetica', 'bold'); doc.setFontSize(9.5);
    T(split('EXCEPCION A LA POLITICA APROBADA' + (causa ? ' - ' + causa : ''), CW - 8)[0], M + 4, y + 6);
    y += 9;
  }
  y += 6; doc.setFont('helvetica', 'normal'); doc.setFontSize(9); doc.setTextColor(GRIS);
  T(`Enviada: ${fmt(s.creado_en)}    Aprobación final: ${fmt(s.finalizado_en)}${s.version > 1 ? '    Versión ' + s.version : ''}`, M, y); y += 7;
  if (s.textos?.intro) { doc.setFont('helvetica', 'italic'); doc.setFontSize(8.5); doc.setTextColor(GRIS); const l = split(s.textos.intro, CW); T(l, M, y); y += l.length * 3.8 + 4; }

  // Datos
  const seccion = (t, min = 14) => { espacio(min); doc.setFont('helvetica', 'bold'); doc.setFontSize(10); doc.setTextColor(AZUL); T(t.toUpperCase(), M, y); y += 2; doc.setDrawColor(AZUL); doc.setLineWidth(0.5); doc.line(M, y, W - M, y); y += 6; };
  seccion('Información de la solicitud');
  const LW = 62;
  filasDatos(s).concat([['Correo del solicitante', s.solicitante_email]]).forEach(([k, v]) => {
    doc.setFontSize(9.5); doc.setFont('helvetica', 'normal');
    const lk = split(k, LW - 4); doc.setFont('helvetica', 'bold'); const lv = split(v, CW - LW);
    const h = Math.max(lk.length, lv.length) * 4.4 + 3;
    espacio(h);
    doc.setFont('helvetica', 'normal'); doc.setTextColor(GRIS); T(lk, M, y);
    doc.setFont('helvetica', 'bold'); doc.setTextColor(TINTA); T(lv, M + LW, y);
    y += h - 1; doc.setDrawColor(LINEA); doc.setLineWidth(0.2); doc.line(M, y - 2.2, W - M, y - 2.2); y += 1.5;
  });
  if (s.textos?.declaracion) {
    y += 2; doc.setFont('helvetica', 'normal'); doc.setFontSize(9); doc.setTextColor(TINTA);
    const l = split('[X]  ' + s.textos.declaracion, CW); espacio(l.length * 4 + 4); T(l, M, y); y += l.length * 4 + 4;
  }
  if (s.politica_id) {
    doc.setFont('helvetica', 'bold'); doc.setFontSize(9); doc.setTextColor(AZUL); espacio(6);
    T(`Política aceptada: ${s.politica_titulo}${s.politica_version ? ' (versión ' + s.politica_version + ')' : ''} - ${fmt(s.politica_aceptada_en)}`, M, y); y += 6;
  }

  // Firma del solicitante
  const bloqueFirma = (img, titulo, nombre, detalle, extra) => {
    const lx = extra ? split(extra, CW - 70) : [];
    const h = Math.max(30, 16 + lx.length * 3.8);
    espacio(h + 4);
    doc.setDrawColor(LINEA); doc.setLineWidth(0.3); doc.roundedRect(M, y, CW, h, 2, 2);
    if (img) { try { doc.addImage(img, 'PNG', M + 3, y + 2, 60, 20, undefined, 'FAST'); } catch {} }
    doc.setDrawColor('#9AA4B1'); doc.line(M + 4, y + 23, M + 62, y + 23);
    doc.setFontSize(7.5); doc.setTextColor(GRIS); doc.setFont('helvetica', 'normal'); T('Firma', M + 4, y + 26.5);
    const x2 = M + 70;
    doc.setFont('helvetica', 'bold'); doc.setFontSize(9.5); doc.setTextColor(AZUL); T(titulo, x2, y + 6);
    doc.setTextColor(TINTA); doc.setFontSize(10); T(nombre, x2, y + 11.5);
    doc.setFont('helvetica', 'normal'); doc.setFontSize(8.5); doc.setTextColor(GRIS); T(detalle, x2, y + 16);
    if (lx.length) { doc.setTextColor(TINTA); T(lx, x2, y + 20.5); }
    y += h + 4;
  };
  seccion('Firma del solicitante', 48);
  bloqueFirma(s.firma_solicitante, 'Solicitante', s.solicitante_nombre, `${s.solicitante_email} · ${fmt(s.creado_en)}`);

  seccion('Flujo de aprobación', 48);
  ap.forEach((a, i) => bloqueFirma(a.firma, `${i + 1}. ${a.paso} - ${ESTADOS[a.estado] || a.estado}`, a.resuelto_por_nombre || '-',
    `${a.resuelto_por_email || ''} · ${fmt(a.resuelto_en)}`, [a.comentario ? 'Comentario: ' + a.comentario : '', ...datosAprobTxt(a).map(([k, v]) => `${k}: ${v}`)].filter(Boolean).join('  |  ')));
  if ((s.intercambios || []).length) {
    seccion('Información adicional solicitada');
    s.intercambios.forEach(x => { const l = split(`${x.paso} (${x.por_nombre}, ${fmt(x.en)}): ${x.pregunta}`, CW), r = split(`Respuesta (${fmt(x.respondido_en)}): ${x.respuesta || '-'}${(x.adjuntos || []).length ? '  [Adjuntos: ' + x.adjuntos.map(a => a.nombre).join(', ') + ']' : ''}`, CW - 4);
      espacio((l.length + r.length) * 4.2 + 4); doc.setFontSize(9); doc.setFont('helvetica', 'bold'); doc.setTextColor(TINTA); T(l, M, y); y += l.length * 4.2;
      doc.setFont('helvetica', 'normal'); doc.setTextColor(GRIS); T(r, M + 4, y); y += r.length * 4.2 + 3; });
  }

  if (s.textos?.msg_aprobado) { const l = split(s.textos.msg_aprobado, CW - 8); espacio(l.length * 4.5 + 8);
    doc.setFillColor('#E9EEF5'); doc.roundedRect(M, y, CW, l.length * 4.5 + 6, 2, 2, 'F');
    doc.setFont('helvetica', 'bold'); doc.setFontSize(9.5); doc.setTextColor(AZUL); T(l, M + 4, y + 5.5); y += l.length * 4.5 + 10; }

  // Pie
  const n = doc.getNumberOfPages(), gen = fmt(new Date());
  for (let p = 1; p <= n; p++) {
    doc.setPage(p); doc.setDrawColor(LINEA); doc.setLineWidth(0.2); doc.line(M, 285, W - M, 285);
    doc.setFont('helvetica', 'normal'); doc.setFontSize(7.5); doc.setTextColor('#7A8594');
    T(`Documento generado electrónicamente el ${gen} a partir de los registros de ${S.app}. Folio ${s.folio}.`, M, 289.5);
    T(`Página ${p} de ${n}`, W - M, 289.5, { align: 'right' });
  }
  return doc;
}

/* =====================================================================
   TRÁMITE · CONFIGURACIÓN PROPIA (pestañas según el rol)
   ===================================================================== */
const kb = n => n > 1048576 ? (n / 1048576).toFixed(1) + ' MB' : Math.max(1, Math.round(n / 1024)) + ' KB';
async function vistaModulo(codigo, tab) {
  cargando('mod_' + codigo);
  await cargarBase();
  const m = S.modulos.find(x => x.codigo === codigo);
  if (!m) { location.hash = '#/'; return; }
  const tabs = [['politica', 'Política y plazos', esRH()], ['formulario', 'Formulario', esAdmin()], ['flujo', 'Flujo de aprobación', esAdmin()],
                ['textos', 'Textos y mensajes', esAdmin()], ['general', 'General', esAdmin()]]
               .filter(t => t[2]);
  if (tab === 'responsables') { location.hash = '#/departamentos'; return; }
  if (!tabs.some(t => t[0] === tab)) tab = tabs[0][0];
  const editor = ['formulario', 'flujo', 'textos', 'general'].includes(tab);
  if (editor && (!ED || ED.codigo !== codigo || !ED._sucio)) { ED = JSON.parse(JSON.stringify(m)); ED.textos = ED.textos || {}; ED._sucio = false; }
  const acciones = editor ? `${ED._sucio ? '<span class="small" style="color:var(--warn);font-weight:600">Cambios sin guardar</span>' : ''}
      <button class="btn" id="prev">Vista previa</button><button class="btn pri" id="guardar">${I.check} Guardar cambios</button>` : '';
  shell('mod_' + codigo, `<div class="page-head"><div><div class="mod-cap">Configuración del trámite</div><h1 style="margin-top:4px">${esc(m.nombre)}</h1>
      <p>Lo que configure aquí aplica solo a este trámite.${editor ? ' Formulario, flujo, textos y general se guardan juntos.' : ''}</p></div><div class="row wrap">${acciones}</div></div>
    <div class="tabs">${tabs.map(([k, l]) => `<a href="#/modulo/${esc(codigo)}/${k}" class="${k === tab ? 'on' : ''}">${l}</a>`).join('')}</div>
    <div id="edbody"></div>`);
  if (editor) {
    const marcar = () => { if (!ED._sucio) { ED._sucio = true; const g = $('#guardar'); if (g && !$('.page-head .row .small')) g.insertAdjacentHTML('beforebegin', '<span class="small" style="color:var(--warn);font-weight:600">Cambios sin guardar</span>'); } };
    ['input', 'change'].forEach(ev => $('#edbody').addEventListener(ev, marcar));
    $('#edbody').addEventListener('click', e => { if (e.target.closest('[data-mv],[data-rm],.day,#addp')) marcar(); });
    $('#guardar').onclick = e => ocupado(e.currentTarget, async () => {
      try { const { _sucio, ...datos } = ED; await api('rh_admin_guardar_modulo', { p_modulo: datos }); ED._sucio = false; toast('Cambios guardados.', 'ok'); vistaModulo(codigo, tab); }
      catch (err) { toast(err.message, 'err'); }
    });
    $('#prev').onclick = () => { PER_CTX = ED.opciones?.periodos || []; modal({ title: 'Vista previa · ' + ED.nombre, size: 'lg', body: `${ED.textos.intro ? `<div class="alert a-info">${I.shield}<div class="small">${esc(ED.textos.intro)}</div></div>` : ''}<div class="grid2" id="pv">${ED.formulario.map(f => campoHTML(f, valorAuto(f))).join('')}</div>
        ${ED.textos.declaracion ? `<label class="chk" style="margin-top:16px"><input type="checkbox"><span><b>Declaración.</b> ${esc(ED.textos.declaracion)}</span></label>` : ''}`, onOpen: el => enlazarForm(el, ED.formulario) }); };
    return ({ formulario: edFormulario, flujo: edFlujo, textos: edTextos, general: edGeneral })[tab]();
  }
  if (tab === 'responsables') return tabResponsables(m);
  return tabPolitica(m);
}

        <div class="field" style="width:150px"><label>Días permitidos</label><input class="inp" type="number" min="0" max="7" id="diaspol" value="${esc(fd.max_politica || '')}" placeholder="Sin límite"></div>
        <button class="btn pri" id="gdias">${I.check} Guardar</button>
        <span class="small ${fd.max_politica ? '' : 'muted'}" style="padding-bottom:10px">${fd.max_politica ? `Vigente: <b>${fd.max_politica} día(s)</b>` : 'Sin límite definido'}</span>
      </div></div>` : ''}
    ${(m.formulario || []).some(f => f.tipo === 'periodo') ? `<div class="card" style="margin-bottom:18px"><div class="card-h"><h2>Períodos de aplicación</h2><div class="row wrap" style="gap:8px"><button class="btn" id="addanio">${I.plus} Agregar año</button><button class="btn pri" id="gper">${I.check} Guardar períodos</button></div></div>
      <div class="card-b stack"><p class="small muted" style="margin:0">Solo entre estas fechas la solicitud se tramita de forma <b>normal</b>. Si alguien la envía en otra fecha, queda como <b>fuera de período</b>: debe justificarla, pasa por los pasos de excepción del flujo y el aprobador ve la alerta de excepción.</p>
        <div id="pers"></div></div></div>` : ''}
    ${m.opciones?.beneficio ? `<div class="card" style="margin-bottom:18px"><div class="card-b row wrap" style="gap:16px;align-items:flex-end">
        <div class="grow" style="min-width:240px"><h3>Presupuesto anual</h3>
          <p class="small muted" style="margin:4px 0 0">Base del indicador de presupuesto en <a href="#/reportes/${esc(m.codigo)}/beneficio">Reportes</a>: se compara con lo aprobado (monto que registra el aprobador final) y lo reembolsado.</p>
          <div class="small" style="margin-top:6px">${Object.entries(m.opciones.beneficio.presupuestos || {}).sort().map(([a, v]) => `<span class="tag">${a}: ${(m.opciones.beneficio.moneda === 'USD' ? 'US$' : '') + Number(v).toLocaleString('es-CR')}</span>`).join(' ') || '<span class="muted">Sin presupuestos definidos</span>'}</div></div>
        <div class="field" style="width:110px"><label>Año</label><input class="inp" type="number" id="pres_a" value="${hoy().slice(0, 4)}"></div>
        <div class="field" style="width:170px"><label>Monto (${esc(m.opciones.beneficio.moneda || 'USD')})</label><input class="inp" type="number" min="0" step="100" id="pres_m" placeholder="Vacío = quitar"></div>
        <button class="btn pri" id="gpres">${I.check} Guardar</button></div></div>` : ''}
    <div class="card" style="margin-bottom:18px"><div class="card-b row wrap" style="gap:16px;align-items:flex-end">
        <div class="grow" style="min-width:240px"><h3>Recordatorios al aprobador</h3>
          <p class="small muted" style="margin:4px 0 0">El <b>solicitante</b> puede enviar un recordatorio cuando un paso lleva estos días sin respuesta (máx. uno cada 24 h). RH puede enviarlo en cualquier momento.</p></div>
        <div class="field" style="width:150px"><label>Días de espera</label><input class="inp" type="number" min="1" max="60" id="diasrec" value="${esc(m.dias_recordatorio || 6)}"></div>
        <button class="btn pri" id="grec">${I.check} Guardar</button>
        <span class="small" style="padding-bottom:10px">Vigente: <b>${m.dias_recordatorio || 6} día(s)</b></span>
      </div></div>
    <div class="grid2" style="grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);align-items:start">
      <form class="card" id="fp"><div class="card-h"><h2>Publicar política</h2></div><div class="card-b stack">
        <div class="field"><label class="req">Título</label><input class="inp" id="pt" placeholder="Ej. P-DRH-15 Política para regular el teletrabajo"></div>
        <div class="field"><label>Versión</label><input class="inp" id="pv" placeholder="Ej. 06"></div>
        <div class="field"><label class="req">Archivo de la política (solo PDF)</label><input class="inp" id="pf" type="file" accept=".pdf,application/pdf">
          <div class="alert a-info" style="margin:6px 0 0;padding:10px 12px">${I.info}<div class="small"><b>Solo se aceptan archivos PDF.</b> Si la política está en Word: <b>Archivo → Guardar como → PDF</b> y suba ese archivo. Se convierte en imágenes livianas para que abra rápido en computadora y celular.</div></div></div>
        <label class="chk"><input type="checkbox" id="pvig" checked><span><b>Publicar como vigente</b><br><span class="small muted">Reemplaza a la vigente actual para las solicitudes nuevas. Las ya enviadas conservan la que aceptaron.</span></span></label>
        <button class="btn pri">${I.book} Publicar</button></div></form>
      <div class="card"><div class="card-h"><h2>Historial de políticas</h2></div>
        ${!rows.length ? `<div class="empty">${I.book}<div>Aún no hay políticas publicadas para este trámite.</div></div>` : `<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Política</th><th>Publicada</th><th>Aceptaciones</th><th></th></tr></thead><tbody>
        ${rows.map(p => `<tr><td><b>${esc(p.titulo)}</b>${p.version ? ` <span class="tag">v${esc(p.version)}</span>` : ''}${p.vigente ? ' <span class="badge s-aprobada">Vigente</span>' : ''}
            <div class="xs muted">${esc(p.archivo_nombre)} · ${p.paginas ? p.paginas + ' pág. · ' : ''}${kb(p.tamano)}</div></td>
          <td class="small">${fmtD(p.creado_en)}<div class="xs muted">${esc(p.subido_por || '')}</div></td><td class="small">${p.aceptaciones}</td>
          <td style="text-align:right;white-space:nowrap"><button class="btn sm" data-ver="${p.id}">Abrir</button>
            ${p.vigente ? '' : `<button class="btn sm" data-vig="${p.id}">Hacer vigente</button>`}
            ${p.aceptaciones ? '' : `<button class="btn sm ghost icon" data-del="${p.id}" title="Eliminar">${I.trash}</button>`}</td></tr>`).join('')}
        </tbody></table></div>`}</div></div>`;
  if ($('#pers')) {
    const PL = (m.opciones?.periodos || []).map(x => ({ ...x }));
    const anios = new Set(PL.map(x => x.anio));
    const pintar = () => {
      const lista = [...anios].sort();
      $('#pers').innerHTML = lista.length ? lista.map(a => `<div class="fcard" style="margin-bottom:10px"><div class="row between wrap" style="margin-bottom:8px"><b>${a}</b>
          <div class="row" style="gap:6px"><button class="btn sm ghost" data-addp="${a}">${I.plus} Agregar período</button><button class="btn sm ghost icon" data-rmanio="${a}" title="Quitar año" style="color:var(--danger)">${I.trash}</button></div></div>
        ${PL.map((x, k) => [x, k]).filter(([x]) => x.anio === a).map(([x, k]) => `<div class="row wrap" style="gap:8px;margin-top:6px" data-pk="${k}">
          <input class="inp" data-pp="nombre" value="${esc(x.nombre)}" style="max-width:200px" placeholder="Período 1">
          <span class="small muted">del</span><input class="inp" type="date" data-pp="desde" value="${esc(x.desde)}" style="max-width:170px">
          <span class="small muted">al</span><input class="inp" type="date" data-pp="hasta" value="${esc(x.hasta)}" style="max-width:170px">
          ${x.desde <= hoy() && hoy() <= x.hasta ? '<span class="badge s-aprobada">Abierto hoy</span>' : x.hasta < hoy() ? '<span class="badge s-cancelada">Cerrado</span>' : '<span class="badge s-en_espera">Próximo</span>'}
          <button class="btn sm ghost icon" data-rmp="${k}" title="Quitar" style="color:var(--danger)">${I.x}</button></div>`).join('') || '<div class="xs muted">Sin períodos en este año.</div>'}</div>`).join('')
        : '<div class="small muted">No hay períodos definidos: todas las solicitudes se tramitarán como fuera de período. Use <b>Agregar año</b>.</div>';
    };
    pintar();
    $('#pers').oninput = e => { const r = e.target.closest('[data-pk]'); if (r && e.target.dataset.pp) PL[+r.dataset.pk][e.target.dataset.pp] = e.target.value; };
    $('#pers').onclick = e => {
      const ap = e.target.closest('[data-addp]'), rp = e.target.closest('[data-rmp]'), ra = e.target.closest('[data-rmanio]');
      if (ap) { const a = +ap.dataset.addp, n = PL.filter(x => x.anio === a).length + 1; PL.push({ anio: a, nombre: 'Período ' + n, desde: `${a}-01-01`, hasta: `${a}-01-31` }); pintar(); }
      if (rp) { PL.splice(+rp.dataset.rmp, 1); pintar(); }
      if (ra) { const a = +ra.dataset.rmanio; for (let k = PL.length - 1; k >= 0; k--) if (PL[k].anio === a) PL.splice(k, 1); anios.delete(a); pintar(); }
    };
    $('#addanio').onclick = () => { const a = Math.max(+hoy().slice(0, 4), ...anios) + (anios.size ? 1 : 0);
      anios.add(a); PL.push({ anio: a, nombre: 'Período 1', desde: `${a}-03-01`, hasta: `${a}-03-31` }, { anio: a, nombre: 'Período 2', desde: `${a}-07-01`, hasta: `${a}-07-31` }); pintar(); };
    $('#gper').onclick = e => ocupado(e.currentTarget, async () => {
      try { await api('rh_modulo_periodos', { p_modulo: m.codigo, p_periodos: PL.map(({ nombre, desde, hasta }) => ({ nombre, desde, hasta })) });
        toast('Períodos guardados.', 'ok'); await cargarBase(); recargar(); } catch (err) { toast(err.message, 'err'); } });
  }
  if ($('#gpres')) $('#gpres').onclick = e => ocupado(e.currentTarget, async () => {
    try { const v = $('#pres_m').value; await api('rh_modulo_presupuesto', { p_modulo: m.codigo, p_anio: +$('#pres_a').value, p_monto: v === '' ? null : +v });
      toast('Presupuesto guardado.', 'ok'); await cargarBase(true); recargar(); } catch (err) { toast(err.message, 'err'); } });
  $('#grec').onclick = e => ocupado(e.currentTarget, async () => {
    try { const r = await api('rh_dias_recordatorio', { p_modulo: m.codigo, p_dias: +$('#diasrec').value }); toast(`El solicitante podrá recordar tras ${r.dias} día(s) sin respuesta.`, 'ok'); recargar(); }
    catch (err) { toast(err.message, 'err'); } });
  if (fd) $('#gdias').onclick = e => ocupado(e.currentTarget, async () => {
    const v = $('#diaspol').value;
    try { const r = await api('rh_dias_politica', { p_modulo: m.codigo, p_dias: v === '' ? 0 : +v });
      toast(r.dias ? `Política: hasta ${r.dias} día(s); más días se tramitan como excepción.` : 'Sin límite de días.', 'ok'); recargar(); }
    catch (err) { toast(err.message, 'err'); } });
  $('#fp').onsubmit = e => { e.preventDefault(); ocupado($('#fp button.pri'), async () => {
    const files = [...$('#pf').files], btn = $('#fp button.pri');
    if (!$('#pt').value.trim()) return toast('Escriba el título.', 'err');
    if (!files.length) return toast('Seleccione el archivo PDF.', 'err');
    if (files.some(f => !(/\.pdf$/i.test(f.name) || f.type === 'application/pdf'))) return toast('Solo se aceptan archivos PDF. Si está en Word: Archivo → Guardar como → PDF.', 'err');
    if (files.reduce((a, f) => a + f.size, 0) > 60 * 1024 * 1024) return toast('Los archivos suman más de 60 MB.', 'err');
    try {
      btn.innerHTML = '<span class="spin"></span> Leyendo archivo…';
      const fuentes = await fuentesDePolitica(files);
      if (!fuentes.length) throw new Error('El archivo no tiene páginas.');
      if (fuentes.length > 80) throw new Error(`La política tiene ${fuentes.length} páginas; el máximo es 80.`);
      const { id } = await api('rh_politica_iniciar', { p_modulo: m.codigo, p_titulo: $('#pt').value, p_version: $('#pv').value,
        p_archivo_nombre: files.map(f => f.name).join(', ').slice(0, 200), p_paginas: fuentes.length });
      for (let k = 0; k < fuentes.length; k++) {
        btn.innerHTML = `<span class="spin"></span> Página ${k + 1} de ${fuentes.length}…`;
        const pag = await paginaAJpg(fuentes[k]);
        for (let t = 1; t <= 3; t++) {
          try { await api('rh_politica_pagina', { p_id: id, p_n: k + 1, p_imagen: pag.b64, p_ancho: pag.ancho, p_alto: pag.alto }); break; }
          catch (err) { if (t === 3) throw err; await new Promise(z => setTimeout(z, 800 * t)); }
        }
      }
      btn.innerHTML = '<span class="spin"></span> Finalizando…';
      await api('rh_politica_finalizar', { p_id: id, p_vigente: $('#pvig').checked });
      toast(`Política publicada (${fuentes.length} página${fuentes.length > 1 ? 's' : ''}).`, 'ok'); recargar();
    } catch (err) { toast(err.message, 'err'); }
  }); };
  $$('[data-ver]').forEach(b => b.onclick = () => ocupado(b, async () => { try { await abrirPolitica(+b.dataset.ver); } catch (err) { toast(err.message, 'err'); } }));
  $$('[data-vig]').forEach(b => b.onclick = () => ocupado(b, async () => { try { await api('rh_politica_vigente', { p_id: +b.dataset.vig }); toast('Política vigente actualizada.', 'ok'); recargar(); } catch (err) { toast(err.message, 'err'); } }));
  $$('[data-del]').forEach(b => b.onclick = async () => { if (!await confirmar('Eliminar política', '¿Eliminar esta versión? No ha sido aceptada en ninguna solicitud.', 'Eliminar', 'dan')) return;
    try { await api('rh_politica_eliminar', { p_id: +b.dataset.del }); recargar(); } catch (err) { toast(err.message, 'err'); } });
}

async function adminUsuarios() {
  cargando('usuarios');
  const us = await api('rh_admin_usuarios');
  const filtro = store.get('fu') || '';
  shell('usuarios', `<div class="page-head"><div><h1>Usuarios</h1><p>Todos ingresan con un código por correo. Los administradores tienen además un PIN de respaldo.</p></div>
      <button class="btn pri" id="nu">${I.plus} Nuevo usuario</button></div>
    <div class="card"><div class="card-h"><input class="inp" id="bu" placeholder="Buscar…" value="${esc(filtro)}" style="max-width:320px"><span class="small muted">${us.length} usuario(s)</span></div>
    <div class="tbl-wrap"><table class="tbl"><thead><tr><th>Usuario</th><th>Departamento / puesto</th><th>Rol</th><th>Estado</th><th>Último acceso</th><th></th></tr></thead><tbody id="tu">
    ${us.map(u => `<tr data-q="${esc((u.nombre + ' ' + u.email + ' ' + u.departamento).toLowerCase())}">
      <td><b>${esc(u.nombre || '—')}</b><div class="xs muted">${esc(u.email)}</div></td>
      <td class="small">${esc(u.departamento || '—')}<div class="xs muted">${esc(u.puesto)}</div></td>
      <td><span class="tag ${u.rol === 'admin' ? 'adm' : u.rol === 'rh' ? 'rh' : ''}">${esc(ROLES[u.rol])}</span>${u.rol === 'admin' ? `<div class="xs muted">${u.tiene_pin ? (u.pin_temporal ? 'PIN de respaldo temporal' : 'PIN de respaldo activo') : 'Sin PIN de respaldo'}</div>` : ''}</td>
      <td>${u.activo ? '<span class="badge s-aprobada">Activo</span>' : '<span class="badge s-cancelada">Inactivo</span>'}${u.origen === 'aprobador' ? '<div class="xs muted">creado como aprobador</div>' : ''}</td>
      <td class="small">${fmt(u.ultimo_acceso)}</td>
      <td style="text-align:right;white-space:nowrap"><button class="btn sm" data-ed="${u.id}">${I.edit} Editar</button>${u.id !== S.user.id ? ` <button class="btn sm ghost icon" data-del="${u.id}" title="Eliminar">${I.trash}</button>` : ''}</td></tr>`).join('')}
    </tbody></table></div></div>`);
  const filtrar = () => { const q = $('#bu').value.toLowerCase(); store.set('fu', q); $$('#tu tr').forEach(tr => tr.style.display = tr.dataset.q.includes(q) ? '' : 'none'); };
  $('#bu').oninput = filtrar; filtrar();
  $('#nu').onclick = () => modalUsuario({ activo: true, rol: 'usuario' });
  $$('[data-ed]').forEach(b => b.onclick = () => modalUsuario(us.find(u => u.id === b.dataset.ed)));
  $$('[data-del]').forEach(b => b.onclick = async () => { const u = us.find(x => x.id === b.dataset.del);
    if (!await confirmar('Eliminar usuario', `¿Eliminar a <b>${esc(u.email)}</b>? Sus solicitudes se conservan. Si solo quiere quitarle el acceso, mejor desactívelo.`, 'Eliminar', 'dan')) return;
    try { await api('rh_admin_eliminar_usuario', { p_id: u.id }); toast('Usuario eliminado.', 'ok'); adminUsuarios(); } catch (e) { toast(e.message, 'err'); } });
}
function opcionesDep(v) { const d = S.departamentos.includes(v) || !v ? S.departamentos : [v, ...S.departamentos]; return `<option value="">—</option>` + d.map(x => `<option ${x === v ? 'selected' : ''}>${esc(x)}</option>`).join(''); }
function modalUsuario(u, alGuardar) {
  const nuevo = !u.id;
  modal({ title: nuevo ? 'Nuevo usuario' : 'Editar usuario', body: `<form id="fu" class="grid2">
      <div class="field span2"><label class="req">Correo</label><input class="inp" id="ue" type="email" value="${esc(u.email || '')}"></div>
      <div class="field span2"><label>Nombre completo</label><input class="inp" id="un" value="${esc(u.nombre || '')}"></div>
      <div class="field"><label>Departamento</label><select class="inp" id="ud">${opcionesDep(u.departamento)}</select></div>
      <div class="field"><label>Puesto</label><input class="inp" id="up" value="${esc(u.puesto || '')}"></div>
      <div class="field"><label>Rol</label><select class="inp" id="ur">${Object.entries(ROLES).map(([k, v]) => `<option value="${k}" ${u.rol === k ? 'selected' : ''}>${v}</option>`).join('')}</select>
        <span class="help">Colaborador: solo sus solicitudes. RH: además ve todas y publica políticas. Admin: además usuarios y flujos.</span></div>
      <div class="field"><label>Estado</label><select class="inp" id="ua"><option value="1" ${u.activo ? 'selected' : ''}>Activo</option><option value="0" ${!u.activo ? 'selected' : ''}>Inactivo</option></select></div>
      <div class="field span2 ${u.rol === 'admin' ? '' : 'hidden'}" id="upin-w"><label>${u.tiene_pin ? 'Restablecer PIN de respaldo (vacío = no cambiar)' : 'PIN de respaldo (opcional, 6 a 8 dígitos)'}</label>
        <input class="inp" id="upin" inputmode="numeric" maxlength="8" placeholder="Ej. 6 dígitos" autocomplete="off"><span class="help">Solo para entrar si los correos fallan. Entréguelo por un medio seguro; al ingresar se le pedirá definir uno propio.</span></div>
      <label class="chk span2"><input type="checkbox" id="unot"><span><b>Notificar por correo al usuario</b><br><span class="small muted">Desmarcado = puede crear y probar sin que la persona reciba aviso todavía.</span></span></label>
    </form>`,
    actions: [{ label: 'Cancelar' }, { label: 'Guardar', cls: 'pri', onClick: ({ close, el, btn }) => ocupado(btn, async () => {
      try {
        const r = await api('rh_admin_guardar_usuario', { p_usuario: { id: u.id || null, email: $('#ue', el).value, nombre: $('#un', el).value, departamento: $('#ud', el).value,
          puesto: $('#up', el).value, rol: $('#ur', el).value, activo: $('#ua', el).value === '1', pin: $('#upin', el).value }, p_notificar: $('#unot', el).checked });
        close(); toast((r.nuevo ? 'Usuario creado.' : 'Usuario actualizado.') + (r.sesiones_cerradas ? ` Se cerraron ${r.sesiones_cerradas} sesión(es) abiertas de esta persona: deberá ingresar de nuevo con su nuevo rol.` : ''), 'ok'); alGuardar ? alGuardar() : adminUsuarios();
      } catch (e) { toast(e.message, 'err'); }
    }) }],
    onOpen: el => { $('#ur', el).onchange = () => $('#upin-w', el).classList.toggle('hidden', $('#ur', el).value !== 'admin'); } });
}

    modal({ title: 'Crear usuario', body: `<div class="grid2">

        <div class="field hidden" id="apw"><label>PIN de respaldo (opcional)</label><input class="inp" id="apin" inputmode="numeric" maxlength="8"></div>
        <label class="chk span2"><input type="checkbox" id="anot"><span><b>Notificar por correo que su acceso está listo</b><br><span class="small muted">Déjelo sin marcar si todavía está en pruebas.</span></span></label></div>`,
      actions: [{ label: 'Cancelar' }, { label: 'Crear usuario', cls: 'pri', onClick: ({ close, el, btn }) => ocupado(btn, async () => {
        try { await api('rh_admin_resolver_acceso', { p_id: a.id, p_aprobar: true, p_datos: { nombre: $('#an', el).value, departamento: $('#ad', el).value, puesto: $('#ap', el).value, rol: $('#ar', el).value, pin: $('#apin', el).value }, p_notificar: $('#anot', el).checked, p_nota: '' });

      <td style="text-align:right;white-space:nowrap"><button class="btn sm" data-ed="${d.id}">${I.edit} Editar</button> <button class="btn sm ghost icon" data-del="${d.id}" title="Eliminar">${I.trash}</button></td></tr>`).join('')}

    const items = $$('tr[data-dep]').map(tr => ({ departamento_id: +tr.dataset.dep, aprobador_nombre: $('[data-n]', tr).value.trim(), aprobador_email: $('[data-e]', tr).value.trim() }));
    try { await api('rh_modulo_guardar_responsables', { p_modulo: null, p_items: items }); toast('Responsables guardados para todos los trámites.', 'ok'); adminDepartamentos(); } catch (err) { toast(err.message, 'err'); }
  });
  const abrir = d => modal({ title: d.id ? 'Editar departamento' : 'Nuevo departamento', body: `<div class="grid2">
      <div class="field span2"><label class="req">Nombre</label><input class="inp" id="dn" value="${esc(d.nombre || '')}"></div>
      <div class="field"><label>Estado</label><select class="inp" id="da"><option value="1" ${d.activo !== false ? 'selected' : ''}>Activo</option><option value="0" ${d.activo === false ? 'selected' : ''}>Inactivo</option></select></div></div>`,
    actions: [{ label: 'Cancelar' }, { label: 'Guardar', cls: 'pri', onClick: ({ close, el, btn }) => ocupado(btn, async () => {
      try { await api('rh_admin_guardar_departamento', { p_dep: { id: d.id || null, nombre: $('#dn', el).value, activo: $('#da', el).value === '1' } });
        close(); toast('Departamento guardado.', 'ok'); await cargarBase(); adminDepartamentos(); } catch (e) { toast(e.message, 'err'); }

function edFormulario() {
  const F = ED.formulario;
  const conOps = t => ['lista', 'opcion', 'casillas'].includes(t);
  $('#edbody').innerHTML = `<div class="alert a-info">${I.info}<div class="small">Los campos marcados como <b>sistema</b> no se pueden eliminar: <span class="kbd">correo_jefatura</span> se usa para enviar la aprobación a la jefatura y <span class="kbd">departamento</span> para encontrar al responsable del departamento. Sí puede cambiar su texto.</div></div>

        <button class="btn icon ghost" data-rm ${f.sistema ? 'disabled title="Campo del sistema"' : 'title="Eliminar"'} style="color:var(--danger)">${I.trash}</button></div>

        <div class="field"><span class="lbl">Tipo</span><select class="inp" data-p="tipo" ${f.sistema ? 'disabled' : ''}>${Object.entries(TIPOS_CAMPO).map(([k, v]) => `<option value="${k}" ${f.tipo === k ? 'selected' : ''}>${v}</option>`).join('')}</select></div>
        <div class="field"><span class="lbl">Clave interna</span><input class="inp" value="${esc(f.key)}" disabled>${f.sistema ? '<span class="help">Campo del sistema</span>' : ''}</div>
        <div class="field"><span class="lbl">Valor inicial</span><select class="inp" data-p="auto"><option value="">Vacío</option>${[['hoy', 'Fecha de hoy'], ['nombre', 'Nombre del usuario'], ['email', 'Correo del usuario (no editable)'], ['departamento', 'Departamento del usuario'], ['puesto', 'Puesto del usuario']].map(([k, v]) => `<option value="${k}" ${f.auto === k ? 'selected' : ''}>${v}</option>`).join('')}</select></div>
        <div class="field span2"><span class="lbl">Texto de ayuda</span><input class="inp" data-p="ayuda" value="${esc(f.ayuda || '')}"></div>
        <label class="chk" style="align-self:end"><input type="checkbox" data-p="requerido" ${f.requerido ? 'checked' : ''} ${f.key === 'correo_jefatura' ? 'disabled' : ''}><span>Obligatorio</span></label>
        ${['texto', 'lista', 'opcion', 'fecha', 'numero', 'departamento'].includes(f.tipo) ? `<label class="chk" style="align-self:end"><input type="checkbox" data-p="en_resumen" ${f.en_resumen ? 'checked' : ''}><span>Mostrar en el resumen de los correos</span></label>` : ''}
        ${f.tipo === 'archivo' ? `<div class="field"><span class="lbl">Máximo de archivos</span><input class="inp" type="number" min="1" max="10" data-p="max_archivos" value="${esc(f.max_archivos || 5)}"></div>` : ''}
        ${f.tipo === 'fecha' ? `<label class="chk" style="align-self:end"><input type="checkbox" data-p="no_futura" ${f.no_futura ? 'checked' : ''}><span>No permitir fechas futuras</span></label>` : ''}
        ${conOps(f.tipo) ? `<div class="field span2" style="grid-column:1/-1"><span class="lbl">Opciones (una por línea)</span><textarea class="inp" data-p="opciones">${esc((f.opciones || []).join('\n'))}</textarea></div>` : ''}
        ${['lista', 'opcion'].includes(f.tipo) && (f.opciones || []).length ? `<div class="field" style="grid-column:1/-1"><span class="lbl">Reglas por opción</span>
          <div class="tbl-wrap"><table class="tbl"><thead><tr><th>Opción</th><th title="Si la eligen, la solicitud es una excepción y pasa por los pasos 'solo si hay excepción'">Excepción</th><th>Nota que ve el solicitante al elegirla</th></tr></thead><tbody>
          ${f.opciones.map((o, k) => `<tr><td class="small b">${esc(o)}</td><td><input type="checkbox" data-op-exc="${k}" ${(f.excepcion_opciones || []).includes(o) ? 'checked' : ''}></td>
            <td><input class="inp" data-op-nota="${k}" value="${esc((f.notas_opciones || {})[o] || '')}" placeholder="Opcional"></td></tr>`).join('')}</tbody></table></div>
          ${(f.excepcion_opciones || []).length ? `<label class="chk" style="margin-top:8px"><input type="checkbox" data-p="excepcion_justificar" ${f.excepcion_justificar ? 'checked' : ''}><span>Pedir una <b>justificación</b> cuando elijan una opción de excepción</span></label>` : ''}
          <details style="margin-top:8px"><summary class="small" style="cursor:pointer">Avanzado: datos de la política por opción y restricciones (JSON)</summary>
            <span class="help">Ejemplo: <span class="kbd">{"Idiomas":{"antiguedad_meses":3,"porcentaje":50,"tope":1200,"nota":"…"}}</span>. Con <i>antiguedad_meses</i> se compara contra el campo de fecha de ingreso; <i>porcentaje</i> se sugiere al aprobador.</span>
            <textarea class="inp mono" data-pj="detalle_opciones" style="min-height:90px;font-size:12px">${esc(f.detalle_opciones ? JSON.stringify(f.detalle_opciones, null, 1) : '')}</textarea>
            <span class="help">Restricciones: <span class="kbd">{"Fuera de período":{"campo":"tipo_apoyo","valores":["…"],"mensaje":"…"}}</span></span>
            <textarea class="inp mono" data-pj="restricciones" style="min-height:70px;font-size:12px">${esc(f.restricciones ? JSON.stringify(f.restricciones, null, 1) : '')}</textarea></details></div>` : ''}
        ${f.tipo === 'dias' ? `<div class="field" style="grid-column:1/-1"><span class="lbl">Días disponibles</span><div class="days" data-dias>${DIAS_ORD.map(d => `<button type="button" class="day ${(f.opciones || []).includes(d) ? 'on' : ''}" data-d="${d}">${DIAS[d]}</button>`).join('')}</div></div>
          <div class="field"><span class="lbl">Días permitidos por política (más = excepción)</span><input class="inp" type="number" min="1" max="7" data-p="max_politica" value="${esc(f.max_politica || '')}" placeholder="Sin límite"><span class="help">RH también lo puede cambiar en Políticas.</span></div>
          <div class="field span2"><span class="lbl">Motivos de excepción (uno por línea)</span><textarea class="inp" data-p="motivos" style="min-height:70px">${esc((f.motivos || []).join('\n'))}</textarea></div>` : ''}
      </div></div>`).join('')}</div>
    <button class="btn" id="addf" style="margin-top:14px">${I.plus} Agregar campo</button>`;
  const body = $('#edbody');

    if (t.dataset.opNota != null) { const o = f.opciones[+t.dataset.opNota]; f.notas_opciones = { ...(f.notas_opciones || {}) }; if (t.value.trim()) f.notas_opciones[o] = t.value.trim(); else delete f.notas_opciones[o]; return; }
    if (t.dataset.pj) { const k = t.dataset.pj; if (!t.value.trim()) { delete f[k]; t.style.borderColor = ''; return; } try { f[k] = JSON.parse(t.value); t.style.borderColor = ''; } catch { t.style.borderColor = 'var(--danger)'; } return; }
    const p = t.dataset.p; if (!p) return;
    if (['requerido', 'en_resumen', 'no_futura', 'excepcion_justificar'].includes(p)) { if (e.target.checked) f[p] = true; else if (p === 'requerido') f.requerido = false; else delete f[p]; return; }
    if (p === 'max_archivos') { f.max_archivos = Math.max(1, Math.min(10, +e.target.value || 5)); return; }
    else if (p === 'opciones' || p === 'motivos') f[p] = e.target.value.split('\n').map(x => x.trim()).filter(Boolean);
    else if (p === 'max_politica') { delete f.max; if (+e.target.value > 0) f.max_politica = +e.target.value; else delete f.max_politica; }
    else if (p === 'auto') { if (e.target.value) f.auto = e.target.value; else delete f.auto; }
    else f[p] = e.target.value;
    if (p === 'tipo' && e.type === 'change') { if (f.tipo === 'dias' && !f.opciones?.length) { f.opciones = ['lun', 'mar', 'mie', 'jue', 'vie']; f.motivos = ['Salud', 'Cuido de familiares', 'Otro']; } edFormulario(); }
    if (p === 'opciones' && e.type === 'change') edFormulario();
  };
  body.onclick = e => {
    const card = e.target.closest('[data-i]'); const i = card ? +card.dataset.i : -1;
    const mv = e.target.closest('[data-mv]'); if (mv && !mv.disabled) { const j = i + +mv.dataset.mv; [F[i], F[j]] = [F[j], F[i]]; return edFormulario(); }
    const rm = e.target.closest('[data-rm]'); if (rm && !rm.disabled) { F.splice(i, 1); return edFormulario(); }
    const d = e.target.closest('[data-dias] .day'); if (d) { d.classList.toggle('on'); F[i].opciones = $$('.day.on', d.parentNode).map(x => x.dataset.d); }
  };
  $('#addf').onclick = () => modal({ title: 'Agregar campo', body: `<div class="grid2"><div class="field span2"><label class="req">Etiqueta</label><input class="inp" id="nl" placeholder="Ej. Teléfono de contacto"></div>
      <div class="field"><label>Tipo</label><select class="inp" id="nt">${Object.entries(TIPOS_CAMPO).map(([k, v]) => `<option value="${k}">${v}</option>`).join('')}</select></div>
      <label class="chk" style="align-self:end"><input type="checkbox" id="nrq"><span>Obligatorio</span></label></div>`,
    actions: [{ label: 'Cancelar' }, { label: 'Agregar', cls: 'pri', onClick: ({ close, el }) => {
      const label = $('#nl', el).value.trim(); if (!label) return toast('Escriba la etiqueta.', 'err');
      let key = slug(label), n = 2; while (F.some(f => f.key === key)) key = slug(label).slice(0, 36) + '_' + n++;
      const f = { key, label, tipo: $('#nt', el).value, requerido: $('#nrq', el).checked };
      if (['lista', 'opcion', 'casillas'].includes(f.tipo)) f.opciones = ['Opción 1', 'Opción 2'];
      if (f.tipo === 'dias') { f.opciones = ['lun', 'mar', 'mie', 'jue', 'vie']; f.motivos = ['Salud', 'Cuido de familiares', 'Otro']; }
      F.push(f); close(); edFormulario(); window.scrollTo(0, document.body.scrollHeight);
    } }], onOpen: el => $('#nl', el).focus() });
}
const DATO_NUEVO = new WeakSet();

          <div class="span2"><span class="lbl">Datos que el aprobador completa al aprobar</span>
            ${(p.datos || []).map((d, k) => `<div class="row" style="gap:6px;margin-top:6px" data-dk="${k}"><input class="inp grow" data-d="label" value="${esc(d.label)}" placeholder="Etiqueta">

      <div class="arrow">${I.arrow}</div><div class="step-end">Aprobada → PDF al solicitante y RH</div>

    const rm = e.target.closest('[data-rm]'); if (rm && !rm.disabled) { P.splice(i, 1); return edFlujo(); }
    if (e.target.closest('[data-dadd]')) { const d = { key: 'dato_' + Date.now().toString(36), label: 'Nuevo dato', tipo: 'numero', requerido: true }; DATO_NUEVO.add(d); (P[i].datos = P[i].datos || []).push(d); ED._sucio = true; return edFlujo(); }
    const drm = e.target.closest('[data-drm]'); if (drm) { P[i].datos.splice(+drm.dataset.drm, 1); if (!P[i].datos.length) delete P[i].datos; ED._sucio = true; return edFlujo(); }
  };
  $('#addp').onclick = () => { P.push({ id: 'p' + Date.now(), nombre: 'Nuevo paso', tipo: 'correo', correos: '', condicion: 'siempre' }); edFlujo(); };
}
function edTextos() {
  const T = ED.textos;
  const campos = [['intro', 'Texto inicial (confidencialidad)', 'Se muestra al inicio del formulario y en el PDF.'],
                  ['declaracion', 'Declaración (casilla obligatoria)', 'El solicitante debe marcarla para poder enviar.'],
                  ['msg_aprobado', 'Mensaje al aprobarse', 'Va en el correo final con el PDF y en el documento.'],
                  ['msg_rechazado', 'Mensaje al rechazarse', 'Va en el correo de rechazo, antes del motivo.'],
                  ['msg_info', 'Mensaje al solicitar más información', 'Va en el correo al solicitante, antes de la pregunta del aprobador.']];
  $('#edbody').innerHTML = `<div class="card card-b stack">${campos.map(([k, l, h]) => `<div class="field"><label>${l}</label><textarea class="inp" data-t="${k}">${esc(T[k] || '')}</textarea><span class="help">${h}</span></div>`).join('')}</div>`;
  $('#edbody').oninput = e => { if (e.target.dataset.t) T[e.target.dataset.t] = e.target.value; };

}
function edGeneral() {
