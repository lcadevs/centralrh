    <div class="track" style="height:12px;background:var(--gris-50);border-radius:8px;overflow:hidden;position:relative;margin:-4px 0 18px"><div style="position:absolute;inset:0 auto 0 0;width:${Math.min(100, Math.max(0.5, pct))}%;background:${pct > 80 ? 'var(--danger)' : 'var(--pri)'}"></div></div>
    <div class="grid2" style="align-items:start">
      <div class="card"><div class="card-h"><h2>Tablas de la central</h2><span class="xs muted">incluye índices</span></div><div class="tbl-wrap"><table class="tbl"><thead><tr><th>Tabla</th><th class="num">Filas aprox.</th><th class="num">Tamaño</th></tr></thead><tbody>
        ${C.tablas.slice(0, 12).map(t => `<tr><td class="small">${esc(t.tabla)}</td><td class="num small">${Number(t.filas).toLocaleString('es-CR')}</td><td class="num small">${mb(t.bytes)}</td></tr>`).join('')}</tbody></table></div></div>
      <div class="card"><div class="card-h"><h2>Adjuntos por trámite y año</h2></div>${C.adjuntos_por.length ? `<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Trámite</th><th>Año</th><th>Estado</th><th class="num">Archivos</th><th class="num">Tamaño</th></tr></thead><tbody>
        ${C.adjuntos_por.map(x => `<tr><td class="small">${esc(mods[x.modulo] || x.modulo)}</td><td class="small">${x.anio}</td><td>${badge(x.estado)}</td><td class="num small">${x.n}</td><td class="num small">${mb(x.bytes)}</td></tr>`).join('')}</tbody></table></div>` : '<div class="empty">No hay adjuntos.</div>'}</div></div>
    <div class="card" style="margin-top:16px"><div class="card-h"><h2>Depurar adjuntos antiguos</h2>${C.ultima_depuracion_adjuntos ? `<span class="xs muted">Última: ${fmt(C.ultima_depuracion_adjuntos.fecha)} · ${C.ultima_depuracion_adjuntos.archivos} archivos (${mb(C.ultima_depuracion_adjuntos.bytes)})</span>` : ''}</div>
      <div class="card-b stack"><p class="small" style="margin:0">Borra los adjuntos (cotizaciones, planes de estudio, respuestas) de solicitudes <b>terminadas</b> hace más de N meses. La solicitud, sus datos, firmas y bitácora se conservan; en el detalle el archivo aparece como <i>depurado</i>. <b>Los contratos firmados nunca se borran aquí.</b></p>
        <div class="row wrap" style="gap:12px;align-items:flex-end"><div class="field" style="width:170px"><label>Terminadas hace más de</label><input class="inp" type="number" min="1" max="120" id="dm" value="24"><span class="help">meses</span></div>
          <label class="chk" style="max-width:340px"><input type="checkbox" id="dap"><span>Incluir también las <b>aprobadas</b><br><span class="xs muted">Sin marcar: solo rechazadas y canceladas.</span></span></label>
          <button class="btn" id="dcont">${I.info} Revisar</button><button class="btn dan" id="ddep" disabled>${I.trash} Depurar</button></div>
        <div id="dres" class="small"></div></div></div>
    <div class="grid2" style="align-items:start;margin-top:16px">
      <div class="card"><div class="card-h"><h2>Archivos más pesados</h2></div>${C.mayores.length ? `<div class="tbl-wrap"><table class="tbl"><tbody>${C.mayores.map(x => `<tr><td class="small"><b>${esc(x.nombre)}</b><div class="xs muted">${x.folio ? `<a href="#/solicitud/${x.solicitud_id}">${esc(x.folio)}</a> · ${esc(ESTADOS[x.estado] || x.estado)}` : 'sin enviar'}${x.campo === '_contrato' ? ' · contrato firmado' : ''}</div></td><td class="num small">${mb(x.tamano)}</td></tr>`).join('')}</tbody></table></div>` : '<div class="empty">Sin archivos.</div>'}</div>
      <div class="card"><div class="card-h"><h2>Políticas guardadas</h2></div><div class="tbl-wrap"><table class="tbl"><tbody>${C.politicas_lista.map(p => `<tr><td class="small"><b>${esc(p.titulo)}</b>${p.version ? ' v' + esc(p.version) : ''}${p.vigente ? ' <span class="badge s-aprobada">Vigente</span>' : ''}<div class="xs muted">${esc(mods[p.modulo] || p.modulo)} · ${p.formato === 'archivo' ? 'archivo original (formato antiguo)' : p.paginas + ' pág.'} · ${p.aceptaciones} aceptaciones</div></td>
        <td class="num small">${mb(p.bytes * 3 / 4)}</td><td style="text-align:right">${!p.vigente && !p.aceptaciones ? `<button class="btn sm ghost icon" data-delpol="${p.id}" title="Eliminar">${I.trash}</button>` : ''}</td></tr>`).join('') || '<tr><td class="small muted">Sin políticas.</td></tr>'}</tbody></table></div>
        <div class="card-b xs muted">Las políticas aceptadas en solicitudes se conservan como evidencia. Las que nunca se usaron y no están vigentes se pueden eliminar.</div></div></div>
    <div class="alert a-info" style="margin-top:16px">${I.info}<div class="small"><b>Limpieza automática:</b> al iniciar sesión se borran solas las sesiones vencidas, los códigos de más de 2 días, los registros sin confirmar, los archivos que se subieron pero nunca se enviaron (1 día) y la bitácora de correos de más de un año. Los PDF y los contratos Word se generan al descargarlos: no ocupan espacio. Las fotos se reducen antes de subirse.</div></div>`);
  $('#rf').onclick = adminConsumo;
  let par = null;
  $('#dcont').onclick = e => ocupado(e.currentTarget, async () => {
    try { par = { p_meses: +$('#dm').value, p_aprobadas: $('#dap').checked }; const r = await api('rh_admin_depurar_adjuntos', { p_accion: 'contar', ...par });
      $('#dres').innerHTML = r.archivos ? `Se borrarían <b>${r.archivos}</b> archivo(s) (${mb(r.bytes)}) de <b>${r.solicitudes}</b> solicitud(es) terminadas antes del ${fmtD(r.antes_de)}.` : 'No hay adjuntos que cumplan ese criterio.';
      $('#ddep').disabled = !r.archivos; } catch (err) { toast(err.message, 'err'); } });
  $('#ddep').onclick = async e => { const btn = e.target.closest('button');
    if (!await confirmar('Depurar adjuntos', 'Los archivos se eliminarán <b>definitivamente</b>. Las solicitudes y sus datos se conservan. ¿Continuar?', 'Depurar', 'dan')) return;
    ocupado(btn, async () => { try { const r = await api('rh_admin_depurar_adjuntos', { p_accion: 'depurar', ...par }); toast(`Se depuraron ${r.archivos} archivo(s) (${mb(r.bytes)}).`, 'ok'); adminConsumo(); } catch (err) { toast(err.message, 'err'); } }); };
  $$('[data-delpol]').forEach(b => b.onclick = async () => { if (!await confirmar('Eliminar política', '¿Eliminar esta versión? Nunca fue aceptada ni está vigente.', 'Eliminar', 'dan')) return;
    try { await api('rh_politica_eliminar', { p_id: +b.dataset.delpol }); adminConsumo(); } catch (err) { toast(err.message, 'err'); } });
}

/* =====================================================================
   v1.15 · CARGA MASIVA DE USUARIOS (admin, Excel)
   ===================================================================== */
const COLS_CARGA = [['email', 'Correo'], ['nombre', 'Nombre completo'], ['departamento', 'Departamento'], ['puesto', 'Puesto'], ['cedula', 'Cédula'],
                    ['direccion', 'Dirección física'], ['fecha_ingreso', 'Fecha de ingreso'], ['rol', 'Rol'], ['activo', 'Estado']];
const normCol = t => String(t || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().replace(/\*/g, '').trim();
async function plantillaCarga() {
  const X = await cargarXlsx(), wb = X.utils.book_new();
  const ej = [{ 'Correo': 'nombre.apellido@legrand.com', 'Nombre completo': 'Nombre Apellido Apellido', 'Departamento': S.departamentos[0] || '', 'Puesto': 'Analista', 'Cédula': '1-0000-0000',
               'Dirección física': 'Heredia, Barreal, 200 m norte…', 'Fecha de ingreso': new Date(2022, 0, 15), 'Rol': 'Colaborador', 'Estado': 'Activo' }];
  const ws = X.utils.json_to_sheet(ej, { cellDates: true }); ws['!cols'] = [30, 28, 24, 22, 14, 40, 16, 18, 10].map(w => ({ wch: w }));
  X.utils.book_append_sheet(wb, ws, 'Usuarios');
  X.utils.book_append_sheet(wb, X.utils.aoa_to_sheet([['Departamentos válidos'], ...S.departamentos.map(d => [d])]), 'Departamentos');
  X.utils.book_append_sheet(wb, X.utils.aoa_to_sheet([['Instrucciones'], ['1. Una fila por persona. Solo el Correo es obligatorio; borre la fila de ejemplo.'],
    ['2. Si el correo ya existe, se actualizan solo las celdas con datos (las vacías no borran nada).'], ['3. Departamento: escríbalo igual que en la hoja Departamentos.'],
    ['4. Rol: Colaborador o Recursos Humanos (los administradores se crean a mano en Usuarios). Vacío = Colaborador.'], ['5. Estado: Activo o Inactivo. Vacío = Activo.'],
    ['6. Fecha de ingreso: fecha de Excel o texto AAAA-MM-DD.'], ['7. A quien le falten datos obligatorios (departamento, puesto, cédula, dirección, fecha de ingreso) se le pedirán la primera vez que ingrese.']]), 'Instrucciones');
  X.writeFile(wb, 'Plantilla carga de usuarios.xlsx');
}
function modalCarga() {
  let filas = [], resultado = null;
  const m = modal({ title: 'Carga masiva de usuarios (Excel)', size: 'lg', body: `<div class="stack">
      <div class="row wrap" style="gap:10px"><button class="btn" id="cdpl">${I.xls} 1. Descargar plantilla</button>
        <label class="btn pri">${I.up} 2. Elegir el Excel lleno<input type="file" hidden id="cfile" accept=".xlsx,.xls,.csv"></label></div>
      <p class="xs muted" style="margin:0">Se crean o actualizan usuarios por correo. Lo que falte se le pedirá a cada persona al ingresar. Nadie recibe correo salvo que marque la casilla.</p>
      <div id="cprev"></div></div>`, actions: [{ label: 'Cerrar' }] });
  const el = m.el, prev = $('#cprev', el);
  $('#cdpl', el).onclick = e => ocupado(e.currentTarget, async () => { try { await plantillaCarga(); } catch (err) { toast(err.message, 'err'); } });
  $('#cfile', el).onchange = async e => { const f = e.target.files[0]; if (!f) return;
    try { const X = await cargarXlsx(), wb = X.read(await f.arrayBuffer(), { cellDates: true }), ws = wb.Sheets[wb.SheetNames[0]];
      const raw = X.utils.sheet_to_json(ws, { defval: '', raw: true });
      const mapa = {}; Object.keys(raw[0] || {}).forEach(h => { const n = normCol(h); const c = COLS_CARGA.find(([k, l]) => normCol(l) === n || k === n || (k === 'email' && /^(correo|email|e-mail)/.test(n)) || (k === 'activo' && n === 'activo')); if (c) mapa[h] = c[0]; });
      if (!Object.values(mapa).includes('email')) throw new Error('No encontré la columna "Correo". Use la plantilla.');
      const iso = v => v instanceof Date ? new Date(v.getTime() - v.getTimezoneOffset() * 60000).toISOString().slice(0, 10) : String(v ?? '').trim();
      filas = raw.map((r, i) => { const o = { fila: i + 2 }; Object.entries(mapa).forEach(([h, k]) => o[k] = k === 'fecha_ingreso' ? iso(r[h]) : String(r[h] ?? '').trim()); return o; })
                 .filter(o => o.email && !/^nombre\.apellido@/i.test(o.email));
      resultado = null; pintar(); } catch (err) { toast(err.message, 'err'); } finally { e.target.value = ''; } };
  const pintar = () => {
    if (!filas.length) { prev.innerHTML = '<div class="small muted">El archivo no tiene filas con correo.</div>'; return; }
    const R = resultado ? Object.fromEntries(resultado.filas.map(x => [x.fila, x])) : {};
    prev.innerHTML = `<div class="row between wrap" style="margin-bottom:8px"><b>${filas.length} fila(s)</b>${resultado ? `<span class="small">${resultado.creados} creados · ${resultado.actualizados} actualizados · <span style="color:${resultado.errores ? 'var(--danger)' : 'inherit'}">${resultado.errores} con error</span></span>` : ''}</div>
      <div class="tbl-wrap" style="max-height:320px;overflow:auto"><table class="tbl"><thead><tr><th>Fila</th><th>Correo</th><th>Nombre</th><th>Departamento</th><th>Rol</th>${resultado ? '<th>Resultado</th>' : ''}</tr></thead><tbody>
      ${filas.map(f => `<tr><td class="small">${f.fila}</td><td class="small">${esc(f.email)}</td><td class="small">${esc(f.nombre || '')}</td><td class="small">${esc(f.departamento || '')}</td><td class="small">${esc(f.rol || 'Colaborador')}</td>
        ${resultado ? `<td class="small">${R[f.fila] ? `<span class="badge ${R[f.fila].resultado === 'Error' ? 's-rechazada' : 's-aprobada'}">${esc(R[f.fila].resultado)}</span><div class="xs muted">${esc(R[f.fila].detalle || '')}</div>` : ''}</td>` : ''}</tr>`).join('')}</tbody></table></div>
      ${resultado ? `<div class="row wrap" style="gap:10px;margin-top:10px"><button class="btn" id="cres">${I.xls} Descargar resultado (Excel)</button></div>`
        : `<label class="chk" style="margin-top:10px"><input type="checkbox" id="cnot"><span><b>Avisar por correo</b> a los usuarios nuevos que ya pueden ingresar</span></label>
           <button class="btn pri" id="cgo" style="margin-top:10px">${I.check} Cargar ${filas.length} usuario(s)</button>`}`;
    if ($('#cgo', el)) $('#cgo', el).onclick = e => ocupado(e.currentTarget, async () => {
      try { const tot = { creados: 0, actualizados: 0, errores: 0, filas: [] };
        for (let i = 0; i < filas.length; i += 200) { const r = await api('rh_admin_carga_usuarios', { p_filas: filas.slice(i, i + 200), p_notificar: $('#cnot', el).checked });
          tot.creados += r.creados; tot.actualizados += r.actualizados; tot.errores += r.errores; tot.filas.push(...r.filas); }
        resultado = tot; pintar(); toast(`Carga lista: ${tot.creados} creados, ${tot.actualizados} actualizados, ${tot.errores} con error.`, tot.errores ? '' : 'ok'); }
      catch (err) { toast(err.message, 'err'); } });
    if ($('#cres', el)) $('#cres', el).onclick = async () => { const X = await cargarXlsx(), R2 = Object.fromEntries(resultado.filas.map(x => [x.fila, x]));
      const ws = X.utils.json_to_sheet(filas.map(f => ({ 'Fila': f.fila, ...Object.fromEntries(COLS_CARGA.map(([k, l]) => [l, f[k] || ''])), 'Resultado': R2[f.fila]?.resultado || '', 'Detalle': R2[f.fila]?.detalle || '' })));
      const wb = X.utils.book_new(); X.utils.book_append_sheet(wb, ws, 'Resultado'); X.writeFile(wb, 'Resultado carga de usuarios.xlsx'); };
  };
}

iniciar();
</script>
