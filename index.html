<style>

*{box-sizing:border-box}
html,body{margin:0}
body{font-family:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden}

.row{display:flex;align-items:center;gap:10px} .wrap{flex-wrap:wrap} .grow{flex:1;min-width:0} .between{justify-content:space-between}
.stack>*+*{margin-top:12px}
h1,h2,h3{margin:0;line-height:1.25} h1{font-size:24px;font-weight:800;letter-spacing:-.01em} h2{font-size:18px;font-weight:700} h3{font-size:15px;font-weight:700}

/* Botones */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid transparent;border-radius:10px;padding:10px 16px;font-weight:600;font-size:14px;background:var(--surface);color:var(--ink);border-color:var(--line-2);transition:background .15s,border-color .15s,transform .05s;white-space:nowrap;text-decoration:none}
.btn:hover{background:var(--surface-2)} .btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.55;cursor:not-allowed}
.btn.pri{background:var(--green);border-color:var(--green);color:#fff} .btn.pri:hover{background:var(--green-600)}
.btn.dan{background:var(--brick);border-color:var(--brick);color:#fff} .btn.dan:hover{filter:brightness(1.07)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--ink-2)} .btn.ghost:hover{background:var(--slate-50)}
.btn.sm{padding:6px 11px;font-size:13px;border-radius:8px}
.btn.icon{padding:7px;border-radius:8px}
.btn svg{width:17px;height:17px;flex:none}
.spin{width:16px;height:16px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .7s linear infinite;display:inline-block}
@keyframes sp{to{transform:rotate(360deg)}}

/* Campos */
.field{display:flex;flex-direction:column;gap:6px}
.field>label,.lbl{font-weight:600;font-size:13.5px;color:var(--ink)}
.req::after{content:" *";color:var(--brick)}
.help{font-size:12.5px;color:var(--ink-3)}
.inp,select.inp,textarea.inp{width:100%;border:1px solid var(--line-2);border-radius:10px;padding:10px 12px;background:#fff;outline:none;transition:border-color .15s,box-shadow .15s}
textarea.inp{min-height:84px;resize:vertical}
.inp:focus{border-color:var(--green);box-shadow:0 0 0 3px rgba(20,86,74,.14)}
.inp:disabled,.inp[readonly]{background:var(--surface-2);color:var(--ink-2)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.span2{grid-column:1/-1}
@media (max-width:720px){.grid2,.grid3{grid-template-columns:1fr}}
.chk{display:flex;gap:10px;align-items:flex-start;cursor:pointer;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:#fff}
.chk input{width:18px;height:18px;margin:2px 0 0;accent-color:var(--green);flex:none}
.chk:has(input:checked){border-color:var(--green);background:var(--green-50)}
.chk-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}
.days{display:flex;flex-wrap:wrap;gap:8px}
.day{border:1.5px solid var(--line-2);background:#fff;border-radius:999px;padding:8px 16px;font-weight:600;font-size:14px;color:var(--ink-2);user-select:none}

.user-chip{display:flex;align-items:center;gap:10px;color:#fff;background:rgba(255,255,255,.12);border:0;border-radius:999px;padding:4px 12px 4px 4px}
.avatar{width:30px;height:30px;border-radius:50%;background:#fff;color:var(--green);display:grid;place-items:center;font-weight:800;font-size:12px}
.layout{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:calc(100vh - 58px)}
.side{border-right:1px solid var(--line);background:var(--surface);padding:16px 10px;position:sticky;top:58px;height:calc(100vh - 58px);overflow:auto}
.nav a{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:10px;color:var(--ink-2);text-decoration:none;font-weight:600;font-size:14px;margin-bottom:2px}
.nav a:hover{background:var(--surface-2);color:var(--ink)}
.nav a.on{background:var(--green-50);color:var(--green)}
.nav a svg{width:19px;height:19px;flex:none}
.nav .sep{height:1px;background:var(--line);margin:10px 8px}
.nav .cap{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3);padding:8px 12px 4px;font-weight:700}
.pill{margin-left:auto;background:var(--brick);color:#fff;border-radius:999px;font-size:11.5px;padding:1px 8px;font-weight:700}
.main{padding:26px clamp(16px,3vw,36px) 60px;max-width:1180px;width:100%}
@media (max-width:900px){

/* Tiles */

.tile{border-radius:var(--r);padding:16px 18px;color:#fff;text-decoration:none;display:block;box-shadow:var(--shadow);transition:transform .12s}
.tile:hover{transform:translateY(-2px)}
.tile .n{font-size:30px;font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums}
.tile .t{font-size:13px;opacity:.9;font-weight:600}
.t-green{background:var(--green)} .t-slate{background:var(--slate)} .t-brick{background:var(--brick)} .t-olive{background:var(--olive)}
.mods{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.mod{display:flex;flex-direction:column;gap:12px;padding:20px;text-decoration:none;color:inherit}
.mod-ic{width:44px;height:44px;border-radius:12px;background:var(--green-50);color:var(--green);display:grid;place-items:center}
.mod-ic svg{width:24px;height:24px}
.mod.soon{opacity:.6;border-style:dashed;box-shadow:none}
.alert{border-radius:12px;padding:12px 14px;display:flex;gap:10px;align-items:flex-start;font-size:14px;margin-bottom:16px}
.alert svg{width:18px;height:18px;flex:none;margin-top:2px}
.a-warn{background:var(--olive-50);color:#5c5214;border:1px solid #E7D9A6}
.a-info{background:var(--slate-50);color:#2c4148;border:1px solid #D3DEE2}
.a-ok{background:var(--green-50);color:var(--green-700);border:1px solid var(--green-100)}
.a-err{background:var(--brick-50);color:#7c2419;border:1px solid #EBC5BE}

/* Tablas */
.tbl-wrap{overflow-x:auto}
table.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:left;font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-3);font-weight:700;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--surface-2);white-space:nowrap}
.tbl td{padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tr.click{cursor:pointer} .tbl tr.click:hover td{background:var(--surface-2)}
.badge{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:700;white-space:nowrap}
.badge::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.s-en_aprobacion,.s-pendiente{background:var(--olive-50);color:#6b5f11}
.s-aprobada,.s-aprobado{background:var(--green-50);color:var(--green)}
.s-rechazada,.s-rechazado{background:var(--brick-50);color:var(--brick)}
.s-cancelada,.s-omitido,.s-en_espera{background:var(--slate-50);color:var(--slate)}
.tag{display:inline-block;border-radius:6px;padding:2px 8px;font-size:12px;font-weight:600;background:var(--slate-50);color:var(--slate)}
.tag.adm{background:var(--green-50);color:var(--green)} .tag.rh{background:var(--olive-50);color:#6b5f11} .tag.exc{background:var(--olive-50);color:#6b5f11}
.empty{padding:40px 20px;text-align:center;color:var(--ink-3)}
.empty svg{width:40px;height:40px;opacity:.5;margin-bottom:8px}
.mini-steps{display:flex;gap:3px;margin-top:6px}
.mini-steps i{height:5px;width:22px;border-radius:3px;background:var(--line-2)}
.mini-steps i.aprobado{background:var(--green)} .mini-steps i.pendiente{background:var(--olive)} .mini-steps i.rechazado{background:var(--brick)}

/* Detalle */
.det{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:20px;align-items:start}
@media (max-width:1000px){.det{grid-template-columns:1fr}}
dl.kv{display:grid;grid-template-columns:minmax(140px,36%) 1fr;margin:0}
dl.kv dt{color:var(--ink-2);font-size:13.5px;padding:10px 0;border-bottom:1px solid var(--line)}
dl.kv dd{margin:0;padding:10px 0 10px 12px;border-bottom:1px solid var(--line);font-weight:600;white-space:pre-wrap;word-break:break-word}
@media (max-width:600px){dl.kv{grid-template-columns:1fr} dl.kv dt{border:0;padding-bottom:0} dl.kv dd{padding-left:0}}
.sig-img{height:70px;max-width:240px;object-fit:contain;border-bottom:1.5px solid var(--ink-2);display:block;background:#fff}
.tl{list-style:none;margin:0;padding:0}
.tl li{position:relative;padding:0 0 18px 34px}
.tl li::before{content:"";position:absolute;left:11px;top:26px;bottom:0;width:2px;background:var(--line)}
.tl li:last-child::before{display:none}
.tl .dot{position:absolute;left:0;top:2px;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--slate-50);color:var(--slate);font-size:12px;font-weight:800}
.tl .dot.aprobado{background:var(--green);color:#fff} .tl .dot.rechazado{background:var(--brick);color:#fff} .tl .dot.pendiente{background:var(--olive);color:#fff}
.tl .dot svg{width:14px;height:14px}
.quote{background:var(--surface-2);border-left:3px solid var(--line-2);padding:8px 12px;border-radius:6px;font-size:13.5px;margin-top:6px;white-space:pre-wrap}

/* Firma */
.sigpad{border:1.5px dashed var(--line-2);border-radius:12px;background:#fff;position:relative;overflow:hidden}
.sigpad canvas{display:block;width:100%;height:170px;touch-action:none;cursor:crosshair}
.sigpad .ph{position:absolute;inset:0;display:grid;place-items:center;color:var(--ink-3);pointer-events:none;font-size:14px}
.sigpad .line{position:absolute;left:24px;right:24px;bottom:38px;border-bottom:1px solid var(--line-2);pointer-events:none}
.sigpad.has .ph{display:none}
.sig-tools{display:flex;justify-content:space-between;align-items:center;margin-top:6px}

/* Login */
.login{min-height:100vh;display:grid;grid-template-columns:1.05fr 1fr}
.login-art{background:var(--green);color:#fff;padding:48px clamp(28px,5vw,72px);display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}
.login-art::after{content:"";position:absolute;right:-120px;bottom:-120px;width:420px;height:420px;border-radius:50%;border:60px solid rgba(255,255,255,.06)}
.login-art h1{font-size:clamp(28px,3.4vw,40px);line-height:1.12;max-width:15ch;margin:18px 0 14px}
.login-art p{opacity:.85;max-width:44ch}
.login-art ul{list-style:none;padding:0;margin:22px 0 0;display:grid;gap:10px}
.login-art li{display:flex;gap:10px;align-items:center;opacity:.92;font-size:14px}
.login-art li svg{width:18px;height:18px;flex:none}
.login-form{display:grid;place-items:center;padding:32px 20px}
.login-card{width:100%;max-width:420px}
.otp{display:flex;gap:8px;justify-content:space-between}
.otp input{width:100%;max-width:52px;height:58px;text-align:center;font-size:24px;font-weight:800;border:1.5px solid var(--line-2);border-radius:12px;outline:none;background:#fff}
.otp input:focus{border-color:var(--green);box-shadow:0 0 0 3px rgba(20,86,74,.14)}
@media (max-width:860px){.login{grid-template-columns:1fr}.login-art{padding:28px 20px}.login-art ul,.login-art::after{display:none}.login-art h1{margin:12px 0 6px}}

/* Modal / toast */
.modal-bg{position:fixed;inset:0;background:rgba(14,24,22,.48);z-index:100;display:flex;align-items:flex-start;justify-content:center;padding:5vh 16px;overflow:auto;animation:fi .15s}
.modal{background:#fff;border-radius:18px;box-shadow:var(--shadow-lg);width:100%;max-width:560px;animation:up .18s}
.modal.lg{max-width:860px}
.modal-h{padding:18px 22px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px}
.modal-b{padding:20px 22px}
.modal-f{padding:14px 22px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap;background:var(--surface-2);border-radius:0 0 18px 18px}
@keyframes fi{from{opacity:0}} @keyframes up{from{transform:translateY(12px);opacity:0}}
#toasts{position:fixed;right:16px;bottom:16px;z-index:200;display:flex;flex-direction:column;gap:8px;max-width:calc(100vw - 32px)}
.toast{background:var(--ink);color:#fff;border-radius:12px;padding:12px 16px;box-shadow:var(--shadow-lg);font-size:14px;max-width:420px;animation:up .2s;display:flex;gap:10px;align-items:flex-start}
.toast.err{background:var(--brick)} .toast.ok{background:var(--green)}

/* Editores admin */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:18px;overflow-x:auto}
.tabs button{border:0;background:none;padding:10px 14px;font-weight:600;color:var(--ink-2);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button.on{color:var(--green);border-bottom-color:var(--green)}
.fcard{border:1px solid var(--line);border-radius:12px;padding:14px;background:#fff;display:grid;gap:12px}
.fcard.sys{border-color:var(--green-100);background:linear-gradient(0deg,#fff,#fff),var(--green-50)}
.fcard-h{display:flex;align-items:center;gap:8px}
.fcard-h .num{width:26px;height:26px;border-radius:7px;background:var(--slate-50);color:var(--slate);display:grid;place-items:center;font-weight:800;font-size:12px;flex:none}
.flow{display:grid;gap:0}
.flow .step{position:relative}
.flow .arrow{height:26px;display:grid;place-items:center;color:var(--ink-3)}
.flow .arrow svg{width:18px;height:18px}
.step-start,.step-end{border-radius:999px;padding:8px 16px;font-weight:700;font-size:13px;justify-self:start}
.step-start{background:var(--slate-50);color:var(--slate)} .step-end{background:var(--green);color:#fff}
.cond-exc{border-left:4px solid var(--olive)}
.kbd{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:1px 6px}
.copy-box{display:flex;gap:8px}
.copy-box .inp{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px}
.pol{display:flex;gap:14px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--surface-2)}
.pol .ic{width:40px;height:40px;border-radius:10px;background:var(--green);color:#fff;display:grid;place-items:center;flex:none}
.pol .ic svg{width:20px;height:20px}
.pol.ok{border-color:var(--green-100);background:var(--green-50)}
.chk.off{opacity:.55;cursor:not-allowed}
.ver{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-top:10px}
.diff{background:var(--olive-50);color:#5c5214;border-radius:6px;padding:1px 7px;font-size:12px;font-weight:600;display:inline-block;margin:2px 4px 2px 0}
.pdfview{width:100%;height:68vh;border:1px solid var(--line);border-radius:10px;background:#525659}
.dot-st{width:9px;height:9px;border-radius:50%;display:inline-block}
</style>

<script>
/* =====================================================================
   UTILIDADES
   ===================================================================== */
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const TZ = 'America/Costa_Rica';
const fmt = d => d ? new Date(d).toLocaleString('es-CR', {timeZone: TZ, day:'2-digit', month:'2-digit', year:'numeric', hour:'2-digit', minute:'2-digit', hour12:false}) : '—';
const fmtD = d => d ? new Date(d).toLocaleDateString('es-CR', {timeZone: TZ, day:'2-digit', month:'2-digit', year:'numeric'}) : '—';
const fmtISO = s => { if (!s) return '—'; const m = String(s).match(/^(\d{4})-(\d{2})-(\d{2})$/); return m ? `${m[3]}/${m[2]}/${m[1]}` : s; };
const hoy = () => new Date().toLocaleDateString('en-CA', {timeZone: TZ});
const DIAS = {lun:'Lunes', mar:'Martes', mie:'Miércoles', jue:'Jueves', vie:'Viernes', sab:'Sábado', dom:'Domingo'};

                 pendiente:'Pendiente', aprobado:'Aprobado', rechazado:'Rechazado', omitido:'Omitido', en_espera:'En espera'};
const ROLES = {admin:'Administrador', rh:'Recursos Humanos', usuario:'Colaborador'};
const TIPOS_CAMPO = {texto:'Texto corto', parrafo:'Párrafo', correo:'Correo', fecha:'Fecha', numero:'Número', lista:'Lista desplegable',

/* =====================================================================
   API (todas las llamadas pasan por funciones RPC seguras)
   ===================================================================== */
async function rpc(fn, args = {}) {
  let r;
  try {
    r = await fetch(`${CONFIG.SUPABASE_URL.replace(/\/+$/, '')}/rest/v1/rpc/${fn}`, {
      method: 'POST',
      headers: { apikey: CONFIG.SUPABASE_KEY, 'Content-Type': 'application/json' },
      body: JSON.stringify(args)
    });
  } catch (e) { throw new Error('No hay conexión con el servidor. Revise su internet.'); }
  const txt = await r.text();
  let data; try { data = txt ? JSON.parse(txt) : null; } catch { data = txt; }
  if (!r.ok) {
    const msg = (data && (data.message || data.hint)) || txt || ('Error ' + r.status);
    if (String(msg).includes('SESION_EXPIRADA')) { finSesion(); throw new Error('Su sesión expiró. Ingrese de nuevo.'); }
    if (r.status === 404 && /function|could not find/i.test(msg)) throw new Error('Falta instalar el esquema en Supabase (función ' + fn + ').');
    throw new Error(msg);
  }
  return data;
}
const api = (fn, args = {}) => rpc(fn, { p_token: S.token, ...args });

function toast(msg, tipo = '') {
  const t = document.createElement('div');
  t.className = 'toast ' + tipo; t.innerHTML = esc(msg);
  $('#toasts').appendChild(t);
  setTimeout(() => t.remove(), tipo === 'err' ? 7000 : 4200);
}
function modal({ title, body, actions = [], size = '', onOpen }) {
  const bg = document.createElement('div');
  bg.className = 'modal-bg';
  bg.innerHTML = `<div class="modal ${size}" role="dialog" aria-modal="true">
    <div class="modal-h"><h2>${esc(title)}</h2><button class="btn icon ghost" data-x aria-label="Cerrar">${I.x}</button></div>
    <div class="modal-b">${body}</div>
    ${actions.length ? `<div class="modal-f">${actions.map((a, i) => `<button class="btn ${a.cls || ''}" data-a="${i}">${a.label}</button>`).join('')}</div>` : ''}
  </div>`;
  const close = () => bg.remove();
  bg.addEventListener('mousedown', e => { if (e.target === bg) close(); });
  $('[data-x]', bg).onclick = close;
  actions.forEach((a, i) => { $(`[data-a="${i}"]`, bg).onclick = () => a.onClick ? a.onClick({ close, el: bg, btn: $(`[data-a="${i}"]`, bg) }) : close(); });
  $('#modal-root').appendChild(bg);
  onOpen && onOpen(bg, close);
  return { close, el: bg };
}
function confirmar(title, texto, label = 'Confirmar', cls = 'pri') {
  return new Promise(res => modal({ title, body: `<p style="margin:0">${texto}</p>`,
    actions: [{ label: 'Cancelar', onClick: ({ close }) => { close(); res(false); } },
              { label, cls, onClick: ({ close }) => { close(); res(true); } }] }));
}
async function ocupado(btn, fn) {
  if (!btn) return fn();
  const html = btn.innerHTML; btn.disabled = true; btn.innerHTML = '<span class="spin"></span>' + (btn.textContent.trim() ? ' Procesando…' : '');
  try { return await fn(); } finally { if (btn.isConnected) { btn.disabled = false; btn.innerHTML = html; } }
}

/* =====================================================================
   FIRMA (dibujo)
   ===================================================================== */
class Firma {
  constructor(host) {
    host.innerHTML = `<div class="sigpad"><canvas></canvas><div class="line"></div><div class="ph">${I.pen.replace('<svg', '<svg style="width:18px;height:18px;margin-right:6px;vertical-align:-3px"')}Firme aquí con el mouse o el dedo</div></div>
      <div class="sig-tools"><span class="xs muted">Su firma quedará en el documento final.</span><button type="button" class="btn sm ghost" data-clear>Borrar firma</button></div>`;
    this.wrap = $('.sigpad', host); this.c = $('canvas', host); this.ctx = this.c.getContext('2d');
    this.trazos = 0; this.dibujando = false;
    this.ajustar(); this._ro = new ResizeObserver(() => this.ajustar()); this._ro.observe(this.c);
    const pos = e => { const r = this.c.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
    this.c.addEventListener('pointerdown', e => { e.preventDefault(); this.c.setPointerCapture(e.pointerId); this.dibujando = true; this.last = pos(e); this.ctx.beginPath(); this.ctx.arc(this.last[0], this.last[1], 1.1, 0, Math.PI * 2); this.ctx.fill(); });
    this.c.addEventListener('pointermove', e => { if (!this.dibujando) return; const p = pos(e); this.ctx.beginPath(); this.ctx.moveTo(...this.last); this.ctx.lineTo(...p); this.ctx.stroke(); this.last = p; this.trazos++; this.wrap.classList.add('has'); });
    const fin = () => { this.dibujando = false; };
    this.c.addEventListener('pointerup', fin); this.c.addEventListener('pointercancel', fin);
    $('[data-clear]', host).onclick = () => this.limpiar();
  }
  ajustar() {
    const r = this.c.getBoundingClientRect(); if (!r.width) return;
    const dpr = window.devicePixelRatio || 1;
    if (this.c.width === Math.round(r.width * dpr)) return;
    const prev = this.trazos ? this.c.toDataURL() : null;
    this.c.width = Math.round(r.width * dpr); this.c.height = Math.round(r.height * dpr);
    this.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    Object.assign(this.ctx, { lineWidth: 2.4, lineCap: 'round', lineJoin: 'round', strokeStyle: '#1B2A55', fillStyle: '#1B2A55' });
    if (prev) { const img = new Image(); img.onload = () => this.ctx.drawImage(img, 0, 0, r.width, r.height); img.src = prev; }
  }
  limpiar() { this.ctx.clearRect(0, 0, this.c.width, this.c.height); this.trazos = 0; this.wrap.classList.remove('has'); }
  vacia() { return this.trazos < 4; }
  png() { // recorta y normaliza a 600x200 sobre fondo blanco (≈10–25 KB)
    const W = 600, H = 200, o = document.createElement('canvas'); o.width = W; o.height = H;
    const x = o.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, W, H);
    const d = this.ctx.getImageData(0, 0, this.c.width, this.c.height).data;
    let x0 = this.c.width, y0 = this.c.height, x1 = 0, y1 = 0;
    for (let yy = 0; yy < this.c.height; yy += 2) for (let xx = 0; xx < this.c.width; xx += 2) {
      if (d[(yy * this.c.width + xx) * 4 + 3] > 20) { if (xx < x0) x0 = xx; if (xx > x1) x1 = xx; if (yy < y0) y0 = yy; if (yy > y1) y1 = yy; }
    }
    if (x1 <= x0) return null;
    const pad = 12; x0 = Math.max(0, x0 - pad); y0 = Math.max(0, y0 - pad); x1 = Math.min(this.c.width, x1 + pad); y1 = Math.min(this.c.height, y1 + pad);
    const sw = x1 - x0, sh = y1 - y0, k = Math.min(W / sw, H / sh, 1.6), dw = sw * k, dh = sh * k;
    x.drawImage(this.c, x0, y0, sw, sh, (W - dw) / 2, (H - dh) / 2, dw, dh);
    return o.toDataURL('image/png');
  }
}

        <ul><li>${I.pen}Firma digital en cada paso</li><li>${I.flow}Flujo de aprobación con avisos por correo</li><li>${I.doc}Documento final en PDF con todas las firmas</li></ul></div>
      <div class="xs" style="opacity:.6">v${CONFIG.VERSION}</div>
    </section>
    <section class="login-form"><div class="login-card">${form}<p id="msg" class="small" style="color:var(--brick);min-height:20px;margin-top:12px"></p></div></section>
  </div>`;
  const msg = t => $('#msg').textContent = t || '';
  const back = $('[data-back]'); if (back) back.onclick = () => vistaLogin('correo', ctx);
  const f = $('#f'); if (!f) return;

  if (paso === 'correo') {
    $('#em').focus();
    f.onsubmit = e => { e.preventDefault(); ocupado($('button', f), async () => {
      msg(''); const email = $('#em').value.trim().toLowerCase();
      try {
        const r = await rpc('rh_login_inicio', { p_email: email });
        if (!r.ok) return msg(r.error);
        store.set('email', email);
        vistaLogin(r.modo, { email, nombre: r.nombre, minutos: r.minutos });
      } catch (err) { msg(err.message); }
    }); };
  }
  if (paso === 'pin') {
    $('#pin').focus();
    f.onsubmit = e => { e.preventDefault(); ocupado($('button', f), async () => {
      try { const r = await rpc('rh_login_pin', { p_email: ctx.email, p_pin: $('#pin').value }); if (!r.ok) { $('#pin').value = ''; return msg(r.error); } entrar(r); }
      catch (err) { msg(err.message); }
    }); };
  }
  if (paso === 'codigo') {
    const ins = $$('.otp input'); ins[0].focus();
    ins.forEach((inp, i) => {
      inp.addEventListener('input', () => { inp.value = inp.value.replace(/\D/g, '').slice(-1); if (inp.value && ins[i + 1]) ins[i + 1].focus(); if (ins.every(x => x.value)) f.requestSubmit(); });
      inp.addEventListener('keydown', e => { if (e.key === 'Backspace' && !inp.value && ins[i - 1]) ins[i - 1].focus(); });
      inp.addEventListener('paste', e => { const t = (e.clipboardData.getData('text') || '').replace(/\D/g, '').slice(0, 6); if (t.length) { e.preventDefault(); t.split('').forEach((c, j) => ins[j] && (ins[j].value = c)); (ins[t.length] || ins[5]).focus(); if (t.length === 6) f.requestSubmit(); } });
    });
    f.onsubmit = e => { e.preventDefault(); ocupado($('button.pri', f), async () => {
      try { const r = await rpc('rh_login_codigo', { p_email: ctx.email, p_codigo: ins.map(x => x.value).join('') });
        if (!r.ok) { ins.forEach(x => x.value = ''); ins[0].focus(); return msg(r.error); } entrar(r); }
      catch (err) { msg(err.message); }
    }); };
    $('[data-resend]').onclick = e => ocupado(e.currentTarget, async () => {
      try { const r = await rpc('rh_login_inicio', { p_email: ctx.email }); if (!r.ok) return msg(r.error); msg(''); toast('Le enviamos un código nuevo.', 'ok'); }
      catch (err) { msg(err.message); }
    });
  }
  if (paso === 'no_registrado') {
    $('#an').focus();
    f.onsubmit = e => { e.preventDefault(); ocupado($('button.pri', f), async () => {
      try { await rpc('rh_solicitar_acceso', { p_email: ctx.email, p_nombre: $('#an').value, p_departamento: $('#ad').value, p_puesto: $('#ap').value, p_comentario: $('#ac').value });
        vistaLogin('enviada', ctx); }
      catch (err) { msg(err.message); }
    }); };
  }
}

function campoHTML(f, v, deshab = false) {
  const id = 'c_' + f.key, d = deshab ? 'disabled' : '', req = f.requerido ? 'req' : '';
  const lab = `<label class="${req}" for="${id}">${esc(f.label)}</label>`;

  switch (f.tipo) {
    case 'parrafo': inner = `<textarea class="inp" id="${id}" data-k="${esc(f.key)}" ${d}>${esc(v)}</textarea>`; break;
    case 'correo': inner = `<input class="inp" id="${id}" type="email" data-k="${esc(f.key)}" value="${esc(v)}" placeholder="nombre@empresa.com" ${d}>`; break;
    case 'fecha': inner = `<input class="inp" id="${id}" type="date" data-k="${esc(f.key)}" value="${esc(v)}" ${d}>`; break;
    case 'numero': inner = `<input class="inp" id="${id}" type="number" data-k="${esc(f.key)}" value="${esc(v)}" ${d}>`; break;
    case 'lista': inner = `<select class="inp" id="${id}" data-k="${esc(f.key)}" ${d}><option value="">Seleccione…</option>${ops.map(o => `<option ${o === v ? 'selected' : ''}>${esc(o)}</option>`).join('')}</select>`; break;
    case 'departamento': { const deps = S.departamentos.includes(v) || !v ? S.departamentos : [v, ...S.departamentos];
      inner = `<select class="inp" id="${id}" data-k="${esc(f.key)}" ${d}><option value="">Seleccione…</option>${deps.map(o => `<option ${o === v ? 'selected' : ''}>${esc(o)}</option>`).join('')}</select>`; break; }
    case 'opcion': inner = `<div class="chk-grid" data-k="${esc(f.key)}" data-t="opcion">${ops.map(o => `<label class="chk"><input type="radio" name="${id}" value="${esc(o)}" ${o === v ? 'checked' : ''} ${d}><span>${esc(o)}</span></label>`).join('')}</div>`; break;
    case 'casillas': inner = `<div class="chk-grid" data-k="${esc(f.key)}" data-t="casillas">${ops.map(o => `<label class="chk"><input type="checkbox" value="${esc(o)}" ${(v || []).includes(o) ? 'checked' : ''} ${d}><span>${esc(o)}</span></label>`).join('')}</div>`; break;
    case 'si_no': return `<div class="field span2"><label class="chk"><input type="checkbox" data-k="${esc(f.key)}" data-t="si_no" ${v ? 'checked' : ''} ${d}><span><b class="${req}">${esc(f.label)}</b>${f.ayuda ? `<br><span class="help">${esc(f.ayuda)}</span>` : ''}</span></label></div>`;
    case 'dias': {
      const sel = v || [];
      inner = `<div class="days" data-k="${esc(f.key)}" data-t="dias" data-max="${esc(f.max || '')}">${(ops.length ? ops : ['lun','mar','mie','jue','vie']).map(o => `<button type="button" class="day ${sel.includes(o) ? 'on' : ''}" data-d="${o}" ${d}>${DIAS[o] || o}</button>`).join('')}</div>
        <div class="exc hidden" data-exc="${esc(f.key)}">
          <div class="row" style="margin-bottom:10px;color:#5c5214">${I.warn.replace('<svg', '<svg style="width:18px;height:18px"')}<b class="small">Eligió días consecutivos. La política lo permite solo por excepción: indique el motivo.</b></div>
          <div class="grid2"><div class="field"><label class="req">Motivo de la excepción</label><select class="inp" data-k="${esc(f.key)}_excepcion_motivo" ${d}><option value="">Seleccione…</option>${(f.motivos || ['Salud', 'Cuido', 'Otro']).map(o => `<option>${esc(o)}</option>`).join('')}</select></div>
          <div class="field span2"><label class="req">Detalle de la excepción</label><textarea class="inp" data-k="${esc(f.key)}_excepcion_detalle" style="min-height:64px" ${d}></textarea><span class="help">La excepción agrega al flujo la aprobación del director del departamento y de RH.</span></div></div>
        </div>`;
      break;
    }
    default: inner = `<input class="inp" id="${id}" data-k="${esc(f.key)}" value="${esc(v)}" ${d}>`;
  }
  const ancho = ['parrafo', 'casillas', 'opcion', 'dias'].includes(f.tipo) ? 'span2' : '';

function enlazarForm(root) {
  $$('.days', root).forEach(box => {
    const key = box.dataset.k, exc = $(`[data-exc="${key}"]`, root);
    const refrescar = () => { const sel = $$('.day.on', box).map(b => b.dataset.d); exc && exc.classList.toggle('hidden', !consecutivos(sel)); };
    box.addEventListener('click', e => { const b = e.target.closest('.day'); if (!b || b.disabled) return;
      if (!b.classList.contains('on') && box.dataset.max && $$('.day.on', box).length >= +box.dataset.max) return toast(`Puede elegir como máximo ${box.dataset.max} día(s).`, 'err');
      b.classList.toggle('on'); refrescar(); });
    refrescar();
  });
}
function leerForm(root, formulario) {
  const datos = {};
  formulario.forEach(f => {
    if (f.tipo === 'casillas') datos[f.key] = $$(`[data-k="${f.key}"] input:checked`, root).map(i => i.value);
    else if (f.tipo === 'opcion') datos[f.key] = $(`[data-k="${f.key}"] input:checked`, root)?.value || '';
    else if (f.tipo === 'si_no') datos[f.key] = !!$(`[data-k="${f.key}"]`, root)?.checked;
    else if (f.tipo === 'dias') {
      const sel = $$(`[data-k="${f.key}"] .day.on`, root).map(b => b.dataset.d).sort((a, b) => DIAS_ORD.indexOf(a) - DIAS_ORD.indexOf(b));
      datos[f.key] = sel;
      if (consecutivos(sel)) { datos[f.key + '_excepcion_motivo'] = $(`[data-k="${f.key}_excepcion_motivo"]`, root).value; datos[f.key + '_excepcion_detalle'] = $(`[data-k="${f.key}_excepcion_detalle"]`, root).value.trim(); }
    }
    else datos[f.key] = ($(`[data-k="${f.key}"]`, root)?.value || '').trim();
  });
  return datos;
}
function validarForm(formulario, datos) {
  for (const f of formulario) {
    const v = datos[f.key];
    const vacio = v == null || v === '' || v === false || (Array.isArray(v) && !v.length);
    if (f.requerido && vacio) return `Complete el campo: ${f.label}`;
    if (f.tipo === 'correo' && v && !/^[^@\s;,]+@[^@\s;,]+\.[^@\s;,]+$/.test(v)) return `Correo inválido en: ${f.label}`;
    if (f.tipo === 'dias' && consecutivos(v) && (!datos[f.key + '_excepcion_motivo'] || !datos[f.key + '_excepcion_detalle'])) return 'Eligió días consecutivos: indique el motivo y el detalle de la excepción.';
  }
  if (datos.correo_jefatura && datos.correo_jefatura.toLowerCase() === S.user.email) return 'El correo de la jefatura no puede ser el suyo.';
  return null;
}

async function abrirPolitica(id, alAbrir) {
  const r = await api('rh_politica_archivo', { p_id: id });
  const bin = atob(r.contenido), arr = new Uint8Array(bin.length);
  for (let k = 0; k < bin.length; k++) arr[k] = bin.charCodeAt(k);
  const url = URL.createObjectURL(new Blob([arr], { type: r.mime })), esPdf = r.mime === 'application/pdf';
  modal({ title: r.titulo + (r.version ? ' · v' + r.version : ''), size: 'lg', body: `
      ${esPdf ? `<iframe class="pdfview" src="${url}" title="Política"></iframe>` : `<div class="alert a-info">${I.info}<div>La política está en formato Word. Descárguela para leerla.</div></div>`}
      <div class="row wrap" style="margin-top:12px"><a class="btn" href="${url}" target="_blank" rel="noopener">Abrir en pestaña nueva</a><a class="btn" href="${url}" download="${esc(r.archivo_nombre)}">${I.pdf} Descargar</a></div>`,
    actions: [{ label: 'Cerrar', cls: 'pri' }] });
  alAbrir && alAbrir();
}
function vistaNueva(codigo, E) {
  // E = {s, D} cuando se modifica una solicitud existente
  const m = S.modulos.find(x => x.codigo === codigo && x.activo);
  if (!m) { toast('El trámite no está disponible.', 'err'); location.hash = '#/'; return; }
  const t = m.textos || {}, editando = !!E, prev = E ? E.s.datos : null;
  const valor = f => editando ? (prev[f.key] ?? (f.tipo === 'casillas' || f.tipo === 'dias' ? [] : '')) : valorAuto(f);
  const flujoTxt = (m.flujo || []).map(p => `<span class="tag ${p.condicion === 'excepcion' ? 'exc' : ''}">${esc(p.nombre)}${p.condicion === 'excepcion' ? ' · si hay excepción' : ''}</span>`).join(' → ');
  let politicaAbierta = !m.politica;
  shell(editando ? 'mis' : 'inicio', `
    <div class="page-head"><div><a href="${editando ? '#/solicitud/' + E.s.id : '#/'}" class="small" style="text-decoration:none">← ${editando ? 'Volver a la solicitud' : 'Inicio'}</a>
      <h1 style="margin-top:6px">${editando ? 'Modificar ' + esc(E.s.folio) : esc(m.nombre)}</h1><p>${editando ? esc(m.nombre) + ' · versión actual ' + (E.s.version || 1) : esc(m.descripcion)}</p></div></div>
    <form id="fs" class="stack" novalidate>
      ${editando ? `<div class="alert a-warn">${I.warn}<div><b>Al guardar, el flujo de aprobación se reinicia desde el primer paso.</b> Las aprobaciones que ya tenga quedan sin efecto, las personas involucradas reciben aviso y deberá firmar de nuevo. La versión anterior queda guardada en el historial.</div></div>` : ''}
      ${t.intro ? `<div class="alert a-info">${I.shield}<div class="small">${esc(t.intro)}</div></div>` : ''}
      <div class="card"><div class="card-h"><h2>Información de la solicitud</h2><span class="xs muted">Los campos con <span style="color:var(--brick)">*</span> son obligatorios</span></div>
        <div class="card-b grid2">${m.formulario.map(f => campoHTML(f, valor(f))).join('')}</div></div>
      <div class="card"><div class="card-b stack">
        ${editando ? `<div class="field"><label for="motivo">¿Qué cambió y por qué? <span class="muted">(se informa a los aprobadores)</span></label><textarea class="inp" id="motivo" style="min-height:60px"></textarea></div>` : ''}
        ${bloquePolitica(m)}
        ${t.declaracion ? `<label class="chk ${politicaAbierta ? '' : 'off'}" id="declw" style="padding:14px"><input type="checkbox" id="decl" ${politicaAbierta ? '' : 'disabled'}><span><b>Declaración.</b> ${esc(t.declaracion)}</span></label>` : ''}
        <div><div class="lbl req" style="margin-bottom:6px">Firma del solicitante</div><div id="sig"></div></div>
        <div class="small muted">Ruta de aprobación: ${flujoTxt}</div>
      </div></div>
      <div class="row" style="justify-content:flex-end;gap:10px"><a class="btn" href="${editando ? '#/solicitud/' + E.s.id : '#/'}">Cancelar</a>
        <button class="btn pri" id="enviar">${I.send} ${editando ? 'Guardar y reiniciar aprobación' : 'Enviar solicitud'}</button></div>
    </form>`);
  const root = $('#fs');
  if (editando) $$('[data-k$="_excepcion_motivo"], [data-k$="_excepcion_detalle"]', root).forEach(el => { if (prev[el.dataset.k] != null) el.value = prev[el.dataset.k]; });
  enlazarForm(root);
  const firma = new Firma($('#sig'));
  if (m.politica) $('#polbtn').onclick = e => ocupado(e.currentTarget, async () => {
    try { await abrirPolitica(m.politica.id, () => {
      politicaAbierta = true; const d = $('#decl'); if (d) { d.disabled = false; $('#declw').classList.remove('off'); }
      $('#polbox').classList.add('ok'); $('#polst').style.color = 'var(--green)'; $('#polst').textContent = 'Abierta. Ya puede marcar la declaración.';
    }); } catch (err) { toast(err.message, 'err'); }
  });
  root.onsubmit = e => { e.preventDefault(); ocupado($('#enviar'), async () => {
    const datos = leerForm(root, m.formulario);
    const err = validarForm(m.formulario, datos); if (err) return toast(err, 'err');
    if (!politicaAbierta) return toast('Abra la política vigente antes de continuar.', 'err');
    const decl = t.declaracion ? $('#decl').checked : true;
    if (!decl) return toast('Debe marcar la casilla de declaración.', 'err');
    if (firma.vacia()) return toast('Firme en el recuadro antes de enviar.', 'err');
    const base = { p_datos: datos, p_firma: firma.png(), p_declaracion: decl, p_politica_id: m.politica?.id ?? null };
    try {
      if (editando) {
        if (!await confirmar('Reiniciar el flujo de aprobación', `Se guardará la versión ${(E.s.version || 1) + 1} de <b>${esc(E.s.folio)}</b> y la aprobación empezará otra vez desde <b>${esc(m.flujo[0]?.nombre || 'el primer paso')}</b>. ¿Continuar?`, 'Sí, reiniciar', 'pri')) return;
        const r = await api('rh_modificar_solicitud', { p_id: E.s.id, ...base, p_motivo: $('#motivo').value.trim() });
        toast(`Cambios guardados (versión ${r.version}). El flujo se reinició.`, 'ok');
        location.hash = '#/solicitud/' + r.id;
      } else {
        const r = await api('rh_crear_solicitud', { p_modulo: m.codigo, ...base });
        toast(`Solicitud ${r.folio} enviada a aprobación.`, 'ok');
        location.hash = '#/solicitud/' + r.id;
      }
    } catch (err) { toast(err.message, 'err'); }
  }); };
}
async function vistaEditar(id) {
  cargando('mis');
  await cargarBase();
  const D = await api('rh_solicitud', { p_id: id });
  if (!D.permisos.modificar) { toast('Esta solicitud ya no se puede modificar.', 'err'); location.hash = '#/solicitud/' + id; return; }
  vistaNueva(D.solicitud.modulo, { s: D.solicitud, D });
}

function tablaSolicitudes(rows, opts = {}) {

  return `<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Folio</th>${opts.solicitante ? '<th>Solicitante</th>' : '<th>Trámite</th>'}<th>Enviada</th><th>Estado</th><th>${opts.extra || 'Paso actual'}</th></tr></thead><tbody>
    ${rows.map(s => `<tr class="click" data-id="${s.id}">
      <td><b>${esc(s.folio)}</b>${s.version > 1 ? ` <span class="tag">v${s.version}</span>` : ''}${s.excepcion ? ' <span class="tag exc">Excepción</span>' : ''}</td>
      ${opts.solicitante ? `<td>${esc(s.solicitante_nombre)}<div class="xs muted">${esc(s.departamento || '')}</div></td>` : `<td>${esc(s.modulo_nombre)}</td>`}
      <td class="small">${fmt(s.creado_en)}</td>
      <td>${badge(s.estado)}<div class="mini-steps">${(s.pasos || []).map(p => `<i class="${p.estado}" title="${esc(p.paso)}: ${esc(ESTADOS[p.estado])}"></i>`).join('')}</div></td>
      <td class="small">${opts.celda ? opts.celda(s) : s.paso_actual ? `${esc(s.paso_actual.paso)}<div class="xs muted">${esc((s.paso_actual.aprobadores || []).join(', '))}</div>` : s.estado === 'aprobada' ? (s.pdf_enviado_en ? `PDF enviado ${fmtD(s.pdf_enviado_en)}` : '<span style="color:var(--brick);font-weight:700">PDF sin enviar</span>') : '—'}</td>
    </tr>`).join('')}</tbody></table></div>`;
}

/* =====================================================================
   DETALLE + APROBACIÓN
   ===================================================================== */
function valorTexto(f, datos) {
  const v = datos[f.key];
  if (f.tipo === 'dias') return (v || []).map(d => DIAS[d] || d).join(', ') || '—';
  if (f.tipo === 'casillas') return (v || []).join(', ') || '—';
  if (f.tipo === 'si_no') return v ? 'Sí' : 'No';
  if (f.tipo === 'fecha') return fmtISO(v);
  return (v == null || v === '') ? '—' : String(v);
}
function filasDatos(s) {
  const out = [];
  (s.formulario || []).forEach(f => {
    out.push([f.label, valorTexto(f, s.datos)]);
    if (f.tipo === 'dias' && s.datos[f.key + '_excepcion_motivo']) {
      out.push(['Motivo de la excepción', s.datos[f.key + '_excepcion_motivo']]);
      out.push(['Detalle de la excepción', s.datos[f.key + '_excepcion_detalle'] || '—']);
    }
  });
  return out;
}

async function enviarPDF(id, soloAMi, D) {
  D = D || await api('rh_solicitud', { p_id: id });
  const doc = await construirPDF(D);
  const b64 = doc.output('datauristring').split(',')[1];
  return api('rh_enviar_pdf', { p_id: id, p_pdf_base64: b64, p_solo_a_mi: soloAMi });
}

/* =====================================================================
   PDF (se genera en el navegador; no se almacena)
   ===================================================================== */
const latin = s => String(s ?? '').normalize('NFC').replace(/[‘’]/g, "'").replace(/[“”]/g, '"').replace(/[–—]/g, '-').replace(/…/g, '...').replace(/[^\x09\x0A\x0D\x20-\x7E\xA0-\xFF]/g, '');
async function construirPDF(D) {
  if (!window.jspdf) throw new Error('No se pudo cargar el generador de PDF. Revise su conexión.');
  const s = D.solicitud, ap = (D.aprobaciones || []).filter(a => a.estado !== 'omitido');
  const doc = new window.jspdf.jsPDF({ unit: 'mm', format: 'a4' });
  const W = 210, M = 16, CW = W - 2 * M, VERDE = '#14564A', TINTA = '#16211F', GRIS = '#4A5A57', LINEA = '#E1E7E5';
  let y = 0;
  const nueva = () => { doc.addPage(); y = 20; };
  const espacio = h => { if (y + h > 280) nueva(); };
  const T = (txt, x, yy, o = {}) => doc.text(Array.isArray(txt) ? txt.map(latin) : latin(txt), x, yy, o);
  const split = (txt, w) => doc.splitTextToSize(latin(txt), w);

  // Encabezado
  doc.setFillColor(VERDE); doc.rect(0, 0, W, 30, 'F');
  doc.setTextColor('#FFFFFF'); doc.setFont('helvetica', 'bold'); doc.setFontSize(16); T(S.empresa, M, 13);
  doc.setFont('helvetica', 'normal'); doc.setFontSize(9); T(S.app + ' · Recursos Humanos', M, 19.5);
  doc.setFont('helvetica', 'bold'); doc.setFontSize(12); T(s.folio, W - M, 13, { align: 'right' });
  doc.setFont('helvetica', 'normal'); doc.setFontSize(8.5); T('Documento final', W - M, 19.5, { align: 'right' });
  y = 42;
  doc.setTextColor(TINTA); doc.setFont('helvetica', 'bold'); doc.setFontSize(17); T(D.modulo_nombre, M, y);
  doc.setFillColor('#E6F0ED'); doc.roundedRect(W - M - 36, y - 6, 36, 8.5, 2, 2, 'F');
  doc.setTextColor(VERDE); doc.setFontSize(9.5); T('APROBADA', W - M - 18, y - 0.4, { align: 'center' });
  y += 6; doc.setFont('helvetica', 'normal'); doc.setFontSize(9); doc.setTextColor(GRIS);
  T(`Enviada: ${fmt(s.creado_en)}    Aprobación final: ${fmt(s.finalizado_en)}${s.version > 1 ? '    Versión ' + s.version : ''}`, M, y); y += 7;
  if (s.textos?.intro) { doc.setFont('helvetica', 'italic'); doc.setFontSize(8.5); doc.setTextColor(GRIS); const l = split(s.textos.intro, CW); T(l, M, y); y += l.length * 3.8 + 4; }

  // Datos
  const seccion = (t, min = 14) => { espacio(min); doc.setFont('helvetica', 'bold'); doc.setFontSize(10); doc.setTextColor(VERDE); T(t.toUpperCase(), M, y); y += 2; doc.setDrawColor(VERDE); doc.setLineWidth(0.5); doc.line(M, y, W - M, y); y += 6; };
  seccion('Información de la solicitud');
  const LW = 62;
  filasDatos(s).concat([['Correo del solicitante', s.solicitante_email]]).forEach(([k, v]) => {
    doc.setFontSize(9.5); doc.setFont('helvetica', 'normal');
    const lk = split(k, LW - 4); doc.setFont('helvetica', 'bold'); const lv = split(v, CW - LW);
    const h = Math.max(lk.length, lv.length) * 4.4 + 3;
    espacio(h);
    doc.setFont('helvetica', 'normal'); doc.setTextColor(GRIS); T(lk, M, y);
    doc.setFont('helvetica', 'bold'); doc.setTextColor(TINTA); T(lv, M + LW, y);
    y += h - 1; doc.setDrawColor(LINEA); doc.setLineWidth(0.2); doc.line(M, y - 2.2, W - M, y - 2.2); y += 1.5;
  });
  if (s.textos?.declaracion) {
    y += 2; doc.setFont('helvetica', 'normal'); doc.setFontSize(9); doc.setTextColor(TINTA);
    const l = split('[X]  ' + s.textos.declaracion, CW); espacio(l.length * 4 + 4); T(l, M, y); y += l.length * 4 + 4;
  }
  if (s.politica_id) {
    doc.setFont('helvetica', 'bold'); doc.setFontSize(9); doc.setTextColor(VERDE); espacio(6);
    T(`Política aceptada: ${s.politica_titulo}${s.politica_version ? ' (versión ' + s.politica_version + ')' : ''} - ${fmt(s.politica_aceptada_en)}`, M, y); y += 6;
  }

  // Firma del solicitante
  const bloqueFirma = (img, titulo, nombre, detalle, extra) => {
    const lx = extra ? split(extra, CW - 70) : [];
    const h = Math.max(30, 16 + lx.length * 3.8);
    espacio(h + 4);
    doc.setDrawColor(LINEA); doc.setLineWidth(0.3); doc.roundedRect(M, y, CW, h, 2, 2);
    if (img) { try { doc.addImage(img, 'PNG', M + 3, y + 2, 60, 20, undefined, 'FAST'); } catch {} }
    doc.setDrawColor('#9AA8A5'); doc.line(M + 4, y + 23, M + 62, y + 23);
    doc.setFontSize(7.5); doc.setTextColor(GRIS); doc.setFont('helvetica', 'normal'); T('Firma', M + 4, y + 26.5);
    const x2 = M + 70;
    doc.setFont('helvetica', 'bold'); doc.setFontSize(9.5); doc.setTextColor(VERDE); T(titulo, x2, y + 6);
    doc.setTextColor(TINTA); doc.setFontSize(10); T(nombre, x2, y + 11.5);
    doc.setFont('helvetica', 'normal'); doc.setFontSize(8.5); doc.setTextColor(GRIS); T(detalle, x2, y + 16);
    if (lx.length) { doc.setTextColor(TINTA); T(lx, x2, y + 20.5); }
    y += h + 4;
  };
  seccion('Firma del solicitante', 48);
  bloqueFirma(s.firma_solicitante, 'Solicitante', s.solicitante_nombre, `${s.solicitante_email} · ${fmt(s.creado_en)}`);

  seccion('Flujo de aprobación', 48);
  ap.forEach((a, i) => bloqueFirma(a.firma, `${i + 1}. ${a.paso} - ${ESTADOS[a.estado] || a.estado}`, a.resuelto_por_nombre || '-',
    `${a.resuelto_por_email || ''} · ${fmt(a.resuelto_en)}`, a.comentario ? 'Comentario: ' + a.comentario : ''));

  if (s.textos?.msg_aprobado) { const l = split(s.textos.msg_aprobado, CW - 8); espacio(l.length * 4.5 + 8);
    doc.setFillColor('#E6F0ED'); doc.roundedRect(M, y, CW, l.length * 4.5 + 6, 2, 2, 'F');
    doc.setFont('helvetica', 'bold'); doc.setFontSize(9.5); doc.setTextColor(VERDE); T(l, M + 4, y + 5.5); y += l.length * 4.5 + 10; }

  // Pie
  const n = doc.getNumberOfPages(), gen = fmt(new Date());
  for (let p = 1; p <= n; p++) {
    doc.setPage(p); doc.setDrawColor(LINEA); doc.setLineWidth(0.2); doc.line(M, 285, W - M, 285);
    doc.setFont('helvetica', 'normal'); doc.setFontSize(7.5); doc.setTextColor('#7C8B88');
    T(`Documento generado electrónicamente el ${gen} a partir de los registros de ${S.app}. Folio ${s.folio}.`, M, 289.5);
    T(`Página ${p} de ${n}`, W - M, 289.5, { align: 'right' });
  }
  return doc;
}

  const T = ED.textos;
  const campos = [['intro', 'Texto inicial (confidencialidad)', 'Se muestra al inicio del formulario y en el PDF.'],
                  ['declaracion', 'Declaración (casilla obligatoria)', 'El solicitante debe marcarla para poder enviar.'],
                  ['msg_aprobado', 'Mensaje al aprobarse', 'Va en el correo final con el PDF y en el documento.'],
                  ['msg_rechazado', 'Mensaje al rechazarse', 'Va en el correo de rechazo, antes del motivo.']];
  $('#edbody').innerHTML = `<div class="card card-b stack">${campos.map(([k, l, h]) => `<div class="field"><label>${l}</label><textarea class="inp" data-t="${k}">${esc(T[k] || '')}</textarea><span class="help">${h}</span></div>`).join('')}</div>`;
  $('#edbody').oninput = e => { if (e.target.dataset.t) T[e.target.dataset.t] = e.target.value; };
  $('#edbody').onclick = null;
}
function edGeneral() {
  $('#edbody').innerHTML = `<div class="card card-b grid2">
    <div class="field"><label>Nombre del trámite</label><input class="inp" data-g="nombre" value="${esc(ED.nombre)}"></div>
    <div class="field"><label>Prefijo del folio</label><input class="inp" data-g="prefijo" value="${esc(ED.prefijo)}" maxlength="6"><span class="help">Ej. TT → TT-2026-0001</span></div>
    <div class="field span2"><label>Descripción</label><input class="inp" data-g="descripcion" value="${esc(ED.descripcion)}"></div>
    <label class="chk"><input type="checkbox" data-g="activo" ${ED.activo ? 'checked' : ''}><span><b>Módulo activo</b><br><span class="small muted">Si se desactiva, nadie puede crear solicitudes nuevas.</span></span></label></div>`;
  $('#edbody').oninput = $('#edbody').onchange = e => { const g = e.target.dataset.g; if (g) ED[g] = e.target.type === 'checkbox' ? e.target.checked : e.target.value; };
  $('#edbody').onclick = null;
}

/* =====================================================================
   ADMIN · CONFIGURACIÓN
   ===================================================================== */
async function adminConfig() {
  cargando('config');
  const c = await api('rh_admin_config');
  const v = k => esc(c[k] ?? '');
  const dom = Array.isArray(c.dominios_permitidos) ? c.dominios_permitidos.join(', ') : '';
  const urlApp = location.href.split('#')[0];
  shell('config', `<div class="page-head"><div><h1>Configuración</h1><p>Correo, seguridad y textos generales.</p></div><button class="btn pri" id="gc">${I.check} Guardar</button></div>
    ${c._pg_net ? '' : `<div class="alert a-err">${I.warn}<div><b>pg_net no está activo.</b> Supabase → Database → Extensions → busque <span class="kbd">pg_net</span> y actívelo. Sin esto no salen correos.</div></div>`}
    <div class="stack">
    <div class="card"><div class="card-h"><h2>Power Automate (correos)</h2><span class="row small">${c.pa_url ? '<span class="dot-st" style="background:var(--green)"></span> Conectado' : '<span class="dot-st" style="background:var(--brick)"></span> Sin configurar'}</span></div><div class="card-b grid2">
      <div class="field span2"><label>URL del flujo de Power Automate (disparador HTTP)</label><div class="copy-box"><input class="inp" type="password" autocomplete="off" data-c="pa_url" value="${v('pa_url')}" placeholder="Pegue aquí la URL HTTP POST del flujo"><button class="btn" type="button" id="verurl" title="Mostrar u ocultar">Ver</button></div><span class="help">Se guarda en la base de datos y solo los administradores la ven. Debe ser un flujo propio de esta app (no el de Pricing).</span></div>
      <div class="field span2"><label>Secreto compartido</label><div class="copy-box"><input class="inp" data-c="pa_secreto" value="${v('pa_secreto')}"><button class="btn" id="cpy" title="Copiar">${I.copy}</button><button class="btn" id="gen" title="Generar nuevo">${I.refresh}</button></div>
        <span class="help">Pegue este mismo valor en la condición del flujo. Si lo cambia aquí, cámbielo también en Power Automate.</span></div>
      <div class="field span2"><label>Copia del PDF final para RH</label><input class="inp" data-c="correos_rh" value="${v('correos_rh')}" placeholder="rrhh@legrand.com, gerente.rh@legrand.com"><span class="help">Si se deja vacío, se usa el aprobador del último paso.</span></div>
      <div class="field span2"><label>Modo prueba: desviar TODOS los correos a</label><input class="inp" data-c="modo_prueba_correo" value="${v('modo_prueba_correo')}" placeholder="vacío = modo normal"><span class="help">Para probar sin molestar a nadie: el asunto indica a quién iba dirigido.</span></div>
      <div class="row span2 wrap"><input class="inp" id="tp" placeholder="Correo para la prueba (vacío = el suyo)" style="max-width:320px"><button class="btn" id="test">${I.mail} Enviar correo de prueba</button><a href="#/admin/correos" class="small">Ver bitácora de correos →</a></div>
    </div></div>
    <div class="card"><div class="card-h"><h2>Aplicación</h2></div><div class="card-b grid2">
      <div class="field"><label>Nombre de la app</label><input class="inp" data-c="nombre_app" value="${v('nombre_app')}"></div>
      <div class="field"><label>Empresa</label><input class="inp" data-c="nombre_empresa" value="${v('nombre_empresa')}"></div>
      <div class="field span2"><label>URL pública de la app (para los botones de los correos)</label><div class="copy-box"><input class="inp" data-c="app_url" value="${v('app_url')}" placeholder="https://..."><button class="btn" id="usar" title="Usar la dirección actual">Usar actual</button></div><span class="help">Dirección actual: ${esc(urlApp)}</span></div>
    </div></div>
    <div class="card"><div class="card-h"><h2>Seguridad de acceso</h2></div><div class="card-b grid3">
      <div class="field"><label>Dominios permitidos</label><input class="inp" id="dom" value="${esc(dom)}"><span class="help">Separados por coma. Vacío = cualquier correo.</span></div>
      <div class="field"><label>Vigencia del código (minutos)</label><input class="inp" type="number" min="5" max="1440" data-c="minutos_codigo" value="${v('minutos_codigo')}"></div>
      <div class="field"><label>Duración de la sesión (horas)</label><input class="inp" type="number" min="1" max="168" data-c="horas_sesion" value="${v('horas_sesion')}"></div>
    </div></div></div>`);
  $('#cpy').onclick = () => { navigator.clipboard?.writeText($('[data-c=pa_secreto]').value); toast('Secreto copiado.', 'ok'); };
  $('#gen').onclick = () => { const a = new Uint8Array(18); crypto.getRandomValues(a); $('[data-c=pa_secreto]').value = [...a].map(x => x.toString(16).padStart(2, '0')).join(''); toast('Secreto nuevo generado: guarde y actualícelo en Power Automate.'); };
  $('#usar').onclick = () => $('[data-c=app_url]').value = urlApp;
  $('#verurl').onclick = () => { const i = $('[data-c=pa_url]'); i.type = i.type === 'password' ? 'text' : 'password'; $('#verurl').textContent = i.type === 'password' ? 'Ver' : 'Ocultar'; };
  const guardar = async () => {
    const cfg = {}; $$('[data-c]').forEach(i => cfg[i.dataset.c] = i.type === 'number' ? +i.value : i.value.trim());
    cfg.dominios_permitidos = $('#dom').value.split(/[,;\s]+/).map(x => x.trim().replace(/^@/, '')).filter(Boolean);
    await api('rh_admin_guardar_config', { p_cfg: cfg });
  };
  $('#gc').onclick = e => ocupado(e.currentTarget, async () => { try { await guardar(); toast('Configuración guardada.', 'ok'); adminConfig(); } catch (err) { toast(err.message, 'err'); } });
  $('#test').onclick = e => ocupado(e.currentTarget, async () => {
    try { await guardar(); const r = await api('rh_admin_probar_correo', { p_para: $('#tp').value });
      toast(r.configurado ? 'Correo de prueba enviado a Power Automate. Revise la bitácora en unos segundos.' : 'Falta la URL de Power Automate.', r.configurado ? 'ok' : 'err'); }
    catch (err) { toast(err.message, 'err'); }
  });
}
async function adminCorreos() {
  cargando('correos');
  const rows = await api('rh_admin_correos');
  const st = r => r.estado !== 'enviado' ? `<span class="badge s-rechazada">${esc(r.estado)}</span>`
    : r.http ? (r.http >= 200 && r.http < 300 ? `<span class="badge s-aprobada">HTTP ${r.http}</span>` : `<span class="badge s-rechazada">HTTP ${r.http}</span>`)
    : r.error ? `<span class="badge s-rechazada" title="${esc(r.error)}">Error</span>` : '<span class="badge s-cancelada">Enviado</span>';
  shell('correos', `<div class="page-head"><div><h1>Bitácora de correos</h1><p>Últimos 150 envíos hacia Power Automate. HTTP 202 = el flujo lo recibió.</p></div><button class="btn" id="rf">${I.refresh} Actualizar</button></div>
    <div class="card">${!rows.length ? `<div class="empty">${I.mail}<div>Aún no se han enviado correos.</div></div>` : `<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Fecha</th><th>Tipo</th><th>Para</th><th>Asunto</th><th>Resultado</th></tr></thead><tbody>
    ${rows.map(r => `<tr><td class="small" style="white-space:nowrap">${fmt(r.creado_en)}</td><td><span class="tag">${esc(r.tipo)}</span></td><td class="small">${esc(r.para)}</td><td class="small">${esc(r.asunto.replace(/(código de acceso: )\d{6}/i, '$1••••••'))}</td><td>${st(r)}${r.error ? `<div class="xs muted" style="max-width:220px">${esc(r.error)}</div>` : ''}</td></tr>`).join('')}
    </tbody></table></div>`}</div>
    <p class="xs muted" style="margin-top:10px">Supabase conserva el resultado HTTP solo unas horas; después la columna muestra “Enviado”.</p>`);
  $('#rf').onclick = adminCorreos;
}

iniciar();
</script>
</body>
</html>
