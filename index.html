    <div class="field"><label>Nombre del trámite</label><input class="inp" data-g="nombre" value="${esc(ED.nombre)}"></div>
    <div class="field"><label>Prefijo del folio</label><input class="inp" data-g="prefijo" value="${esc(ED.prefijo)}" maxlength="6"><span class="help">Ej. TT → TT-2026-0001</span></div>
    <div class="field span2"><label>Descripción</label><input class="inp" data-g="descripcion" value="${esc(ED.descripcion)}"></div>
    <div class="field span2"><label>Copia del aviso de aprobación (correos de RH)</label><input class="inp" data-g="correos_copia" value="${esc(ED.correos_copia || '')}" placeholder="rrhh@legrand.com, gerente.rh@legrand.com"><span class="help">Reciben el aviso de cada solicitud aprobada de este trámite y pueden entrar a ver y descargar el documento. Vacío = se usa el aprobador del último paso.</span></div>
    <label class="chk"><input type="checkbox" data-g="activo" ${ED.activo ? 'checked' : ''}><span><b>Trámite activo</b><br><span class="small muted">Si se desactiva, nadie puede crear solicitudes nuevas.</span></span></label>
    <label class="chk"><input type="checkbox" data-o="pedir_info" ${O.pedir_info ? 'checked' : ''}><span><b>Permitir "Solicitar más información"</b><br><span class="small muted">El aprobador puede devolverle una pregunta al solicitante; al responder, vuelve al mismo paso.</span></span></label>
    <div class="field span2"><label>Enlace directo al formulario (para COMET o la intranet)</label><div class="copy-box"><input class="inp" id="lnk" readonly value="${esc(location.href.split('#')[0] + '#/nueva/' + ED.codigo)}"><button class="btn" id="cplnk" title="Copiar">${I.copy}</button></div>
      <span class="help">Quien lo abra entra con su código y llega directo a este formulario. Si no tiene usuario, puede solicitar acceso.</span></div>
    <div class="span2" style="border-top:1px solid var(--line);padding-top:14px"><label class="chk"><input type="checkbox" id="benon" ${O.beneficio ? 'checked' : ''}><span><b>Este trámite otorga un beneficio con reembolsos</b><br><span class="small muted">Activa el seguimiento de reembolsos y beneficiarios activos en cada solicitud aprobada y la pestaña de presupuesto en Reportes.</span></span></label>
      ${O.beneficio ? `<div class="grid3" style="margin-top:10px">
        <div class="field"><label>Vigencia del beneficio (meses)</label><input class="inp" type="number" min="1" max="60" data-b="vigencia_meses" value="${esc(O.beneficio.vigencia_meses || 12)}"></div>
        <div class="field"><label>Moneda</label><input class="inp" data-b="moneda" value="${esc(O.beneficio.moneda || 'USD')}" maxlength="5"></div>
        <div class="field"><label>Dato del monto aprobado</label><select class="inp" data-b="campo_monto">${ED.flujo.flatMap(p => p.datos || []).filter(d => d.tipo === 'numero').map(d => `<option value="${esc(d.key)}" ${O.beneficio.campo_monto === d.key ? 'selected' : ''}>${esc(d.label)}</option>`).join('') || '<option value="monto">monto (agregue el dato en el flujo)</option>'}</select></div>
        <div class="field"><label>Campo "tipo" para los reportes</label><select class="inp" data-b="campo_tipo">${ED.formulario.filter(f => ['lista', 'opcion'].includes(f.tipo)).map(f => `<option value="${esc(f.key)}" ${O.beneficio.campo_tipo === f.key ? 'selected' : ''}>${esc(f.label)}</option>`).join('')}</select></div>
        <div class="field"><label>Campo "período" para los reportes</label><select class="inp" data-b="campo_periodo">${ED.formulario.filter(f => ['lista', 'opcion'].includes(f.tipo)).map(f => `<option value="${esc(f.key)}" ${O.beneficio.campo_periodo === f.key ? 'selected' : ''}>${esc(f.label)}</option>`).join('')}</select></div>
      </div>` : ''}</div></div>`;
  $('#cplnk').onclick = () => { navigator.clipboard?.writeText($('#lnk').value); toast('Enlace copiado.', 'ok'); };
  $('#benon').onchange = e => { if (e.target.checked) O.beneficio = O.beneficio || { vigencia_meses: 12, moneda: 'USD', campo_monto: 'monto', campo_tipo: '', campo_periodo: '' }; else delete O.beneficio; ED._sucio = true; edGeneral(); };
  $('#edbody').oninput = $('#edbody').onchange = e => { const g = e.target.dataset.g, o = e.target.dataset.o, bb = e.target.dataset.b;
    if (g) ED[g] = e.target.type === 'checkbox' ? e.target.checked : e.target.value;
    if (o) O[o] = e.target.checked;
    if (bb) O.beneficio[bb] = e.target.type === 'number' ? +e.target.value : e.target.value; };
  $('#edbody').onclick = null;
}

/* =====================================================================

async function adminConfig() {
  cargando('config');
  const [c, dp] = await Promise.all([api('rh_admin_config'), api('rh_admin_datos_prueba', { p_accion: 'estado' })]);
  const v = k => esc(c[k] ?? '');
  const dom = Array.isArray(c.dominios_permitidos) ? c.dominios_permitidos.join(', ') : '';
  const urlApp = location.href.split('#')[0];
  shell('config', `<div class="page-head"><div><h1>Configuración general</h1><p>Aplica a toda la central: envío de correos, enlaces y seguridad de acceso. Lo propio de cada trámite está en <b>Trámites · configuración</b>.</p></div><button class="btn pri" id="gc">${I.check} Guardar</button></div>
    ${c._pg_net ? '' : `<div class="alert a-err">${I.warn}<div><b>pg_net no está activo.</b> Supabase → Database → Extensions → busque <span class="kbd">pg_net</span> y actívelo. Sin esto no salen correos.</div></div>`}
    <div class="stack">
    <div class="card"><div class="card-h"><h2>Power Automate (correos)</h2><span class="row small">${c.pa_url ? '<span class="dot-st" style="background:var(--pri)"></span> Conectado' : '<span class="dot-st" style="background:var(--danger)"></span> Sin configurar'}</span></div><div class="card-b grid2">
      <div class="field span2"><label>URL del flujo de Power Automate (disparador HTTP)</label><div class="copy-box"><input class="inp" type="password" autocomplete="off" data-c="pa_url" value="${v('pa_url')}" placeholder="Pegue aquí la URL HTTP POST del flujo"><button class="btn" type="button" id="verurl" title="Mostrar u ocultar">Ver</button></div><span class="help">Se guarda en la base de datos y solo los administradores la ven. Debe ser un flujo propio de esta app (no el de Pricing).</span></div>
      <div class="field span2"><label>Secreto compartido</label><div class="copy-box"><input class="inp" data-c="pa_secreto" value="${v('pa_secreto')}"><button class="btn" id="cpy" title="Copiar">${I.copy}</button><button class="btn" id="gen" title="Generar nuevo">${I.refresh}</button></div>
        <span class="help">Pegue este mismo valor en la condición del flujo. Si lo cambia aquí, cámbielo también en Power Automate.</span></div>
      <div class="field span2"><label>Modo prueba: desviar TODOS los correos a</label><input class="inp" data-c="modo_prueba_correo" value="${v('modo_prueba_correo')}" placeholder="vacío = modo normal"><span class="help">Para probar sin molestar a nadie: el asunto indica a quién iba dirigido.</span></div>
      <div class="row span2 wrap"><input class="inp" id="tp" placeholder="Correo para la prueba (vacío = el suyo)" style="max-width:320px"><button class="btn" id="test">${I.mail} Enviar correo de prueba</button><button class="btn" id="diag" title="4 envíos de distinto tamaño, con y sin adjunto">${I.refresh} Diagnóstico de envíos</button><a href="#/admin/correos" class="small">Ver bitácora de correos →</a></div>
    </div></div>
    <div class="card"><div class="card-h"><h2>Aplicación</h2></div><div class="card-b grid2">
      <div class="field"><label>Nombre de la app</label><input class="inp" data-c="nombre_app" value="${v('nombre_app')}"></div>
      <div class="field"><label>Empresa</label><input class="inp" data-c="nombre_empresa" value="${v('nombre_empresa')}"></div>
      <div class="field span2"><label>URL pública de la app (para los botones de los correos)</label><div class="copy-box"><input class="inp" data-c="app_url" value="${v('app_url')}" placeholder="https://..."><button class="btn" id="usar" title="Usar la dirección actual">Usar actual</button></div><span class="help">Dirección actual: ${esc(urlApp)}</span></div>
    </div></div>
    <div class="card"><div class="card-h"><h2>Seguridad de acceso</h2></div><div class="card-b grid3">
      <div class="field"><label>Dominios permitidos</label><input class="inp" id="dom" value="${esc(dom)}"><span class="help">Separados por coma, ej. <span class="kbd">legrand.com</span>. Obligatorio: debe incluir su propio dominio. Solo estos correos pueden entrar <b>y recibir correos</b> de la central.</span></div>
      <div class="field"><label>Vigencia del código (minutos)</label><input class="inp" type="number" min="5" max="1440" data-c="minutos_codigo" value="${v('minutos_codigo')}"></div>
      <div class="field"><label>Duración de la sesión (horas)</label><input class="inp" type="number" min="1" max="168" data-c="horas_sesion" value="${v('horas_sesion')}"></div>
    </div></div>
    <div class="card"><div class="card-h"><h2>Retención de información de RH</h2>${c.ultima_depuracion ? `<span class="xs muted">Última depuración: ${fmt(c.ultima_depuracion.fecha)} por ${esc(c.ultima_depuracion.por)} (${c.ultima_depuracion.solicitudes} solicitudes)</span>` : ''}</div>
      <div class="card-b stack">
        <p class="small" style="margin:0">Define cuántos años se conservan las solicitudes <b>terminadas</b> (aprobadas, rechazadas o canceladas). Nada se borra solo: un administrador revisa cuántas hay y confirma. Las solicitudes en aprobación nunca se borran. Cada depuración queda en la bitácora con los folios eliminados.</p>
        <div class="row wrap" style="gap:12px;align-items:flex-end">
          <div class="field" style="max-width:220px"><label>Años de retención</label><input class="inp" type="number" min="0" max="50" data-c="anios_retencion" value="${v('anios_retencion') || 0}"><span class="help">0 = conservar todo</span></div>
          <button class="btn" id="retcontar">${I.info} Revisar qué se borraría</button>
          <button class="btn dan" id="retdepurar" disabled>${I.trash} Depurar</button></div>
        <div id="retres" class="small"></div>
      </div></div>
    <div class="card" style="border-color:#F0C4C5"><div class="card-h"><h2>Emergencia: cerrar todas las sesiones</h2>${c.ultimo_cierre_sesiones ? `<span class="xs muted">Último cierre: ${fmt(c.ultimo_cierre_sesiones.fecha)} por ${esc(c.ultimo_cierre_sesiones.por)}</span>` : ''}</div>
      <div class="card-b stack">
        <p class="small" style="margin:0">Úselo si sospecha un acceso indebido (por ejemplo, un equipo perdido o un correo comprometido). <b>Saca a todas las personas de la central de inmediato</b> y anula los códigos de acceso pendientes; cada quien tendrá que ingresar de nuevo con un código nuevo.</p>
        <label class="chk" style="max-width:520px"><input type="checkbox" id="cerrarme"><span>Cerrar también <b>mi</b> sesión</span></label>
        <div><button class="btn dan" id="cerrartodo">${I.out} Cerrar todas las sesiones</button></div>
      </div></div>
    <div class="card"><div class="card-h"><h2>Datos de prueba</h2><span class="small" id="dpest">${dp.solicitudes ? `<span class="tag exc">${dp.solicitudes} solicitudes de prueba cargadas</span>` : '<span class="muted">No hay datos de prueba</span>'}</span></div>
      <div class="card-b stack">
        <p class="small" style="margin:0">Carga <b>23 solicitudes de ejemplo</b> para mostrar todas las vistas: <b>12 de Teletrabajo</b> (folios <span class="kbd">PRUEBA-01…12</span>) y <b>11 de Apoyo Educativo</b> (<span class="kbd">PRUEBA-AE-01…11</span>), en todos los estados: aprobadas, rechazadas, canceladas, en aprobación en distintos pasos, con excepción, fuera de período, modificada (versión 2), con información solicitada, con adjuntos, reembolsos, un beneficio finalizado por salida y recordatorios. <b>Todos los pasos de aprobación quedan asignados a usted</b> (las pendientes aparecen en <b>Por aprobar</b>) y algunas las envía usted mismo, para ver la vista del solicitante (responder información, modificar una rechazada, ver su beneficio). Usan personas ficticias <span class="kbd">prueba.…@legrand.com</span>, no gastan la numeración real y <b>no envían correos</b> al cargarse. Si Apoyo Educativo no tiene presupuesto para este año, se define uno de US$15 000 para que se vea la comparación.</p>
        <div class="alert a-info" style="margin:0">${I.info}<div class="small">Si desde las solicitudes de prueba pulsa <b>Recordar</b>, se intenta enviar un correo a esas direcciones ficticias. Para practicar aprobaciones sin molestar a nadie, active el <b>Modo prueba</b> (arriba): los códigos de <span class="kbd">prueba.…</span> le llegarán a usted.</div></div>
        <div class="row wrap"><button class="btn" id="dpcargar" ${dp.solicitudes ? 'disabled' : ''}>${I.plus} Cargar datos de prueba</button>
          <button class="btn dan" id="dpborrar" ${dp.solicitudes || dp.usuarios ? '' : 'disabled'}>${I.trash} Borrar datos de prueba</button></div>
        <p class="xs muted" style="margin:0">"Borrar" elimina solo lo marcado como prueba (solicitudes PRUEBA-xx y PRUEBA-AE-xx con sus aprobaciones, bitácora, tiempos, recordatorios, adjuntos y reembolsos, y las personas ficticias). No toca solicitudes ni usuarios reales.</p>
      </div></div></div>`);
  $('#cpy').onclick = () => { navigator.clipboard?.writeText($('[data-c=pa_secreto]').value); toast('Secreto copiado.', 'ok'); };
  $('#gen').onclick = () => { const a = new Uint8Array(18); crypto.getRandomValues(a); $('[data-c=pa_secreto]').value = [...a].map(x => x.toString(16).padStart(2, '0')).join(''); toast('Secreto nuevo generado: guarde y actualícelo en Power Automate.'); };
  $('#usar').onclick = () => $('[data-c=app_url]').value = urlApp;
  $('#verurl').onclick = () => { const i = $('[data-c=pa_url]'); i.type = i.type === 'password' ? 'text' : 'password'; $('#verurl').textContent = i.type === 'password' ? 'Ver' : 'Ocultar'; };
  const guardar = async () => {
    const cfg = {}; $$('[data-c]').forEach(i => cfg[i.dataset.c] = i.type === 'number' ? +i.value : i.value.trim());
    cfg.dominios_permitidos = $('#dom').value.split(/[,;\s]+/).map(x => x.trim().replace(/^@/, '').toLowerCase()).filter(Boolean);
    if (!cfg.dominios_permitidos.length) throw new Error('Dominios permitidos: la lista no puede quedar vacía.');
    await api('rh_admin_guardar_config', { p_cfg: cfg });
  };
  $('#gc').onclick = e => ocupado(e.currentTarget, async () => { try { await guardar(); toast('Configuración guardada.', 'ok'); adminConfig(); } catch (err) { toast(err.message, 'err'); } });
  let retAnios = 0;
  $('#retcontar').onclick = e => ocupado(e.currentTarget, async () => {
    const n = +$('[data-c=anios_retencion]').value || 0;
    if (n < 1) { $('#retres').innerHTML = '<span class="muted">Con 0 años se conserva todo. Indique 1 o más para revisar.</span>'; $('#retdepurar').disabled = true; return; }
    try { const r = await api('rh_admin_retencion', { p_accion: 'contar', p_anios: n }); retAnios = n;
      $('#retres').innerHTML = r.solicitudes ? `Se borrarían <b>${r.solicitudes}</b> solicitud(es) terminadas antes del <b>${fmt(r.antes_de)}</b>.` : `No hay solicitudes terminadas antes del ${fmt(r.antes_de)}.`;
      $('#retdepurar').disabled = !r.solicitudes; } catch (err) { toast(err.message, 'err'); } });
  $('#retdepurar').onclick = async e => {
    const btn = e.target.closest('button');
    if (!await confirmar('Depurar solicitudes', `Se eliminarán <b>definitivamente</b> las solicitudes terminadas hace más de <b>${retAnios} año(s)</b>, con sus firmas, aprobaciones y bitácora. No se puede deshacer. Si RH necesita respaldo, descargue antes el Excel en Reportes.`, 'Depurar', 'dan')) return;
    ocupado(btn, async () => { try { const r = await api('rh_admin_retencion', { p_accion: 'depurar', p_anios: retAnios }); toast(`Se depuraron ${r.solicitudes} solicitud(es).`, 'ok'); adminConfig(); } catch (err) { toast(err.message, 'err'); } });
  };
  $('#cerrartodo').onclick = async e => {
    const yo = $('#cerrarme').checked, btn = e.target.closest('button');
    if (!await confirmar('Cerrar todas las sesiones', `Se cerrará la sesión de <b>todas las personas</b>${yo ? ', <b>incluida la suya</b>' : ' (excepto la suya)'}, y se anularán los códigos de acceso pendientes. ¿Continuar?`, 'Cerrar sesiones', 'dan')) return;
    ocupado(btn, async () => {
      try { const r = await api('rh_admin_cerrar_sesiones', { p_incluirme: yo });
        toast(`Se cerraron ${r.sesiones} sesión(es) y se anularon ${r.codigos} código(s).`, 'ok');
        if (r.me_cerre) { finSesion(); setTimeout(() => { location.hash = ''; vistaLogin(); }, 1200); } else adminConfig(); }
      catch (err) { toast(err.message, 'err'); } });
  };
  $('#dpcargar').onclick = e => ocupado(e.currentTarget, async () => {
    try { const r = await api('rh_admin_datos_prueba', { p_accion: 'cargar' }); toast(`Se cargaron ${r.solicitudes} solicitudes de prueba (${r.teletrabajo} de Teletrabajo y ${r.apoyo_educativo || 0} de Apoyo Educativo). Las pendientes están en Por aprobar.`, 'ok'); await cargarBase(); adminConfig(); }
    catch (err) { toast(err.message, 'err'); } });
  $('#dpborrar').onclick = async e => {
    if (!await confirmar('Borrar datos de prueba', 'Se eliminarán las solicitudes <b>PRUEBA-xx</b> y <b>PRUEBA-AE-xx</b> (con sus aprobaciones, bitácora, tiempos, recordatorios, adjuntos y reembolsos) y las personas ficticias <b>prueba.…@legrand.com</b>. Las solicitudes y usuarios reales no se tocan.', 'Borrar', 'dan')) return;
    ocupado(e.target.closest('button'), async () => {
      try { const r = await api('rh_admin_datos_prueba', { p_accion: 'borrar' }); toast(`Datos de prueba borrados: ${r.solicitudes} solicitudes y ${r.usuarios} personas.`, 'ok'); adminConfig(); }
      catch (err) { toast(err.message, 'err'); } });
  };
  $('#diag').onclick = e => ocupado(e.currentTarget, async () => {
    try { await guardar(); const r = await api('rh_admin_diagnostico_correo', { p_para: $('#tp').value });
      toast(`Se enviaron 4 correos de diagnóstico a ${r.para.join(', ')}. Revise la bitácora en 1–2 minutos.`, 'ok'); setTimeout(() => { location.hash = '#/admin/correos'; }, 1500); }
    catch (err) { toast(err.message, 'err'); } });
  $('#test').onclick = e => ocupado(e.currentTarget, async () => {
    try { await guardar(); const r = await api('rh_admin_probar_correo', { p_para: $('#tp').value });
      toast(r.configurado ? 'Correo de prueba enviado a Power Automate. Revise la bitácora en unos segundos.' : 'Falta la URL de Power Automate.', r.configurado ? 'ok' : 'err'); }
    catch (err) { toast(err.message, 'err'); }
  });
}
async function adminCorreos() {
  cargando('correos');
  const rows = await api('rh_admin_correos');
  const st = r => r.estado !== 'enviado' ? `<span class="badge s-rechazada">${esc(r.estado)}</span>`
    : r.http ? (r.http >= 200 && r.http < 300 ? `<span class="badge s-aprobada">HTTP ${r.http}</span>` : `<span class="badge s-rechazada">HTTP ${r.http}</span>`)
    : r.error ? `<span class="badge s-rechazada" title="${esc(r.error)}">Error</span>` : '<span class="badge s-cancelada">Enviado</span>';
  shell('correos', `<div class="page-head"><div><h1>Bitácora de correos</h1><p>Últimos 150 envíos hacia Power Automate. <b>HTTP 202</b> = el flujo lo recibió · <b>HTTP 200</b> = el flujo confirmó el envío (si agregó las respuestas, paso 3.6b de la guía) · <b>Error / Timeout</b> = el flujo no respondió.</p></div><button class="btn" id="rf">${I.refresh} Actualizar</button></div>
    <div class="card">${!rows.length ? `<div class="empty">${I.mail}<div>Aún no se han enviado correos.</div></div>` : `<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Fecha</th><th>Tipo</th><th>Para</th><th>Asunto</th><th>Resultado</th></tr></thead><tbody>
    ${rows.map(r => `<tr><td class="small" style="white-space:nowrap">${fmt(r.creado_en)}</td><td><span class="tag">${esc(r.tipo)}</span></td><td class="small">${esc(r.para)}</td><td class="small">${esc(r.asunto.replace(/(código de acceso: )\d{6}/i, '$1••••••'))}</td><td>${st(r)}${r.error ? `<div class="xs muted" style="max-width:220px">${esc(r.error)}</div>` : ''}</td></tr>`).join('')}
    </tbody></table></div>`}</div>
    <p class="xs muted" style="margin-top:10px">Supabase conserva el resultado HTTP solo unas horas; después la columna muestra “Enviado”.</p>`);
  $('#rf').onclick = adminCorreos;
}

iniciar();
