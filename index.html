<style>
:root{
  --pri:#1F3A5F; --pri-600:#2A4A73; --pri-700:#162B47; --pri-50:#E9EEF5; --pri-100:#D2DCE8;
  --gris:#5B6B7B; --gris-50:#EEF1F4;
  --danger:#A63D40; --danger-50:#F7E9E9;
  --warn:#8A6A1E; --warn-50:#F6F1E4;
  --ok:#2E6B4E; --ok-50:#E6F0EA; --ok-100:#CFE2D6; --acero:#3E6A9A;
  --bg:#F3F5F8; --surface:#FFFFFF; --surface-2:#F8F9FB; --line:#E2E6EB; --line-2:#CDD4DC;
  --ink:#1A2230; --ink-2:#4A5568; --ink-3:#7A8594;
  --shadow:0 1px 2px rgba(20,30,45,.06),0 4px 16px rgba(20,30,45,.06);
  --shadow-lg:0 12px 48px rgba(10,20,35,.22);
  --r:16px; --r-sm:10px;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--pri)}
.hidden{display:none!important}
.muted{color:var(--ink-3)} .small{font-size:13px} .xs{font-size:12px} .b{font-weight:700}
.row{display:flex;align-items:center;gap:10px} .wrap{flex-wrap:wrap} .grow{flex:1;min-width:0} .between{justify-content:space-between}
.stack>*+*{margin-top:12px}
h1,h2,h3{margin:0;line-height:1.25} h1{font-size:24px;font-weight:800;letter-spacing:-.01em} h2{font-size:18px;font-weight:700} h3{font-size:15px;font-weight:700}

/* Botones */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid transparent;border-radius:10px;padding:10px 16px;font-weight:600;font-size:14px;background:var(--surface);color:var(--ink);border-color:var(--line-2);transition:background .15s,border-color .15s,transform .05s;white-space:nowrap;text-decoration:none}
.btn:hover{background:var(--surface-2)} .btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.55;cursor:not-allowed}
.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff} .btn.pri:hover{background:var(--pri-600)}
.btn.dan{background:var(--danger);border-color:var(--danger);color:#fff} .btn.dan:hover{filter:brightness(1.07)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--ink-2)} .btn.ghost:hover{background:var(--gris-50)}
.btn.sm{padding:6px 11px;font-size:13px;border-radius:8px}
.btn.icon{padding:7px;border-radius:8px}
.btn svg{width:17px;height:17px;flex:none}
.spin{width:16px;height:16px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .7s linear infinite;display:inline-block}
@keyframes sp{to{transform:rotate(360deg)}}

/* Campos */
.field{display:flex;flex-direction:column;gap:6px}
.field>label,.lbl{font-weight:600;font-size:13.5px;color:var(--ink)}
.req::after{content:" *";color:var(--danger)}
.help{font-size:12.5px;color:var(--ink-3)}
.inp,select.inp,textarea.inp{width:100%;border:1px solid var(--line-2);border-radius:10px;padding:10px 12px;background:#fff;outline:none;transition:border-color .15s,box-shadow .15s}
textarea.inp{min-height:84px;resize:vertical}
.inp:focus{border-color:var(--pri);box-shadow:0 0 0 3px rgba(31,58,95,.16)}
.inp:disabled,.inp[readonly]{background:var(--surface-2);color:var(--ink-2)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.span2{grid-column:1/-1}
@media (max-width:720px){.grid2,.grid3{grid-template-columns:minmax(0,1fr)}.grid2>*,.grid3>*{min-width:0}}
.chk{display:flex;gap:10px;align-items:flex-start;cursor:pointer;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:#fff}
.chk input{width:18px;height:18px;margin:2px 0 0;accent-color:var(--pri);flex:none}
.chk:has(input:checked){border-color:var(--pri);background:var(--pri-50)}
.chk-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}
.days{display:flex;flex-wrap:wrap;gap:8px}
.day{border:1.5px solid var(--line-2);background:#fff;border-radius:999px;padding:8px 16px;font-weight:600;font-size:14px;color:var(--ink-2);user-select:none}
.day.on{background:var(--pri);border-color:var(--pri);color:#fff}
.exc{border:1px solid #E6D9B8;background:var(--warn-50);border-radius:12px;padding:14px}

/* Layout */
.topbar{position:sticky;top:0;z-index:30;background:var(--pri);color:#fff;height:58px;display:flex;align-items:center;padding:0 18px;gap:14px;box-shadow:0 1px 0 rgba(0,0,0,.08)}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:-.01em}
.brand-mark{width:30px;height:30px;border-radius:8px;background:#fff;color:var(--pri);display:grid;place-items:center;font-weight:800;font-size:13px}
.brand small{display:block;font-weight:500;font-size:11.5px;opacity:.8;letter-spacing:.03em;text-transform:uppercase}
.user-chip{display:flex;align-items:center;gap:10px;color:#fff;background:rgba(255,255,255,.12);border:0;border-radius:999px;padding:4px 12px 4px 4px}
.avatar{width:30px;height:30px;border-radius:50%;background:#fff;color:var(--pri);display:grid;place-items:center;font-weight:800;font-size:12px}
.layout{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:calc(100vh - 58px)}
.side{border-right:1px solid var(--line);background:var(--surface);padding:16px 10px;position:sticky;top:58px;height:calc(100vh - 58px);overflow:auto}
.nav a{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:10px;color:var(--ink-2);text-decoration:none;font-weight:600;font-size:14px;margin-bottom:2px}
.nav a:hover{background:var(--surface-2);color:var(--ink)}
.nav a.on{background:var(--pri-50);color:var(--pri)}
.nav a svg{width:19px;height:19px;flex:none}
.nav .sep{height:1px;background:var(--line);margin:10px 8px}
.nav .cap{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3);padding:8px 12px 4px;font-weight:700}
.pill{margin-left:auto;background:var(--danger);color:#fff;border-radius:999px;font-size:11.5px;padding:1px 8px;font-weight:700}
.main{padding:26px clamp(16px,3vw,36px) 60px;max-width:1180px;width:100%}
@media (max-width:900px){
  .layout{grid-template-columns:minmax(0,1fr)}
  .side{position:sticky;top:58px;z-index:20;height:auto;padding:8px 10px;border-right:0;border-bottom:1px solid var(--line);overflow-x:auto}
  .nav{display:flex;gap:4px;white-space:nowrap}
  .nav a{margin:0;padding:8px 12px}
  .nav .sep,.nav .cap{display:none}
  .user-chip span{display:none}
  .main{padding:18px 16px 60px}
}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:20px}
.page-head p{margin:4px 0 0;color:var(--ink-2)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.card-b{padding:20px}
.card-h{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.sec-title{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);font-weight:700;margin:0 0 10px}

/* Tiles */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-bottom:22px}
.tile{border-radius:var(--r);padding:16px 18px;color:#fff;text-decoration:none;display:block;box-shadow:var(--shadow);transition:transform .12s}
.tile:hover{transform:translateY(-2px)}
.tile .n{font-size:30px;font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums}
.tile .t{font-size:13px;opacity:.9;font-weight:600}
.t-pri{background:var(--pri)} .t-gris{background:var(--gris)} .t-danger{background:var(--danger)} .t-acero{background:var(--acero)}
.mods{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.mod{display:flex;flex-direction:column;gap:12px;padding:20px;text-decoration:none;color:inherit}
.mod-ic{width:44px;height:44px;border-radius:12px;background:var(--pri-50);color:var(--pri);display:grid;place-items:center}
.mod-ic svg{width:24px;height:24px}
.mod.soon{opacity:.6;border-style:dashed;box-shadow:none}
.alert{border-radius:12px;padding:12px 14px;display:flex;gap:10px;align-items:flex-start;font-size:14px;margin-bottom:16px}
.alert svg{width:18px;height:18px;flex:none;margin-top:2px}
.a-warn{background:var(--warn-50);color:#6E5418;border:1px solid #E6D9B8}
.a-info{background:var(--gris-50);color:#2F3B4A;border:1px solid #D5DDE6}
.a-ok{background:var(--ok-50);color:#24533D;border:1px solid var(--ok-100)}
.a-err{background:var(--danger-50);color:#7A2A2D;border:1px solid #E8C9CA}

/* Tablas */
.tbl-wrap{overflow-x:auto}
table.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:left;font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-3);font-weight:700;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--surface-2);white-space:nowrap}
.tbl td{padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tr.click{cursor:pointer} .tbl tr.click:hover td{background:var(--surface-2)}
.badge{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:700;white-space:nowrap}
.badge::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.s-en_aprobacion,.s-pendiente{background:var(--warn-50);color:#6E5418}
.s-aprobada,.s-aprobado{background:var(--ok-50);color:var(--ok)}
.s-rechazada,.s-rechazado{background:var(--danger-50);color:var(--danger)}
.s-cancelada,.s-omitido,.s-en_espera{background:var(--gris-50);color:var(--gris)}
.s-info_solicitada,.s-info{background:#E8EEF7;color:var(--acero)}
.mini-steps i.info{background:var(--acero)} .tl .dot.info{background:var(--acero);color:#fff}
.files{border:1px dashed var(--line-2);border-radius:12px;padding:10px 12px;background:var(--surface-2)}
.files .fl{display:flex;flex-direction:column;gap:6px;margin-bottom:8px} .files .fl:empty{display:none}
.file-it{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:7px 10px;font-size:13px}
.file-it .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600} .file-it .sz{color:var(--ink-3);font-size:12px}
.opt-nota{margin-top:8px;border-left:4px solid var(--acero);background:#EEF3F9;border-radius:8px;padding:9px 12px;font-size:13px;color:var(--ink)}
.opt-nota.warn{border-color:var(--warn);background:var(--warn-50)} .opt-nota.err{border-color:var(--danger);background:#FDECEC;color:var(--danger);font-weight:600}
.alerta-amb svg{width:20px;height:20px;flex:none;margin-top:1px}
.alerta-amb{display:flex;gap:12px;border:1px solid #E6D9B8;background:var(--warn-50);border-radius:12px;padding:12px 14px;margin-bottom:16px;color:#5E4813}
.qa{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px} .qa .q{font-weight:600} .qa .a{margin-top:8px;padding-top:8px;border-top:1px dashed var(--line)}

/* =====================================================================
   API (todas las llamadas pasan por funciones RPC seguras)
   ===================================================================== */
async function rpc(fn, args = {}) {
  let r;
  try {
    r = await fetch(`${CONFIG.SUPABASE_URL.replace(/\/+$/, '')}/rest/v1/rpc/${fn}`, {
      method: 'POST',
      headers: { apikey: CONFIG.SUPABASE_KEY, 'Content-Type': 'application/json' },
      body: JSON.stringify(args)
    });
  } catch (e) { throw new Error('No hay conexión con el servidor. Revise su internet.'); }
  const txt = await r.text();
  let data; try { data = txt ? JSON.parse(txt) : null; } catch { data = txt; }
  if (!r.ok) {
    const msg = (data && (data.message || data.hint)) || txt || ('Error ' + r.status);
    if (String(msg).includes('SESION_EXPIRADA')) { finSesion(); throw new Error('Su sesión expiró. Ingrese de nuevo.'); }
    if (String(msg).includes('MODO_EMERGENCIA')) { S.emergencia = true; setTimeout(vistaEmergencia, 0); throw new Error('Modo emergencia: solo puede revisar el estado de los correos.'); }
    if (r.status === 404 && /function|could not find/i.test(msg)) throw new Error('Falta instalar el esquema en Supabase (función ' + fn + ').');
    throw new Error(msg);
  }
  return data;
}
const api = (fn, args = {}) => rpc(fn, { p_token: S.token, ...args });

/* =====================================================================
   UI: toast, modal, botón ocupado
   ===================================================================== */
function toast(msg, tipo = '') {
  const t = document.createElement('div');
  t.className = 'toast ' + tipo; t.innerHTML = esc(msg);
  $('#toasts').appendChild(t);
  setTimeout(() => t.remove(), tipo === 'err' ? 7000 : 4200);
}
function modal({ title, body, actions = [], size = '', onOpen }) {
  const bg = document.createElement('div');
  bg.className = 'modal-bg';
  bg.innerHTML = `<div class="modal ${size}" role="dialog" aria-modal="true">
    <div class="modal-h"><h2>${esc(title)}</h2><button class="btn icon ghost" data-x aria-label="Cerrar">${I.x}</button></div>
    <div class="modal-b">${body}</div>
    ${actions.length ? `<div class="modal-f">${actions.map((a, i) => `<button class="btn ${a.cls || ''}" data-a="${i}">${a.label}</button>`).join('')}</div>` : ''}
  </div>`;
  const close = () => bg.remove();
  bg.addEventListener('mousedown', e => { if (e.target === bg) close(); });
  $('[data-x]', bg).onclick = close;
  actions.forEach((a, i) => { $(`[data-a="${i}"]`, bg).onclick = () => a.onClick ? a.onClick({ close, el: bg, btn: $(`[data-a="${i}"]`, bg) }) : close(); });
  $('#modal-root').appendChild(bg);
  onOpen && onOpen(bg, close);
  return { close, el: bg };
}
function confirmar(title, texto, label = 'Confirmar', cls = 'pri') {
  return new Promise(res => modal({ title, body: `<p style="margin:0">${texto}</p>`,
    actions: [{ label: 'Cancelar', onClick: ({ close }) => { close(); res(false); } },
              { label, cls, onClick: ({ close }) => { close(); res(true); } }] }));
}
async function ocupado(btn, fn) {
  if (!btn) return fn();
  const html = btn.innerHTML; btn.disabled = true; btn.innerHTML = '<span class="spin"></span>' + (btn.textContent.trim() ? ' Procesando…' : '');
  try { return await fn(); } finally { if (btn.isConnected) { btn.disabled = false; btn.innerHTML = html; } }
}

/* =====================================================================
   FIRMA (dibujo)
   ===================================================================== */
class Firma {
  constructor(host) {
    host.innerHTML = `<div class="sigpad"><canvas></canvas><div class="line"></div><div class="ph">${I.pen.replace('<svg', '<svg style="width:18px;height:18px;margin-right:6px;vertical-align:-3px"')}Firme aquí con el mouse o el dedo</div></div>
      <div class="sig-tools"><span class="xs muted">Su firma quedará en el documento final.</span><span class="row" style="gap:4px"><button type="button" class="btn sm ghost" data-grande>${I.pen.replace('<svg', '<svg style="width:15px;height:15px"')} Firmar en grande</button><button type="button" class="btn sm ghost" data-clear>Borrar firma</button></span></div>`;
    this.wrap = $('.sigpad', host); this.c = $('canvas', host); this.ctx = this.c.getContext('2d');
    this.trazos = 0; this.dibujando = false;
    this.ajustar(); this._ro = new ResizeObserver(() => this.ajustar()); this._ro.observe(this.c);
    const pos = e => { const r = this.c.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
    this.c.addEventListener('pointerdown', e => { e.preventDefault(); this.c.setPointerCapture(e.pointerId); this.dibujando = true; this.last = pos(e); this.ctx.beginPath(); this.ctx.arc(this.last[0], this.last[1], 1.1, 0, Math.PI * 2); this.ctx.fill(); });
    this.c.addEventListener('pointermove', e => { if (!this.dibujando) return; const p = pos(e); this.ctx.beginPath(); this.ctx.moveTo(...this.last); this.ctx.lineTo(...p); this.ctx.stroke(); this.last = p; this.trazos++; this.wrap.classList.add('has'); });
    const fin = () => { this.dibujando = false; };
    this.c.addEventListener('pointerup', fin); this.c.addEventListener('pointercancel', fin);
    $('[data-clear]', host).onclick = () => this.limpiar();
    if (host.id === 'sigfull') $('[data-grande]', host).remove(); else $('[data-grande]', host).onclick = () => this.ampliar();
  }
  ajustar() {
    const r = this.c.getBoundingClientRect(); if (!r.width) return;
    const dpr = window.devicePixelRatio || 1;
    if (this.c.width === Math.round(r.width * dpr)) return;
    const prev = this.trazos ? this.c.toDataURL() : null;
    this.c.width = Math.round(r.width * dpr); this.c.height = Math.round(r.height * dpr);
    this.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    Object.assign(this.ctx, { lineWidth: 2.4, lineCap: 'round', lineJoin: 'round', strokeStyle: '#1B2A55', fillStyle: '#1B2A55' });
    if (prev) { const img = new Image(); img.onload = () => this.ctx.drawImage(img, 0, 0, r.width, r.height); img.src = prev; }
  }
  limpiar() { this.ctx.clearRect(0, 0, this.c.width, this.c.height); this.trazos = 0; this.wrap.classList.remove('has'); }
  cargar(url) { // v1.11: firma hecha en pantalla completa
    const img = new Image(); img.onload = () => { const r = this.c.getBoundingClientRect(); this.limpiar();
      const k = Math.min(r.width / img.width, r.height / img.height), w = img.width * k, h = img.height * k;
      const tmp = document.createElement('canvas'); tmp.width = img.width; tmp.height = img.height; const tx = tmp.getContext('2d'); tx.drawImage(img, 0, 0);

    let x0 = this.c.width, y0 = this.c.height, x1 = 0, y1 = 0;
    for (let yy = 0; yy < this.c.height; yy += 2) for (let xx = 0; xx < this.c.width; xx += 2) {

    }

    const sw = x1 - x0, sh = y1 - y0, k = Math.min(W / sw, H / sh, 1.6), dw = sw * k, dh = sh * k;

    return o.toDataURL('image/png');

}

async function vistaLogin(paso = 'correo', ctx = {}) {

  if (paso === 'correo') form = `
    <h1>Ingresar</h1><p class="muted" style="margin:6px 0 24px">Escriba su correo corporativo.</p>
    <form id="f" class="stack">
      <div class="field"><label for="em">Correo</label><input class="inp" id="em" type="email" autocomplete="email" placeholder="nombre${esc(dom.split(',')[0] || '@empresa.com')}" value="${esc(ctx.email || store.get('email') || '')}" required></div>
      <button class="btn pri" style="width:100%;padding:12px">Continuar</button>
      ${dom ? `<p class="xs muted" style="text-align:center">Solo correos ${esc(dom)}</p>` : ''}

  if (paso === 'pin') form = `
    <h1>Hola${ctx.nombre ? ', ' + esc(ctx.nombre.split(' ')[0]) : ''}</h1><p class="muted" style="margin:6px 0 14px">Ingreso con PIN de emergencia (solo administradores).</p>

      <button class="btn pri" style="width:100%;padding:12px">Verificar</button>

      <div class="row between"><button type="button" class="btn ghost sm" data-back>Usar otro correo</button><button type="button" class="btn ghost sm" data-resend>Reenviar código</button></div>
      <p class="xs muted">¿No llega? Revise la carpeta de correo no deseado.</p>
    </form>`;

    <form id="f" class="stack">${camposPerfil(ctx.datos || {})}

    <form id="f" class="stack">

      <p class="xs muted">¿No llega? Revise la carpeta de correo no deseado.</p>
    </form>`;
  if (paso === 'pendiente' || paso === 'enviada') form = `
    <div class="alert a-info">${I.info}<div><b>${paso === 'enviada' ? 'Solicitud enviada.' : 'Su solicitud de acceso está en revisión.'}</b><br>Un administrador la revisará y recibirá un correo cuando su usuario esté listo.</div></div>
    <button class="btn" data-back style="width:100%">Volver</button>`;
  if (paso === 'inactivo') form = `
    <div class="alert a-err">${I.warn}<div><b>Usuario inactivo.</b><br>Contacte a un administrador de la central para reactivarlo.</div></div>

  $('#app').innerHTML = `<div class="login">

    });

  if (paso === 'codigo' || paso === 'registro_codigo') {
    const ins = $$('.otp input'); ins[0].focus();
    ins.forEach((inp, i) => {
      inp.addEventListener('input', () => { const d = inp.value.replace(/\D/g, '');
        if (d.length > 1) { d.slice(0, 6).split('').forEach((c, j) => ins[i + j] && (ins[i + j].value = c)); (ins[Math.min(5, i + d.length)] || ins[5]).focus(); }  // código autocompletado
        else { inp.value = d; if (d && ins[i + 1]) ins[i + 1].focus(); }
        if (ins.every(x => x.value)) f.requestSubmit(); });
      inp.addEventListener('keydown', e => { if (e.key === 'Backspace' && !inp.value && ins[i - 1]) ins[i - 1].focus(); });
      inp.addEventListener('paste', e => { const t = (e.clipboardData.getData('text') || '').replace(/\D/g, '').slice(0, 6); if (t.length) { e.preventDefault(); t.split('').forEach((c, j) => ins[j] && (ins[j].value = c)); (ins[t.length] || ins[5]).focus(); if (t.length === 6) f.requestSubmit(); } });
    });
    f.onsubmit = e => { e.preventDefault(); ocupado($('button.pri', f), async () => {
      try { const r = await rpc(paso === 'codigo' ? 'rh_login_codigo' : 'rh_registro_confirmar', { p_email: ctx.email, p_codigo: ins.map(x => x.value).join('') });

      return;

    $('[data-resend]').onclick = e => ocupado(e.currentTarget, async () => {
      try { const r = await rpc('rh_login_inicio', { p_email: ctx.email }); if (!r.ok) return msg(r.error);
        if (r.modo === 'pin') return vistaLogin('pin', { ...ctx, aviso: r.aviso });
        msg(''); toast('Le enviamos un código nuevo.', 'ok'); }
      catch (err) { msg(err.message); }
    });
    const bp = $('[data-pin]'); if (bp) bp.onclick = () => vistaLogin('pin', { ...ctx, aviso: null });
  }
  if (paso === 'no_registrado') {
    $('[data-pf="nombre"]').focus();
    f.onsubmit = e => { e.preventDefault(); ocupado($('button.pri', f), async () => {
      const datos = leerPerfil(f), falta = faltaPerfil(datos); if (falta) return msg(falta);
      try { const r = await rpc('rh_registro_inicio', { p_email: ctx.email, p_datos: datos });
        vistaLogin('registro_codigo', { ...ctx, datos, minutos: r.minutos }); }
      catch (err) { msg(err.message); }
    }); };
  }
}

const antiguedadCorta = (f, datos) => { const det = (f.detalle_opciones || {})[datos[f.key]]; if (!det || det.antiguedad_meses == null) return null;
  const ant = antiguedadMeses(datos[f.antiguedad_campo || 'fecha_ingreso']); return ant != null && ant < det.antiguedad_meses ? { tiene: ant, pide: det.antiguedad_meses } : null; };

  let n = (Y - y) * 12 + (M - m); if (D < d) n--; return Math.max(0, n); };

async function prepararArchivo(file) {

    const img = await new Promise((ok, mal) => { const im = new Image(); im.onload = () => ok(im); im.onerror = () => mal(new Error(`No se pudo leer la imagen "${file.name}".`)); im.src = URL.createObjectURL(file); });

      ${opts.solicitante ? `<td>${esc(s.solicitante_nombre)}${s.solicitante_activo === false ? ' <span class="tag">Inactivo</span>' : ''}<div class="xs muted">${esc(s.departamento || '')}</div></td>` : `<td>${esc(s.modulo_nombre)}</td>`}

function valorTexto(f, datos) {
  const v = datos[f.key];
  if (f.tipo === 'dias') return (v || []).map(d => DIAS[d] || d).join(', ') || '—';
  if (f.tipo === 'casillas') return (v || []).join(', ') || '—';
  if (f.tipo === 'si_no') return v ? 'Sí' : 'No';
  if (f.tipo === 'fecha') return fmtISO(v);
  if (f.tipo === 'archivo') return (v || []).map(x => x.nombre).join(', ') || '—';
  if (f.tipo === 'periodo') return (v || '—') + (datos[f.key + '_rango'] ? ` (${datos[f.key + '_rango']})` : '');
  return (v == null || v === '') ? '—' : String(v);
}
function filasDatos(s) {
  const out = [];
  (s.formulario || []).forEach(f => {
    out.push([f.label, valorTexto(f, s.datos)]);
    if (f.tipo === 'dias' && s.datos[f.key + '_excepcion_motivo']) {
      if (s.datos[f.key + '_excepcion_causa']) out.push(['Causa de la excepción', s.datos[f.key + '_excepcion_causa']]);
      out.push(['Motivo de la excepción', s.datos[f.key + '_excepcion_motivo']]);
      out.push(['Detalle de la excepción', s.datos[f.key + '_excepcion_detalle'] || '—']);
    }
    if (['lista', 'opcion', 'periodo'].includes(f.tipo) && s.datos[f.key + '_excepcion_detalle']) out.push(['Justificación de la excepción', s.datos[f.key + '_excepcion_detalle']]);
  });
  return out;
}

const ETIQ_CONTRATO = { empresa_nombre: 'razón social', empresa_corto: 'nombre corto de la empresa', empresa_cedula: 'cédula jurídica', empresa_domicilio: 'domicilio de la empresa',

  direccion_teletrabajo: 'dirección de teletrabajo', puesto: 'puesto', departamento: 'departamento', fecha_ingreso: 'fecha de ingreso', estado_civil: 'estado civil',
  profesion: 'profesión (puesto)', tipo_apoyo: 'tipo de apoyo', programa: 'programa', institucion: 'institución', estudios: 'estudios y tipo de apoyo', tope: 'tope anual',
  porcentaje: 'porcentaje', fecha_aprobacion: 'fecha de aprobación', dias: 'días', dias_n: 'cantidad de días', fecha_contrato: 'fecha del contrato', folio: 'folio' };
async function cargarJSZip() {
  if (window.JSZip) return window.JSZip;
  await cargarScript(LIBS.jszip, 'No se pudo cargar el generador de Word. Revise su conexión.');
  return window.JSZip;
}
const xmlEsc = t => String(t ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
// Resaltado amarillo respetando el orden de las propiedades de un "run" de Word
function rprResaltado(rpr) {
  rpr = (rpr || '<w:rPr></w:rPr>').replace(/<w:highlight [^>]*\/>/g, '');
  const m = rpr.match(/<w:(u|effect|bdr|shd|fitText|vertAlign|rtl|cs|em|lang|eastAsianLayout|specVanish|oMath)[ />]/);
  const tag = '<w:highlight w:val="yellow"/>';
  return m ? rpr.replace(m[0], tag + m[0]) : rpr.replace('</w:rPr>', tag + '</w:rPr>');
}
function llenarXml(xml, V, faltan) {
  // 1) Word a veces parte un marcador {{campo}} en varios fragmentos: se unen
  xml = xml.replace(/\{(?:<[^>]+>)*\{(?:[^{}<]|<[^>]+>)*?\}(?:<[^>]+>)*\}/g, m => m.replace(/<[^>]+>/g, ''));
  // 2) cada fragmento con marcadores se reescribe: valor en negro, o "[completar: …]" resaltado si falta el dato
  xml = xml.replace(/<w:r(?: [^>]*)?>(<w:rPr>(?:(?!<\/w:rPr>)[\s\S])*<\/w:rPr>)?<w:t(?: [^>]*)?>([^<]*\{\{\w+\}\}[^<]*)<\/w:t><\/w:r>/g, (m, rpr, txt) => {
    const base = (rpr || '').replace(/<w:color w:val="FF0000"[^>]*\/>/g, '');
    return txt.split(/(\{\{\w+\}\})/).filter(x => x !== '').map(parte => {
      const k = (parte.match(/^\{\{(\w+)\}\}$/) || [])[1];
      if (!k) return `<w:r>${base}<w:t xml:space="preserve">${parte}</w:t></w:r>`;
      const v = V[k];
      if (v != null && String(v).trim() !== '') return `<w:r>${base}<w:t xml:space="preserve">${xmlEsc(v)}</w:t></w:r>`;
      faltan.add(ETIQ_CONTRATO[k] || k);
      return `<w:r>${rprResaltado(base)}<w:t xml:space="preserve">[completar: ${xmlEsc(ETIQ_CONTRATO[k] || k)}]</w:t></w:r>`;
    }).join('');
  });
  // 3) marcadores en lugares poco comunes (tablas, campos): texto simple
  return xml.replace(/\{\{(\w+)\}\}/g, (m, k) => { const v = V[k]; if (v == null || String(v).trim() === '') { faltan.add(ETIQ_CONTRATO[k] || k); return '[completar: ' + xmlEsc(ETIQ_CONTRATO[k] || k) + ']'; } return xmlEsc(v); });
}

async function generarContrato(id, empresa, persona) {
  const [Z, D] = await Promise.all([cargarJSZip(), api('rh_contrato_datos', { p_id: id, p_empresa: empresa || null, p_persona: persona || null })]);
  const P = await api('rh_contrato_plantilla', { p_modulo: D.modulo });
  const zip = await Z.loadAsync(P.contenido, { base64: true }), faltan = new Set();
  for (const nombre of Object.keys(zip.files).filter(n => /^word\/(document|header\d*|footer\d*)\.xml$/.test(n))) {
    zip.file(nombre, llenarXml(await zip.file(nombre).async('string'), D.valores || {}, faltan));
  }
  const blob = await zip.generateAsync({ type: 'blob', mimeType: 'application/vnd.openxmlformats-officedocument.wordprocessingml.document', compression: 'DEFLATE' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob);

  setTimeout(() => URL.revokeObjectURL(a.href), 60000);
  toast(faltan.size ? `Contrato generado. Complete en Word lo resaltado en amarillo: ${[...faltan].join(', ')}.` : 'Contrato generado.', faltan.size ? '' : 'ok');
}

/* =====================================================================
   PDF (se genera en el navegador; no se almacena)
   ===================================================================== */
const latin = s => String(s ?? '').normalize('NFC').replace(/[‘’]/g, "'").replace(/[“”]/g, '"').replace(/[–—]/g, '-').replace(/…/g, '...').replace(/[^\x09\x0A\x0D\x20-\x7E\xA0-\xFF]/g, '');
async function construirPDF(D) {
  if (!window.jspdf) throw new Error('No se pudo cargar el generador de PDF. Revise su conexión.');
  const s = D.solicitud, ap = (D.aprobaciones || []).filter(a => a.estado !== 'omitido');
  const doc = new window.jspdf.jsPDF({ unit: 'mm', format: 'a4' });
  const W = 210, M = 16, CW = W - 2 * M, AZUL = '#1F3A5F', TINTA = '#1A2230', GRIS = '#4A5568', LINEA = '#E2E6EB';
  let y = 0;
  const nueva = () => { doc.addPage(); y = 20; };
  const espacio = h => { if (y + h > 280) nueva(); };
  const T = (txt, x, yy, o = {}) => doc.text(Array.isArray(txt) ? txt.map(latin) : latin(txt), x, yy, o);
  const split = (txt, w) => doc.splitTextToSize(latin(txt), w);

  // Encabezado
  doc.setFillColor(AZUL); doc.rect(0, 0, W, 30, 'F');
  doc.setTextColor('#FFFFFF'); doc.setFont('helvetica', 'bold'); doc.setFontSize(16); T(S.empresa || 'Recursos Humanos', M, 13);
  doc.setFont('helvetica', 'normal'); doc.setFontSize(9); T(S.app + ' · Recursos Humanos', M, 19.5);
  doc.setFont('helvetica', 'bold'); doc.setFontSize(12); T(s.folio, W - M, 13, { align: 'right' });
  doc.setFont('helvetica', 'normal'); doc.setFontSize(8.5); T('Documento final', W - M, 19.5, { align: 'right' });
  y = 42;
  doc.setTextColor(TINTA); doc.setFont('helvetica', 'bold'); doc.setFontSize(17); T(D.modulo_nombre, M, y);
  doc.setFillColor('#E6F0EA'); doc.roundedRect(W - M - 36, y - 6, 36, 8.5, 2, 2, 'F');
  doc.setTextColor('#2E6B4E'); doc.setFontSize(9.5); T('APROBADA', W - M - 18, y - 0.4, { align: 'center' });
  if (s.excepcion) {
    const kd = ((s.formulario || []).find(f => f.tipo === 'dias') || {}).key || 'dias';
    const causa = s.datos._exc_causa || s.datos[kd + '_excepcion_causa'];
    y += 5; doc.setFillColor('#FDECEC'); doc.setDrawColor('#A63D40'); doc.setLineWidth(0.5); doc.roundedRect(M, y, CW, 9, 2, 2, 'FD');
    doc.setTextColor('#A63D40'); doc.setFont('helvetica', 'bold'); doc.setFontSize(9.5);
    T(split('EXCEPCION A LA POLITICA APROBADA' + (causa ? ' - ' + causa : ''), CW - 8)[0], M + 4, y + 6);
    y += 9;
  }
  y += 6; doc.setFont('helvetica', 'normal'); doc.setFontSize(9); doc.setTextColor(GRIS);
  T(`Enviada: ${fmt(s.creado_en)}    Aprobación final: ${fmt(s.finalizado_en)}${s.version > 1 ? '    Versión ' + s.version : ''}`, M, y); y += 7;
  if (s.textos?.intro) { doc.setFont('helvetica', 'italic'); doc.setFontSize(8.5); doc.setTextColor(GRIS); const l = split(s.textos.intro, CW); T(l, M, y); y += l.length * 3.8 + 4; }

  // Datos
  const seccion = (t, min = 14) => { espacio(min); doc.setFont('helvetica', 'bold'); doc.setFontSize(10); doc.setTextColor(AZUL); T(t.toUpperCase(), M, y); y += 2; doc.setDrawColor(AZUL); doc.setLineWidth(0.5); doc.line(M, y, W - M, y); y += 6; };
  seccion('Información de la solicitud');
  const LW = 62;
  filasDatos(s).concat([['Correo del solicitante', s.solicitante_email]]).forEach(([k, v]) => {
    doc.setFontSize(9.5); doc.setFont('helvetica', 'normal');
    const lk = split(k, LW - 4); doc.setFont('helvetica', 'bold'); const lv = split(v, CW - LW);
    const h = Math.max(lk.length, lv.length) * 4.4 + 3;
    espacio(h);
    doc.setFont('helvetica', 'normal'); doc.setTextColor(GRIS); T(lk, M, y);
    doc.setFont('helvetica', 'bold'); doc.setTextColor(TINTA); T(lv, M + LW, y);
    y += h - 1; doc.setDrawColor(LINEA); doc.setLineWidth(0.2); doc.line(M, y - 2.2, W - M, y - 2.2); y += 1.5;
  });
  if (s.textos?.declaracion) {
    y += 2; doc.setFont('helvetica', 'normal'); doc.setFontSize(9); doc.setTextColor(TINTA);
    const l = split('[X]  ' + s.textos.declaracion, CW); espacio(l.length * 4 + 4); T(l, M, y); y += l.length * 4 + 4;
  }
  if (s.politica_id) {
    doc.setFont('helvetica', 'bold'); doc.setFontSize(9); doc.setTextColor(AZUL); espacio(6);
    T(`Política aceptada: ${s.politica_titulo}${s.politica_version ? ' (versión ' + s.politica_version + ')' : ''} - ${fmt(s.politica_aceptada_en)}`, M, y); y += 6;
  }

  // Firma del solicitante
  const bloqueFirma = (img, titulo, nombre, detalle, extra) => {
    const lx = extra ? split(extra, CW - 70) : [];
    const h = Math.max(30, 16 + lx.length * 3.8);
    espacio(h + 4);
    doc.setDrawColor(LINEA); doc.setLineWidth(0.3); doc.roundedRect(M, y, CW, h, 2, 2);
    if (img) { try { doc.addImage(img, 'PNG', M + 3, y + 2, 60, 20, undefined, 'FAST'); } catch {} }
    doc.setDrawColor('#9AA4B1'); doc.line(M + 4, y + 23, M + 62, y + 23);
    doc.setFontSize(7.5); doc.setTextColor(GRIS); doc.setFont('helvetica', 'normal'); T('Firma', M + 4, y + 26.5);
    const x2 = M + 70;
    doc.setFont('helvetica', 'bold'); doc.setFontSize(9.5); doc.setTextColor(AZUL); T(titulo, x2, y + 6);
    doc.setTextColor(TINTA); doc.setFontSize(10); T(nombre, x2, y + 11.5);
    doc.setFont('helvetica', 'normal'); doc.setFontSize(8.5); doc.setTextColor(GRIS); T(detalle, x2, y + 16);
    if (lx.length) { doc.setTextColor(TINTA); T(lx, x2, y + 20.5); }
    y += h + 4;
  };
  seccion('Firma del solicitante', 48);
  bloqueFirma(s.firma_solicitante, 'Solicitante', s.solicitante_nombre, `${s.solicitante_email} · ${fmt(s.creado_en)}`);

  seccion('Flujo de aprobación', 48);
  ap.forEach((a, i) => bloqueFirma(a.firma, `${i + 1}. ${a.paso} - ${ESTADOS[a.estado] || a.estado}`, a.resuelto_por_nombre || '-',
    `${a.resuelto_por_email || ''} · ${fmt(a.resuelto_en)}`, [a.comentario ? 'Comentario: ' + a.comentario : '', ...datosAprobTxt(a).map(([k, v]) => `${k}: ${v}`)].filter(Boolean).join('  |  ')));
  if ((s.intercambios || []).length) {
    seccion('Información adicional solicitada');
    s.intercambios.forEach(x => { const l = split(`${x.paso} (${x.por_nombre}, ${fmt(x.en)}): ${x.pregunta}`, CW), r = split(`Respuesta (${fmt(x.respondido_en)}): ${x.respuesta || '-'}${(x.adjuntos || []).length ? '  [Adjuntos: ' + x.adjuntos.map(a => a.nombre).join(', ') + ']' : ''}`, CW - 4);
      espacio((l.length + r.length) * 4.2 + 4); doc.setFontSize(9); doc.setFont('helvetica', 'bold'); doc.setTextColor(TINTA); T(l, M, y); y += l.length * 4.2;
      doc.setFont('helvetica', 'normal'); doc.setTextColor(GRIS); T(r, M + 4, y); y += r.length * 4.2 + 3; });
  }

  if (s.textos?.msg_aprobado) { const l = split(s.textos.msg_aprobado, CW - 8); espacio(l.length * 4.5 + 8);
    doc.setFillColor('#E9EEF5'); doc.roundedRect(M, y, CW, l.length * 4.5 + 6, 2, 2, 'F');
    doc.setFont('helvetica', 'bold'); doc.setFontSize(9.5); doc.setTextColor(AZUL); T(l, M + 4, y + 5.5); y += l.length * 4.5 + 10; }

  // Pie
  const n = doc.getNumberOfPages(), gen = fmt(new Date());
  for (let p = 1; p <= n; p++) {
    doc.setPage(p); doc.setDrawColor(LINEA); doc.setLineWidth(0.2); doc.line(M, 285, W - M, 285);
    doc.setFont('helvetica', 'normal'); doc.setFontSize(7.5); doc.setTextColor('#7A8594');
    T(`Documento generado electrónicamente el ${gen} a partir de los registros de ${S.app}. Folio ${s.folio}.`, M, 289.5);
    T(`Página ${p} de ${n}`, W - M, 289.5, { align: 'right' });
  }
  return doc;
}

const kb = n => n > 1048576 ? (n / 1048576).toFixed(1) + ' MB' : Math.max(1, Math.round(n / 1024)) + ' KB';
async function vistaModulo(codigo, tab) {
  cargando('mod_' + codigo);
  await cargarBase();
  const m = S.modulos.find(x => x.codigo === codigo);
  if (!m) { location.hash = '#/'; return; }
  const tabs = [['politica', 'Política y plazos', esRH()], ['formulario', 'Formulario', esAdmin()], ['flujo', 'Flujo de aprobación', esAdmin()],
                ['textos', 'Textos y mensajes', esAdmin()], ['general', 'General', esAdmin()]]
               .filter(t => t[2]);
  if (tab === 'responsables') { location.hash = '#/departamentos'; return; }
  if (!tabs.some(t => t[0] === tab)) tab = tabs[0][0];
  const editor = ['formulario', 'flujo', 'textos', 'general'].includes(tab);
  if (editor && (!ED || ED.codigo !== codigo || !ED._sucio)) { ED = JSON.parse(JSON.stringify(m)); ED.textos = ED.textos || {}; ED._sucio = false; }
  const acciones = editor ? `${ED._sucio ? '<span class="small" style="color:var(--warn);font-weight:600">Cambios sin guardar</span>' : ''}
      <button class="btn" id="prev">Vista previa</button><button class="btn pri" id="guardar">${I.check} Guardar cambios</button>` : '';
  shell('mod_' + codigo, `<div class="page-head"><div><div class="mod-cap">Configuración del trámite</div><h1 style="margin-top:4px">${esc(m.nombre)}</h1>
      <p>Lo que configure aquí aplica solo a este trámite.${editor ? ' Formulario, flujo, textos y general se guardan juntos.' : ''}</p></div><div class="row wrap">${acciones}</div></div>
    <div class="tabs">${tabs.map(([k, l]) => `<a href="#/modulo/${esc(codigo)}/${k}" class="${k === tab ? 'on' : ''}">${l}</a>`).join('')}</div>
    <div id="edbody"></div>`);
  if (editor) {
    const marcar = () => { if (!ED._sucio) { ED._sucio = true; const g = $('#guardar'); if (g && !$('.page-head .row .small')) g.insertAdjacentHTML('beforebegin', '<span class="small" style="color:var(--warn);font-weight:600">Cambios sin guardar</span>'); } };
    ['input', 'change'].forEach(ev => $('#edbody').addEventListener(ev, marcar));
    $('#edbody').addEventListener('click', e => { if (e.target.closest('[data-mv],[data-rm],.day,#addp')) marcar(); });
    $('#guardar').onclick = e => ocupado(e.currentTarget, async () => {
      try { const { _sucio, ...datos } = ED; await api('rh_admin_guardar_modulo', { p_modulo: datos }); ED._sucio = false; toast('Cambios guardados.', 'ok'); vistaModulo(codigo, tab); }
      catch (err) { toast(err.message, 'err'); }
    });
    $('#prev').onclick = () => { PER_CTX = ED.opciones?.periodos || []; modal({ title: 'Vista previa · ' + ED.nombre, size: 'lg', body: `${ED.textos.intro ? `<div class="alert a-info">${I.shield}<div class="small">${esc(ED.textos.intro)}</div></div>` : ''}<div class="grid2" id="pv">${ED.formulario.map(f => campoHTML(f, valorAuto(f))).join('')}</div>
        ${ED.textos.declaracion ? `<label class="chk" style="margin-top:16px"><input type="checkbox"><span><b>Declaración.</b> ${esc(ED.textos.declaracion)}</span></label>` : ''}`, onOpen: el => enlazarForm(el, ED.formulario) }); };
    return ({ formulario: edFormulario, flujo: edFlujo, textos: edTextos, general: edGeneral })[tab]();
  }
  if (tab === 'responsables') return tabResponsables(m);
  return tabPolitica(m);
}

  if ($('#pers')) {

          <span class="small muted">al</span><input class="inp" type="date" data-pp="hasta" value="${esc(x.hasta)}" style="max-width:170px">
          ${x.desde <= hoy() && hoy() <= x.hasta ? '<span class="badge s-aprobada">Abierto hoy</span>' : x.hasta < hoy() ? '<span class="badge s-cancelada">Cerrado</span>' : '<span class="badge s-en_espera">Próximo</span>'}
          <button class="btn sm ghost icon" data-rmp="${k}" title="Quitar" style="color:var(--danger)">${I.x}</button></div>`).join('') || '<div class="xs muted">Sin períodos en este año.</div>'}</div>`).join('')
        : '<div class="small muted">No hay períodos definidos: todas las solicitudes se tramitarán como fuera de período. Use <b>Agregar año</b>.</div>';
    };
    pintar();
    $('#pers').oninput = e => { const r = e.target.closest('[data-pk]'); if (r && e.target.dataset.pp) PL[+r.dataset.pk][e.target.dataset.pp] = e.target.value; };
    $('#pers').onclick = e => {
      const ap = e.target.closest('[data-addp]'), rp = e.target.closest('[data-rmp]'), ra = e.target.closest('[data-rmanio]');
      if (ap) { const a = +ap.dataset.addp, n = PL.filter(x => x.anio === a).length + 1; PL.push({ anio: a, nombre: 'Período ' + n, desde: `${a}-01-01`, hasta: `${a}-01-31` }); pintar(); }
      if (rp) { PL.splice(+rp.dataset.rmp, 1); pintar(); }
      if (ra) { const a = +ra.dataset.rmanio; for (let k = PL.length - 1; k >= 0; k--) if (PL[k].anio === a) PL.splice(k, 1); anios.delete(a); pintar(); }
    };
    $('#addanio').onclick = () => { const a = Math.max(+hoy().slice(0, 4), ...anios) + (anios.size ? 1 : 0);
      anios.add(a); PL.push({ anio: a, nombre: 'Período 1', desde: `${a}-03-01`, hasta: `${a}-03-31` }, { anio: a, nombre: 'Período 2', desde: `${a}-07-01`, hasta: `${a}-07-31` }); pintar(); };
    $('#gper').onclick = e => ocupado(e.currentTarget, async () => {
      try { await api('rh_modulo_periodos', { p_modulo: m.codigo, p_periodos: PL.map(({ nombre, desde, hasta }) => ({ nombre, desde, hasta })) });
        toast('Períodos guardados.', 'ok'); await cargarBase(); recargar(); } catch (err) { toast(err.message, 'err'); } });
  }
  if (fTipos) {
    const TP = (fTipos.opciones || []).map(o => ({ nombre: o, anterior: o, ...(fTipos.detalle_opciones || {})[o] }));
    const pintarT = () => { $('#tipos').innerHTML = TP.map((t, k) => `<tr data-tk="${k}"><td><input class="inp" data-t="nombre" value="${esc(t.nombre)}"></td>
        <td><input class="inp" type="number" min="0" max="100" data-t="porcentaje" value="${esc(t.porcentaje ?? '')}"></td>
        <td><input class="inp" type="number" min="0" step="50" data-t="tope" value="${esc(t.tope ?? '')}" placeholder="Sin tope"></td>
        <td><input class="inp" type="number" min="0" max="240" data-t="antiguedad_meses" value="${esc(t.antiguedad_meses ?? '')}"></td>
        <td><textarea class="inp" data-t="nota" style="min-height:44px">${esc(t.nota || '')}</textarea></td>
        <td><button class="btn sm ghost icon" data-rmt="${k}" title="Quitar" style="color:var(--danger)">${I.trash}</button></td></tr>`).join(''); };
    pintarT();
    $('#tipos').oninput = e => { const tr = e.target.closest('[data-tk]'); if (tr && e.target.dataset.t) TP[+tr.dataset.tk][e.target.dataset.t] = e.target.value; };
    $('#tipos').onclick = e => { const b = e.target.closest('[data-rmt]'); if (b) { TP.splice(+b.dataset.rmt, 1); pintarT(); } };
    $('#addtipo').onclick = () => { TP.push({ nombre: 'Nuevo tipo', anterior: '', porcentaje: 50, tope: '', antiguedad_meses: 3, nota: '' }); pintarT(); };
    $('#gtipos').onclick = e => ocupado(e.currentTarget, async () => {
      try { await api('rh_modulo_tipos_guardar', { p_modulo: m.codigo, p_tipos: TP }); toast('Tipos de solicitud guardados.', 'ok'); await cargarBase(); recargar(); } catch (err) { toast(err.message, 'err'); } });
  }
  if ($('#gvig')) $('#gvig').onclick = e => ocupado(e.currentTarget, async () => {
    try { await api('rh_modulo_vigencia', { p_modulo: m.codigo, p_vigencia: +$('#vig_m').value, p_extension: +$('#vig_e').value }); toast('Vigencia guardada.', 'ok'); await cargarBase(); recargar(); } catch (err) { toast(err.message, 'err'); } });
  if ($('#gpres')) $('#gpres').onclick = e => ocupado(e.currentTarget, async () => {
    try { const v = $('#pres_m').value; await api('rh_modulo_presupuesto', { p_modulo: m.codigo, p_anio: +$('#pres_a').value, p_monto: v === '' ? null : +v });
      toast('Presupuesto guardado.', 'ok'); await cargarBase(true); recargar(); } catch (err) { toast(err.message, 'err'); } });
  $('#grec').onclick = e => ocupado(e.currentTarget, async () => {
    try { const r = await api('rh_dias_recordatorio', { p_modulo: m.codigo, p_dias: +$('#diasrec').value }); toast(`El solicitante podrá recordar tras ${r.dias} día(s) sin respuesta.`, 'ok'); recargar(); }
    catch (err) { toast(err.message, 'err'); } });
  if (fd) $('#gdias').onclick = e => ocupado(e.currentTarget, async () => {
    const v = $('#diaspol').value;
    try { const r = await api('rh_dias_politica', { p_modulo: m.codigo, p_dias: v === '' ? 0 : +v, p_vie_lun: $('#vielun').checked });
      toast((r.dias ? `Política: hasta ${r.dias} día(s).` : 'Sin límite de días.') + (r.vie_lun ? ' Lunes y viernes cuentan como consecutivos.' : ' Lunes y viernes no cuentan como consecutivos.'), 'ok'); recargar(); }
    catch (err) { toast(err.message, 'err'); } });
  $('#fp').onsubmit = e => { e.preventDefault(); ocupado($('#fp button.pri'), async () => {
    const files = [...$('#pf').files], btn = $('#fp button.pri');
    if (!$('#pt').value.trim()) return toast('Escriba el título.', 'err');
    if (!files.length) return toast('Seleccione el archivo PDF.', 'err');
    if (files.some(f => !(/\.pdf$/i.test(f.name) || f.type === 'application/pdf'))) return toast('Solo se aceptan archivos PDF. Si está en Word: Archivo → Guardar como → PDF.', 'err');
    if (files.reduce((a, f) => a + f.size, 0) > 60 * 1024 * 1024) return toast('Los archivos suman más de 60 MB.', 'err');
    try {
      btn.innerHTML = '<span class="spin"></span> Leyendo archivo…';
      const fuentes = await fuentesDePolitica(files);
      if (!fuentes.length) throw new Error('El archivo no tiene páginas.');
      if (fuentes.length > 80) throw new Error(`La política tiene ${fuentes.length} páginas; el máximo es 80.`);
      const { id } = await api('rh_politica_iniciar', { p_modulo: m.codigo, p_titulo: $('#pt').value, p_version: $('#pv').value,
        p_archivo_nombre: files.map(f => f.name).join(', ').slice(0, 200), p_paginas: fuentes.length });
      for (let k = 0; k < fuentes.length; k++) {
        btn.innerHTML = `<span class="spin"></span> Página ${k + 1} de ${fuentes.length}…`;
        const pag = await paginaAJpg(fuentes[k]);
        for (let t = 1; t <= 3; t++) {
          try { await api('rh_politica_pagina', { p_id: id, p_n: k + 1, p_imagen: pag.b64, p_ancho: pag.ancho, p_alto: pag.alto }); break; }
          catch (err) { if (t === 3) throw err; await new Promise(z => setTimeout(z, 800 * t)); }
        }
      }
      btn.innerHTML = '<span class="spin"></span> Finalizando…';
      await api('rh_politica_finalizar', { p_id: id, p_vigente: $('#pvig').checked });
      toast(`Política publicada (${fuentes.length} página${fuentes.length > 1 ? 's' : ''}).`, 'ok'); recargar();
    } catch (err) { toast(err.message, 'err'); }
  }); };
  $$('[data-ver]').forEach(b => b.onclick = () => ocupado(b, async () => { try { await abrirPolitica(+b.dataset.ver); } catch (err) { toast(err.message, 'err'); } }));
  $$('[data-vig]').forEach(b => b.onclick = () => ocupado(b, async () => { try { await api('rh_politica_vigente', { p_id: +b.dataset.vig }); toast('Política vigente actualizada.', 'ok'); recargar(); } catch (err) { toast(err.message, 'err'); } }));
  $$('[data-del]').forEach(b => b.onclick = async () => { if (!await confirmar('Eliminar política', '¿Eliminar esta versión? No ha sido aceptada en ninguna solicitud.', 'Eliminar', 'dan')) return;
    try { await api('rh_politica_eliminar', { p_id: +b.dataset.del }); recargar(); } catch (err) { toast(err.message, 'err'); } });
}

        <div class="field"><label>Dato del monto aprobado</label><select class="inp" data-b="campo_monto">${ED.flujo.flatMap(p => p.datos || []).filter(d => d.tipo === 'numero').map(d => `<option value="${esc(d.key)}" ${O.beneficio.campo_monto === d.key ? 'selected' : ''}>${esc(d.label)}</option>`).join('') || '<option value="monto">monto (agregue el dato en el flujo)</option>'}</select></div>
        <div class="field"><label>Campo "tipo" para los reportes</label><select class="inp" data-b="campo_tipo">${ED.formulario.filter(f => ['lista', 'opcion'].includes(f.tipo)).map(f => `<option value="${esc(f.key)}" ${O.beneficio.campo_tipo === f.key ? 'selected' : ''}>${esc(f.label)}</option>`).join('')}</select></div>
        <div class="field"><label>Campo "período" para los reportes</label><select class="inp" data-b="campo_periodo">${ED.formulario.filter(f => ['lista', 'opcion'].includes(f.tipo)).map(f => `<option value="${esc(f.key)}" ${O.beneficio.campo_periodo === f.key ? 'selected' : ''}>${esc(f.label)}</option>`).join('')}</select></div>
      </div>` : ''}</div></div>`;
  $('#cplnk').onclick = () => { navigator.clipboard?.writeText($('#lnk').value); toast('Enlace copiado.', 'ok'); };
  $('#benon').onchange = e => { if (e.target.checked) O.beneficio = O.beneficio || { vigencia_meses: 12, moneda: 'USD', campo_monto: 'monto', campo_tipo: '', campo_periodo: '' }; else delete O.beneficio; ED._sucio = true; edGeneral(); };
  $('#edbody').oninput = $('#edbody').onchange = e => { const g = e.target.dataset.g, o = e.target.dataset.o, bb = e.target.dataset.b;
    if (g) ED[g] = e.target.type === 'checkbox' ? e.target.checked : e.target.value;
    if (o) O[o] = e.target.checked;
    if (bb) O.beneficio[bb] = e.target.type === 'number' ? +e.target.value : e.target.value; };
  $('#edbody').onclick = null;
}

        <div class="alert a-info" style="margin:0">${I.info}<div class="small">Si desde las solicitudes de prueba pulsa <b>Recordar</b>, se intenta enviar un correo a esas direcciones ficticias. Para practicar aprobaciones sin molestar a nadie, active el <b>Modo prueba</b> (arriba): los códigos de <span class="kbd">prueba.…</span> le llegarán a usted.</div></div>
        <div class="row wrap"><button class="btn" id="dpcargar" ${dp.solicitudes ? 'disabled' : ''}>${I.plus} Cargar datos de prueba</button>

      </div></div></div>`);
  $('#cpy').onclick = () => { navigator.clipboard?.writeText($('[data-c=pa_secreto]').value); toast('Secreto copiado.', 'ok'); };
  $('#gen').onclick = () => { const a = new Uint8Array(18); crypto.getRandomValues(a); $('[data-c=pa_secreto]').value = [...a].map(x => x.toString(16).padStart(2, '0')).join(''); toast('Secreto nuevo generado: guarde y actualícelo en Power Automate.'); };
  $('#usar').onclick = () => $('[data-c=app_url]').value = urlApp;
  $('#verurl').onclick = () => { const i = $('[data-c=pa_url]'); i.type = i.type === 'password' ? 'text' : 'password'; $('#verurl').textContent = i.type === 'password' ? 'Ver' : 'Ocultar'; };
  const guardar = async () => {
    const cfg = {}; $$('[data-c]').forEach(i => cfg[i.dataset.c] = i.type === 'number' ? +i.value : i.value.trim());
    cfg.dominios_permitidos = $('#dom').value.split(/[,;\s]+/).map(x => x.trim().replace(/^@/, '').toLowerCase()).filter(Boolean);

    await api('rh_admin_guardar_config', { p_cfg: cfg });
  };
  $('#gc').onclick = e => ocupado(e.currentTarget, async () => { try { await guardar(); toast('Configuración guardada.', 'ok'); adminConfig(); } catch (err) { toast(err.message, 'err'); } });
  let retAnios = 0;
  $('#retcontar').onclick = e => ocupado(e.currentTarget, async () => {

  $('#dpcargar').onclick = e => ocupado(e.currentTarget, async () => {
    try { const r = await api('rh_admin_datos_prueba', { p_accion: 'cargar' }); toast(`Se cargaron ${r.solicitudes} solicitudes de prueba (${r.teletrabajo} de Teletrabajo y ${r.apoyo_educativo || 0} de Apoyo Educativo). Las pendientes están en Por aprobar.`, 'ok'); await cargarBase(); adminConfig(); }
    catch (err) { toast(err.message, 'err'); } });
  $('#dpborrar').onclick = async e => {

    ocupado(e.target.closest('button'), async () => {
      try { const r = await api('rh_admin_datos_prueba', { p_accion: 'borrar' }); toast(`Datos de prueba borrados: ${r.solicitudes} solicitudes y ${r.usuarios} personas.`, 'ok'); adminConfig(); }

    catch (err) { toast(err.message, 'err'); } });

    try { await guardar(); const r = await api('rh_admin_probar_correo', { p_para: $('#tp').value });

    catch (err) { toast(err.message, 'err'); }
  });
}
async function adminCorreos() {
  cargando('correos');
  const rows = await api('rh_admin_correos');
  const st = r => r.estado !== 'enviado' ? `<span class="badge s-rechazada">${esc(r.estado)}</span>`
    : r.http ? (r.http >= 200 && r.http < 300 ? `<span class="badge s-aprobada">HTTP ${r.http}</span>` : `<span class="badge s-rechazada">HTTP ${r.http}</span>`)
    : r.error ? `<span class="badge s-rechazada" title="${esc(r.error)}">Error</span>` : '<span class="badge s-cancelada">Enviado</span>';
  shell('correos', `<div class="page-head"><div><h1>Bitácora de correos</h1><p>Últimos 150 envíos hacia Power Automate. <b>HTTP 202</b> = el flujo lo recibió · <b>HTTP 200</b> = el flujo confirmó el envío (si agregó las respuestas, paso 3.6b de la guía) · <b>Error / Timeout</b> = el flujo no respondió.</p></div><button class="btn" id="rf">${I.refresh} Actualizar</button></div>
    <div class="card">${!rows.length ? `<div class="empty">${I.mail}<div>Aún no se han enviado correos.</div></div>` : `<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Fecha</th><th>Tipo</th><th>Para</th><th>Asunto</th><th>Resultado</th></tr></thead><tbody>
    ${rows.map(r => `<tr><td class="small" style="white-space:nowrap">${fmt(r.creado_en)}</td><td><span class="tag">${esc(r.tipo)}</span></td><td class="small">${esc(r.para)}</td><td class="small">${esc(r.asunto.replace(/(código de acceso: )\d{6}/i, '$1••••••'))}</td><td>${st(r)}${r.error ? `<div class="xs muted" style="max-width:220px">${esc(r.error)}</div>` : ''}</td></tr>`).join('')}
    </tbody></table></div>`}</div>
    <p class="xs muted" style="margin-top:10px">Supabase conserva el resultado HTTP solo unas horas; después la columna muestra “Enviado”.</p>`);
  $('#rf').onclick = adminCorreos;
}

  shell('personas', `<div class="page-head"><div><h1>Personas</h1><p>Colaboradores registrados. RH puede corregir sus datos e inactivarlos (por ejemplo, al salir de la compañía). Los inactivos siguen contando en los reportes del año, marcados como inactivos.</p></div>
      ${esAdmin() ? `<a class="btn" href="#/admin/usuarios">${I.key} Roles y carga masiva</a>` : ''}</div>
    <div class="card"><div class="card-h"><div class="row wrap grow">
      <input class="inp" id="pq" placeholder="Buscar nombre, correo, cédula, departamento…" value="${esc(F.q || '')}" style="max-width:320px">
      <select class="inp" id="pe" style="max-width:190px">${[['activos', 'Activos'], ['inactivos', 'Inactivos'], ['incompletos', 'Perfil incompleto'], ['todos', 'Todos']].map(([k, l]) => `<option value="${k}" ${est === k ? 'selected' : ''}>${l}</option>`).join('')}</select>
      <span class="small muted" id="pn"></span></div></div>
    <div class="tbl-wrap"><table class="tbl cards"><thead><tr><th>Persona</th><th>Departamento / puesto</th><th>Cédula</th><th>Ingreso</th><th>Perfil</th><th>Estado</th><th class="num">Solicitudes</th><th></th></tr></thead><tbody id="pt">
    ${us.map(u => `<tr data-id="${u.id}" data-q="${esc([u.nombre, u.email, u.cedula, u.departamento, u.puesto].join(' ').toLowerCase())}" data-act="${u.activo ? 1 : 0}" data-pc="${u.perfil_completo ? 1 : 0}">
      <td><b>${esc(u.nombre || '—')}</b>${u.rol !== 'usuario' ? ` <span class="tag ${u.rol === 'admin' ? 'adm' : 'rh'}">${esc(ROLES[u.rol])}</span>` : ''}<div class="xs muted">${esc(u.email)}</div></td>
      <td class="small">${esc(u.departamento || '—')}<div class="xs muted">${esc(u.puesto || '')}</div></td>
      <td class="small">${esc(u.cedula || '—')}</td><td class="small">${fmtISO(u.fecha_ingreso)}</td>
      <td>${u.perfil_completo ? '<span class="badge s-aprobada">Completo</span>' : '<span class="badge s-en_espera">Incompleto</span>'}</td>
      <td>${u.activo ? '<span class="badge s-aprobada">Activo</span>' : `<span class="badge s-cancelada">Inactivo</span><div class="xs muted">${u.inactivo_desde ? 'desde ' + fmtD(u.inactivo_desde) : ''}</div>`}</td>
      <td class="num">${u.solicitudes}</td>
      <td style="text-align:right"><button class="btn sm" data-ed="${u.id}">${I.edit} Editar</button></td></tr>`).join('')}
    </tbody></table></div></div>`);
  const filtrar = () => { const q = $('#pq').value.toLowerCase(), e = $('#pe').value; store.set('fper', JSON.stringify({ q, estado: e })); let n = 0;
    $$('#pt tr').forEach(tr => { const ok = tr.dataset.q.includes(q) && (e === 'todos' || (e === 'activos' && tr.dataset.act === '1') || (e === 'inactivos' && tr.dataset.act === '0') || (e === 'incompletos' && tr.dataset.pc === '0'));

  $('#pq').oninput = filtrar; $('#pe').onchange = filtrar; filtrar();
  $$('[data-ed]').forEach(b => b.onclick = () => { const u = us.find(x => x.id === b.dataset.ed);

          <span class="help">${bloqueado ? 'Solo un administrador puede inactivar usuarios de RH o administradores.' : 'Al inactivar se cierran sus sesiones; ya no podrá ingresar ni aparece en el teletrabajo activo.'}</span></div></form>`,

/* =====================================================================
   v1.15 · CONTROL DE BENEFICIOS (RH): tope por persona y año, reembolsos y vigencia
   ===================================================================== */
async function vistaBeneficios(codigo) {
  cargando('beneficios');
  await cargarBase();
  const mods = S.modulos.filter(m => m.opciones?.beneficio);
  const m = mods.find(x => x.codigo === codigo) || mods[0];
  if (!m) { shell('beneficios', '<div class="empty">Ningún trámite maneja beneficios.</div>'); return; }
  const F = JSON.parse(store.get('fben') || '{}'), anio = F.anio ?? '';
  const B = await api('rh_beneficios', { p_modulo: m.codigo, p_anio: anio === '' ? null : +anio });
  const mon = n => n == null ? '—' : (B.moneda === 'USD' ? 'US$' : B.moneda + ' ') + Number(n).toLocaleString('es-CR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const EST = { activo: ['Vigente', 's-aprobada'], extension: ['En extensión', 's-en_espera'], vencido: ['Vencido', 's-cancelada'], finalizado: ['Finalizado', 's-rechazada'] };
  const filas = B.filas.filter(f => !F.estado || f.beneficio?.estado === F.estado);
  const tot = filas.reduce((a, f) => ({ tope: a.tope + (+f.beneficio?.monto_aprobado || 0), ej: a.ej + (+f.beneficio?.ejecutado || 0) }), { tope: 0, ej: 0 });
  shell('beneficios', `<div class="page-head"><div><h1>Control de beneficios</h1><p>${esc(m.nombre)}: tope anual por persona, reembolsos y vigencia (${B.vigencia_meses} meses desde la aprobación + ${B.extension_meses} meses de extensión; después debe solicitarse de nuevo).</p></div>
      ${mods.length > 1 ? `<select class="inp" id="bm" style="max-width:240px">${mods.map(x => `<option value="${esc(x.codigo)}" ${x.codigo === m.codigo ? 'selected' : ''}>${esc(nombreCorto(x))}</option>`).join('')}</select>` : ''}</div>
    <div class="card" style="margin-bottom:16px"><div class="card-b row wrap" style="gap:12px;align-items:flex-end">
      <div class="field"><label>Año de aprobación</label><select class="inp" id="ba"><option value="">Todos</option>${B.anios.sort().reverse().map(a => `<option ${String(a) === String(anio) ? 'selected' : ''}>${a}</option>`).join('')}</select></div>
      <div class="field"><label>Estado</label><select class="inp" id="be"><option value="">Todos</option>${Object.entries(EST).map(([k, [l]]) => `<option value="${k}" ${F.estado === k ? 'selected' : ''}>${l}</option>`).join('')}</select></div>
      <div class="field grow" style="min-width:200px"><label>Buscar</label><input class="inp" id="bq" placeholder="Nombre, folio, programa…" value="${esc(F.q || '')}"></div>
      <a class="small" href="#/modulo/${esc(m.codigo)}/politica">Configurar vigencia y tipos →</a></div></div>
    <div class="kpis"><div class="kpi"><div class="l">Beneficiarios</div><div class="v">${filas.length}</div><div class="s">${filas.filter(f => ['activo', 'extension'].includes(f.beneficio?.estado)).length} vigentes o en extensión</div></div>
      <div class="kpi"><div class="l">Tope anual total</div><div class="v">${mon(tot.tope)}</div></div>
      <div class="kpi"><div class="l">Reembolsado</div><div class="v">${mon(tot.ej)}</div><div class="s">${tot.tope ? Math.round(tot.ej / tot.tope * 100) + '% del tope' : '—'}</div></div>
      <div class="kpi"><div class="l">Saldo</div><div class="v">${mon(tot.tope - tot.ej)}</div></div></div>
    <div class="card"><div class="tbl-wrap"><table class="tbl cards"><thead><tr><th>Persona</th><th>Tipo / programa</th><th>Vigencia</th><th style="min-width:190px">Tope anual · reembolsado · saldo</th><th>Estado</th></tr></thead><tbody id="bt">
    ${filas.map(f => { const b = f.beneficio || {}, e = EST[b.estado] || [b.estado, ''];
      return `<tr data-q="${esc([f.solicitante, f.email, f.folio, f.programa, f.tipo].join(' ').toLowerCase())}" data-row="${f.id}">
        <td style="min-width:170px"><b>${esc(f.solicitante)}</b>${f.activo_usuario ? '' : ' <span class="tag">Inactivo</span>'}${f.es_prueba ? ' <span class="tag prb">Prueba</span>' : ''}<div class="xs"><a href="#/solicitud/${f.id}">${esc(f.folio)}</a> · ${esc(f.departamento || '')}</div>
          <button class="btn sm pri btn-reemb" data-abrir="${f.id}">${I.plus} Reembolsos (${f.reembolsos.length})</button></td>
        <td class="small" style="max-width:220px">${esc(f.tipo || '—')}<div class="xs muted">${esc(f.programa || '')}</div></td>
        <td class="small" style="white-space:nowrap">${fmtD(b.inicio)} →<br>${fmtD(b.vence)}<div class="xs muted">ext. ${fmtD(b.extension_hasta)}</div></td>
        <td><div class="row between" style="gap:8px"><b>${mon(b.monto_aprobado)}</b>${b.tope_ajustado != null ? '<span class="xs muted">ajustado</span>' : ''}</div>
          <div class="uso-tope"><i style="width:${b.monto_aprobado ? Math.min(100, (+b.ejecutado || 0) / b.monto_aprobado * 100) : 0}%;${b.saldo < 0 ? 'background:var(--danger)' : ''}"></i></div>
          <div class="xs muted">Reembolsado ${mon(b.ejecutado)} · <span style="${b.saldo < 0 ? 'color:var(--danger)' : ''}">saldo ${mon(b.saldo)}</span></div></td>
        <td><span class="badge ${e[1]}">${e[0]}</span>${b.contrato_firmado ? '<div class="xs" style="color:var(--ok)">Contrato firmado ✓</div>' : '<div class="xs muted">Sin contrato firmado</div>'}</td></tr>`; }).join('') || '<tr><td colspan="5"><div class="empty">No hay beneficios con esos filtros.</div></td></tr>'}
    </tbody></table></div></div>
    <p class="xs muted" style="margin-top:10px">El tope anual sale del monto que registra el Gerente de RH al aprobar; RH puede ajustarlo. Los reembolsos se aceptan hasta el fin de la extensión.</p>`);
  const guardarF = () => { store.set('fben', JSON.stringify({ anio: $('#ba').value, estado: $('#be').value, q: $('#bq').value })); vistaBeneficios(m.codigo); };
  $('#ba').onchange = guardarF; $('#be').onchange = guardarF; if ($('#bm')) $('#bm').onchange = () => { location.hash = '#/beneficios/' + $('#bm').value; };
  const filtrar = () => { const q = $('#bq').value.toLowerCase(); store.set('fben', JSON.stringify({ anio: $('#ba').value, estado: $('#be').value, q }));
    $$('#bt tr[data-q]').forEach(tr => { const ok = tr.dataset.q.includes(q); tr.style.display = ok ? '' : 'none'; const d = tr.nextElementSibling; if (d?.classList.contains('det-ben') && !ok) d.remove(); }); };
  $('#bq').oninput = filtrar; filtrar();
  // v1.16: toda la fila abre los reembolsos (además del botón de la primera columna, que siempre se ve)
  $$('#bt tr[data-row]').forEach(tr => tr.onclick = e => { if (!e.target.closest('a,button')) $('[data-abrir]', tr).click(); });
  $$('[data-abrir]').forEach(btn => btn.onclick = () => {
    const tr = btn.closest('tr'), f = B.filas.find(x => x.id === +btn.dataset.abrir), b = f.beneficio || {};
    if (tr.nextElementSibling?.classList.contains('det-ben')) { tr.classList.remove('sel'); return tr.nextElementSibling.remove(); }
    tr.classList.add('sel');
    const det = document.createElement('tr'); det.className = 'det-ben';
    det.innerHTML = `<td colspan="5" style="background:var(--surface-2)"><div class="stack det-in" style="gap:10px">
      <div class="row between wrap"><b>Reembolsos de ${esc(f.solicitante)}</b><span class="xs muted">Saldo ${mon(b.saldo)} de ${mon(b.monto_aprobado)}</span></div>
      ${f.reembolsos.length ? `<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Fecha</th><th>Informe SAP</th><th>Detalle</th><th class="num">Monto</th><th></th></tr></thead><tbody>${f.reembolsos.map(r => `<tr><td class="small">${fmtISO(r.fecha)}</td><td class="small"><b>${esc(r.informe_sap || '—')}</b></td>
        <td class="small">${esc(r.descripcion || '—')}<div class="xs muted">${esc(r.registrado_por)}</div></td><td class="num">${mon(r.monto)}</td><td style="text-align:right"><button class="btn sm ghost icon" data-delr="${r.id}" title="Eliminar">${I.trash}</button></td></tr>`).join('')}</tbody></table></div>` : '<div class="xs muted">Sin reembolsos registrados.</div>'}
      ${b.estado === 'finalizado' || b.estado === 'vencido' ? `<div class="small muted">${b.estado === 'vencido' ? `Venció el ${fmtD(b.extension_hasta)}: para nuevos reembolsos la persona debe presentar una solicitud nueva.` : `Finalizado el ${fmtISO(b.fin)} · ${esc(b.fin_motivo || '')}`}</div>` : `<div class="row wrap" style="gap:8px;align-items:flex-end">
        <div class="field" style="width:150px"><label>Fecha</label><input class="inp" type="date" data-r="fecha" value="${hoy()}"></div>
        <div class="field" style="width:170px"><label>N.º informe SAP *</label><input class="inp" data-r="informe" maxlength="40" placeholder="Ej. 4500012345"></div>
        <div class="field" style="width:130px"><label>Monto</label><input class="inp" type="number" min="0" step="0.01" data-r="monto"></div>
        <div class="field grow" style="min-width:160px"><label>Detalle (materia, factura)</label><input class="inp" data-r="desc"></div>
        <button class="btn pri" data-addr>${I.plus} Registrar</button></div>`}
      <div class="row wrap" style="gap:8px"><button class="btn sm" data-tope>${I.edit} Ajustar tope</button><a class="btn sm ghost" href="#/solicitud/${f.id}">Abrir solicitud →</a></div></div></td>`;
    tr.after(det);
    // el detalle queda a la vista aunque la tabla se desplace a lo ancho
    const wrap = det.closest('.tbl-wrap'), ajustar = () => { const d = $('.det-in', det); if (d && wrap) d.style.width = (wrap.clientWidth - 32) + 'px'; };
    ajustar(); window.addEventListener('resize', ajustar);
    const recargar = () => vistaBeneficios(m.codigo);
    $('[data-tope]', det).onclick = () => modalTope(f.id, { ...b, moneda: B.moneda }, recargar);
    const add = $('[data-addr]', det); if (add) add.onclick = () => ocupado(add, async () => {
      try { await api('rh_reembolso_guardar', { p_solicitud: f.id, p_fecha: $('[data-r=fecha]', det).value || null, p_monto: +$('[data-r=monto]', det).value || 0,
          p_descripcion: $('[data-r=desc]', det).value, p_informe: $('[data-r=informe]', det).value }); toast('Reembolso registrado.', 'ok'); recargar(); } catch (err) { toast(err.message, 'err'); } });
    $$('[data-delr]', det).forEach(x => x.onclick = async () => { if (!await confirmar('Eliminar reembolso', '¿Eliminar este reembolso? Queda registrado en la bitácora.', 'Eliminar', 'dan')) return;
      try { await api('rh_reembolso_eliminar', { p_id: +x.dataset.delr }); recargar(); } catch (err) { toast(err.message, 'err'); } });
  });
}

/* =====================================================================

   ===================================================================== */
async function vistaContratos() {

  const [C, ap] = await Promise.all([api('rh_contrato_config'), api('rh_todas', { p_filtros: { estado: 'aprobada' } })]);
  const c = C.config || {}, pend = ap.filter(x => !x.contrato_firmado && !x.es_prueba && C.plantillas.some(p => p.modulo === x.modulo));
  const campo = (k, l, h, area) => `<div class="field ${area ? 'span2' : ''}"><label>${l}</label>${area ? `<textarea class="inp" data-cc="${k}" style="min-height:60px">${esc(c[k] || '')}</textarea>` : `<input class="inp" data-cc="${k}" value="${esc(c[k] || '')}">`}${h ? `<span class="help">${h}</span>` : ''}</div>`;
  shell('contratos', `<div class="page-head"><div><h1>Contratos</h1><p>Al aprobarse una solicitud, RH genera el contrato en Word desde la solicitud (botón <b>Generar contrato</b>), lo revisa, lo firma y carga el contrato firmado.</p></div></div>
    <div class="card" style="margin-bottom:16px;${pend.length ? 'border-color:var(--warn)' : ''}"><div class="card-h"><h2>Aprobadas sin contrato firmado (${pend.length})</h2></div>
      ${tablaSolicitudes(pend, { solicitante: true, vacio: 'Todas las solicitudes aprobadas tienen su contrato firmado cargado.', extra: 'Trámite', celda: x => `${esc(x.modulo_nombre)}<div class="xs muted">aprobada ${fmtD(x.finalizado_en)}</div>` })}</div>
    <div class="card" style="margin-bottom:16px"><div class="card-h"><h2>Datos del representante y entidades</h2><button class="btn pri" id="gcc">${I.check} Guardar</button></div>
      <div class="card-b grid2">
        <div class="span2 alert a-info" style="margin:0">${I.shield}<div class="small">La <b>empresa</b> y su <b>cédula jurídica</b> no son fijas: al pulsar <b>Generar contrato</b> se elige una entidad de la lista, se escribe otra o se dejan en blanco para llenarlas en Word. El nombre corto de las cláusulas sale de la razón social (sin "S.A.").</div></div>
        ${campo('rep_nombre', 'Representante legal (CEO)', 'Nombre completo de quien firma por la empresa; es el mismo para todas las entidades')}${campo('uso_inicial', 'Plazo de uso inicial (Apoyo Educativo)', 'Texto que va antes de "mes posterior…", ej. un (1)')}
        ${campo('empresa_domicilio', 'Domicilio de la empresa', 'Vacío = queda resaltado para llenarlo en Word', true)}
        ${campo('rep_calidades', 'Calidades del representante', 'Ej. mayor, casado, Administrador de Empresas, vecino de Alajuela, cédula de identidad número …', true)}
        ${campo('rep_condicion', 'Condición en la que firma', 'Ej. representante legal y con facultades de Apoderado General sin límite de suma', true)}
        <div class="span2"><div class="row between wrap" style="margin-bottom:6px"><label style="margin:0"><b>Entidades sugeridas</b> <span class="xs muted">(se ofrecen al generar; la última usada queda primero)</span></label><button class="btn sm" id="ent_add" type="button">${I.plus} Agregar entidad</button></div>
          <div class="tbl-wrap"><table class="tbl"><thead><tr><th>Razón social</th><th style="width:200px">Cédula jurídica</th><th style="width:44px"></th></tr></thead><tbody id="ent_t"></tbody></table></div></div>
      </div></div>
    <div class="card"><div class="card-h"><h2>Plantillas Word</h2></div><div class="card-b stack">
      <p class="small" style="margin:0">Cada trámite usa una plantilla <b>.docx</b>. Los datos se llenan donde la plantilla dice <span class="kbd">{{campo}}</span>; si un dato falta, en el Word queda <span style="background:#ff0">[completar: …]</span> resaltado para que lo escriba. Para cambiar el texto del contrato: descargue la plantilla, edítela en Word (sin borrar las llaves) y súbala de nuevo.</p>
      ${S.modulos.map(m => { const p = C.plantillas.find(x => x.modulo === m.codigo);
        return `<div class="fcard"><div class="row between wrap"><div><b>${esc(m.nombre)}</b><div class="xs muted">${p ? `${esc(p.nombre)} · ${kb(p.tamano)} · actualizada ${fmtD(p.actualizado)}${p.actualizado_por ? ' por ' + esc(p.actualizado_por) : ''}` : 'Sin plantilla: no se puede generar el contrato de este trámite.'}</div></div>
          <div class="row wrap" style="gap:6px">${p ? `<button class="btn sm" data-dlp="${esc(m.codigo)}">${I.pdf} Descargar plantilla</button>` : ''}<label class="btn sm">${I.up} ${p ? 'Reemplazar' : 'Subir'} plantilla<input type="file" hidden accept=".docx,application/vnd.openxmlformats-officedocument.wordprocessingml.document" data-upp="${esc(m.codigo)}"></label></div></div></div>`; }).join('')}
      <details><summary class="small" style="cursor:pointer">Campos disponibles para las plantillas</summary>
        <div class="tbl-wrap" style="margin-top:8px"><table class="tbl"><tbody>${Object.entries(ETIQ_CONTRATO).map(([k, l]) => `<tr><td><span class="kbd">{{${k}}}</span></td><td class="small">${esc(l)}</td></tr>`).join('')}</tbody></table></div></details>
    </div></div>`);

  const pintarEnt = () => { $('#ent_t').innerHTML = ENT.map((x, i) => `<tr><td><input class="inp" data-en="${i}" value="${esc(x.nombre)}" placeholder="Ej. EMPRESA S.A."></td><td><input class="inp" data-ec="${i}" value="${esc(x.cedula || '')}" placeholder="3-101-000000"></td>
      <td><button class="btn sm ghost icon" data-ed="${i}" title="Quitar">${I.trash}</button></td></tr>`).join('') || '<tr><td colspan="3" class="small muted">Sin entidades: al generar se escribe la entidad o se deja en blanco.</td></tr>';
    $$('[data-en]').forEach(i => i.oninput = () => ENT[+i.dataset.en].nombre = i.value);
    $$('[data-ec]').forEach(i => i.oninput = () => ENT[+i.dataset.ec].cedula = i.value);
    $$('[data-ed]').forEach(b => b.onclick = () => { ENT.splice(+b.dataset.ed, 1); pintarEnt(); }); };
  pintarEnt();
  $('#ent_add').onclick = () => { ENT.push({ nombre: '', cedula: '' }); pintarEnt(); $(`[data-en="${ENT.length - 1}"]`).focus(); };
  $('#gcc').onclick = e => ocupado(e.currentTarget, async () => {
    const cfg = { entidades: ENT.filter(x => x.nombre.trim()) }; $$('[data-cc]').forEach(i => cfg[i.dataset.cc] = i.value.trim());
    try { await api('rh_contrato_config_guardar', { p_cfg: cfg }); toast('Datos de los contratos guardados.', 'ok'); vistaContratos(); } catch (err) { toast(err.message, 'err'); } });
  $$('[data-dlp]').forEach(b => b.onclick = () => ocupado(b, async () => {
    try { const P = await api('rh_contrato_plantilla', { p_modulo: b.dataset.dlp }); const bin = atob(P.contenido), arr = new Uint8Array(bin.length); for (let k = 0; k < bin.length; k++) arr[k] = bin.charCodeAt(k);
      const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([arr], { type: 'application/vnd.openxmlformats-officedocument.wordprocessingml.document' })); a.download = P.nombre; a.click(); }
    catch (err) { toast(err.message, 'err'); } }));
  $$('[data-upp]').forEach(i => i.onchange = async () => { const f = i.files[0]; if (!f) return;
    if (!/\.docx$/i.test(f.name)) return toast('La plantilla debe ser un archivo Word .docx.', 'err');
    if (f.size > 2 * 1024 * 1024) return toast('La plantilla pesa más de 2 MB.', 'err');
    try { const Z = await cargarJSZip(), z = await Z.loadAsync(f), doc = await z.file('word/document.xml')?.async('string');
      if (!doc) throw new Error('El archivo no es un documento de Word válido.');
      const n = (doc.replace(/<[^>]+>/g, '').match(/\{\{\w+\}\}/g) || []).length;
      if (!n && !await confirmar('Plantilla sin campos', 'La plantilla no tiene ningún campo <span class="kbd">{{…}}</span>: el contrato saldrá siempre igual, sin datos de la persona. ¿Subirla de todos modos?', 'Subir', 'pri')) return;
      await api('rh_contrato_plantilla_guardar', { p_modulo: i.dataset.upp, p_nombre: f.name, p_contenido: await b64DeBlob(f) });
      toast(`Plantilla guardada${n ? ` (${n} campos)` : ''}.`, 'ok'); vistaContratos(); }
    catch (err) { toast(err.message, 'err'); } finally { i.value = ''; } });
}
